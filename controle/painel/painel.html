<title>Painel SOFi CPE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: painel de leitura mensal — cabeçalho com seletor de mês e carga do TXT; faixa de conferências do RCC; blocos de indicadores; evolução; pendências; consulta de conta. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#13202f; --ink2:#566476; --line:#d9dfe7;
  --accent:#1d5c8f; --accent-soft:#e3edf6; --bar2:#7a9cbf; --bar3:#b9cbe0;
  --ok:#1f7a4c; --ok-soft:#e2f3e9; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b4372f; --bad-soft:#f9e4e2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --card:#171f2a; --ink:#e5ebf2; --ink2:#98a6b7; --line:#2a3646;
  --accent:#78b0e4; --accent-soft:#1b2d42; --bar2:#4f7aa6; --bar3:#33506e;
  --ok:#5cc98d; --ok-soft:#15291f; --warn:#e5b35a; --warn-soft:#2d2512; --bad:#f08a82; --bad-soft:#341a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --card:#171f2a; --ink:#e5ebf2; --ink2:#98a6b7; --line:#2a3646;
  --accent:#78b0e4; --accent-soft:#1b2d42; --bar2:#4f7aa6; --bar3:#33506e;
  --ok:#5cc98d; --ok-soft:#15291f; --warn:#e5b35a; --warn-soft:#2d2512; --bad:#f08a82; --bad-soft:#341a19; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-size:22px;margin:0;line-height:1.2}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:0 0 10px;font-weight:600}
.num,td.n,.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:focus-visible,.months button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--ink2)}
.msg.err{color:var(--bad)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.checks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.chk{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 12px;background:var(--card)}
.chk.bad{border-left-color:var(--bad)} .chk.warn{border-left-color:var(--warn)}
.chk .t{font-weight:600;font-size:14px}
.chk .d{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .l{font-size:12px;color:var(--ink2)} .kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums} .kpi .x{font-size:12px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.up{color:var(--bad)} .down{color:var(--ok)}
svg text{fill:var(--ink2);font-family:var(--sans);font-size:11px}
.note{font-size:12.5px;color:var(--ink2)}
input[type=search]{font:inherit;width:100%;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.empty{padding:28px 8px;text-align:center;color:var(--ink2)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Painel SOFi · CPE</h1>
      <p class="sub">UE 1250057 · balancete PCASP mensal do SIAFI (nav. 99 › 03) · <span id="ref">—</span></p>
    </div>
    <div class="upl">
      <label class="btn" for="fileIn">Carregar balancete (.TXT)</label>
      <input id="fileIn" type="file" accept=".txt,.TXT,text/plain" hidden>
      <span class="msg" id="msg"></span>
    </div>
  </header>
  <div class="months" id="months" role="group" aria-label="Mês de referência"></div>
  <div id="main"><div class="empty">Carregando os meses salvos…</div></div>
</div>

<script>
function parseBalancete(txt){
  var MES={JANEIRO:1,FEVEREIRO:2,MARCO:3,"MARÇO":3,ABRIL:4,MAIO:5,JUNHO:6,JULHO:7,AGOSTO:8,SETEMBRO:9,OUTUBRO:10,NOVEMBRO:11,DEZEMBRO:12};
  var num=function(s){return parseFloat(s.replace(/\./g,"").replace(",","."));};
  var lines=txt.split(/\r?\n/), rows=[], ref=null, ue=null, tipo=null, gerado=null, tot=null;
  var re=/^\s*(\d(?:\.\d{1,2})*)\s+(.*?)\s{2,}([\d.]+,\d{2})(?: ([DC]))?\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})(?: ([DC]))?\s*$/;
  for(var i=0;i<lines.length;i++){
    var L=lines[i], m;
    if(!ref && (m=L.match(/REF\.:\s*([A-ZÇ]+)\s+DE\s+(\d{4})/))) ref={mes:MES[m[1]],ano:+m[2]};
    if(!ue && (m=L.match(/UNIDADE EXECUTORA:\s*([\d ]+?)\s+-/))) ue=m[1].replace(/\s/g,"");
    if(!tipo && (m=L.match(/B A L A N C E T E\s+(.+?)\s{2,}/))) tipo=m[1].replace(/ (?=\S)/g,"").replace(/\s+/g," ").trim();
    if(!gerado && (m=L.match(/DATA:\s*(\d\d\/\d\d\/\d{4})/))) gerado=m[1];
    if((m=L.match(/T O T A I S\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})/))) tot={d:num(m[2]),c:num(m[3])};
    if((m=L.match(re))){
      var a=num(m[3])*(m[4]==="C"?-1:1), s=num(m[7])*(m[8]==="C"?-1:1);
      var desc=m[2].trim();
      var nx=lines[i+1]||""; if(/^\s{20,}\S/.test(nx) && !re.test(nx) && !/PRODEMGE|T O T A I S|_{5}/.test(nx)) desc+=nx.trim();
      rows.push({c:m[1],n:desc,a:+a.toFixed(2),d:num(m[5]),k:num(m[6]),s:+s.toFixed(2)});
    }
  }
  if(!ref||!rows.length) throw new Error("Arquivo não reconhecido como balancete PCASP do SIAFI.");
  return {id:ref.ano+"-"+String(ref.mes).padStart(2,"0"),ano:ref.ano,mes:ref.mes,ue:ue,tipo:tipo,gerado:gerado,totais:tot,contas:rows};
}
var MESES=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var MESESL=["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var DATA={}, SEL=null, db=null, canWrite=false, Q="";
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(v){return (Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function mi(v){return (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi";}
function dc(v){return fmt(Math.abs(v))+(v>0.004?" D":v<-0.004?" C":"");}
function acc(m,c){var r=m&&m.contas.find(function(x){return x.c===c;});return r||{s:0,d:0,k:0,a:0,n:""};}
function s(m,c){return acc(m,c).s;}
function mov(m,c){var r=acc(m,c);return r.d-r.k;}
function ids(){return Object.keys(DATA).sort();}
function prev(id){var a=ids(),i=a.indexOf(id);return i>0?DATA[a[i-1]]:null;}
function label(m){return MESES[m.mes]+"/"+String(m.ano).slice(2);}

function checks(m){
  var forn=-(s(m,"2.1.3.1.1.01")+s(m,"2.1.8.9.1.01")), orc=-(s(m,"6.2.2.1.3.02")+s(m,"6.2.2.1.3.03")+s(m,"6.3.1.3")+s(m,"6.3.2.1"));
  var inc=s(m,"1.2.3.1.1.88.01"), incc=-s(m,"1.2.3.1.1.99.02");
  var caixa=s(m,"1.1.1.1.1.02")+s(m,"1.1.1.1.2.01.02")+s(m,"1.1.1.1.2.02.01.01.01"), obr=-s(m,"2.1");
  var t=m.totais||{d:0,c:0};
  return [
    {t:"Débitos = créditos",ok:Math.abs(t.d-t.c)<0.01,d:"Totais do balancete: "+fmt(t.d)+" × "+fmt(t.c)},
    {t:"Passivo × orçamento",ok:Math.abs(forn-orc)<0.01,d:"2.1.3.1.1.01 + 2.1.8.9.1.01 = "+fmt(forn)+" · 6.2.2.1.3.02 + .03 + RP liquidados = "+fmt(orc)},
    {t:"Bens a incorporar",ok:Math.abs(inc-incc)<0.01,d:"1.2.3.1.1.88.01 = "+fmt(inc)+" · 1.2.3.1.1.99.02 = "+fmt(incc)},
    {t:"Caixa × obrigações",ok:caixa>=obr,warn:true,d:"Caixa "+fmt(caixa)+" − obrigações "+fmt(obr)+" = sobra "+fmt(caixa-obr)+" (explicar em nota)"},
    {t:"Almoxarifado × RMA",ok:true,warn:true,manual:true,d:"Estoque 1.1.5.6.1 = "+fmt(s(m,"1.1.5.6.1"))+" · conferir com o RMA do mês"}
  ];
}

function renderMonths(){
  var a=ids();
  $("months").innerHTML=a.map(function(id){return '<button type="button" data-id="'+id+'" aria-pressed="'+(id===SEL)+'">'+label(DATA[id])+'</button>';}).join("");
}

function kpi(l,v,x){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(x?'<div class="x">'+x+'</div>':'')+'</div>';}
function delta(cur,old,inv){if(old==null)return "";var d=cur-old;if(Math.abs(d)<0.005)return '<span class="note">=</span>';var cls=(d>0)!==!!inv?"up":"down";return '<span class="'+cls+'">'+(d>0?"+":"−")+fmt(Math.abs(d))+'</span>';}

function chartGastos(){
  var a=ids(); if(!a.length)return "";
  var series=[["Diárias","3.3.2.1","var(--accent)"],["Serviços PJ","3.3.2.3","var(--bar2)"],["Consumo","3.3.1.1","var(--bar3)"]];
  var vals=a.map(function(id){return series.map(function(sr){return Math.max(0,mov(DATA[id],sr[1]));});});
  var max=Math.max.apply(null,vals.map(function(v){return v[0]+v[1]+v[2];}))||1;
  var step=Math.pow(10,Math.floor(Math.log10(max))); var top=Math.ceil(max/step)*step; if(top/step>8){step*=2;top=Math.ceil(max/step)*step;}
  var W=560,H=210,L=56,B=26,T=10,cw=(W-L-10)/a.length,bw=Math.min(46,cw*0.55);
  var y=function(v){return T+(H-T-B)*(1-v/top);};
  var g="";
  for(var t=0;t<=top+1;t+=step){g+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+(t/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+' mi</text>';}
  a.forEach(function(id,i){var x=L+cw*i+(cw-bw)/2,acc0=0;
    series.forEach(function(sr,j){var v=vals[i][j];g+='<rect x="'+x+'" y="'+y(acc0+v)+'" width="'+bw+'" height="'+Math.max(0,y(acc0)-y(acc0+v))+'" fill="'+sr[2]+'"><title>'+sr[0]+': '+fmt(v)+'</title></rect>';acc0+=v;});
    g+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(id===SEL?' style="font-weight:700"':'')+'>'+label(DATA[id])+'</text>';});
  return '<div class="tbl"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="Gasto por mês">'+g+'</svg></div><div class="legend">'+series.map(function(sr){return '<span style="--c:'+sr[2]+'">'+sr[0]+'</span>';}).join("")+'</div>';
}

function render(){
  renderMonths();
  var m=DATA[SEL];
  if(!m){$("main").innerHTML='<div class="empty">Nenhum balancete salvo ainda. Gere o balancete PCASP mensal no SIAFI (nav. 99 › 03), baixe o arquivo .TXT e use “Carregar balancete”.</div>';$("ref").textContent="—";return;}
  $("ref").textContent=MESESL[m.mes]+" de "+m.ano+" · gerado em "+(m.gerado||"?");
  var p=prev(SEL);
  var ck=checks(m), h="";
  h+='<section class="card"><h2>Conferências do RCC</h2><div class="checks">'+ck.map(function(c){var st=c.manual?"warn":c.ok?"ok":(c.warn?"warn":"bad");var tx=c.manual?"conferir":c.ok?"fecha":(c.warn?"atenção":"não fecha");return '<div class="chk '+(st==="ok"?"":st)+'"><div class="t">'+c.t+'<span class="pill '+st+'">'+tx+'</span></div><div class="d num">'+esc(c.d)+'</div></div>';}).join("")+'</div></section>';
  // execução
  var rec=s(m,"5.2.2.2.9"), pago=-s(m,"6.2.2.1.3.04"), alq=-s(m,"6.2.2.1.3.01"), emliq=-s(m,"6.2.2.1.3.02"), lap=-s(m,"6.2.2.1.3.03"), disp=-s(m,"6.2.2.1.1");
  var pct=function(v){return rec?(v/rec*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%":"—";};
  h+='<div class="grid"><section class="card"><h2>Execução do orçamento no ano</h2><div class="kpis">'+kpi("Crédito recebido",mi(rec),"5.2.2.2.9")+kpi("Pago",mi(pago),pct(pago)+" · 6.2.2.1.3.04")+kpi("Empenhado a liquidar",mi(alq),pct(alq)+" · 6.2.2.1.3.01")+kpi("Disponível",mi(disp),pct(disp)+" · 6.2.2.1.1")+'</div>'
    +'<div style="margin-top:12px" class="bar">'+[[pago,"var(--ok)"],[lap+emliq,"var(--warn)"],[alq,"var(--accent)"],[disp,"var(--bar3)"]].map(function(b){return '<i style="width:'+(rec?b[0]/rec*100:0)+'%;background:'+b[1]+'"></i>';}).join("")+'</div>'
    +'<div class="legend"><span style="--c:var(--ok)">pago</span><span style="--c:var(--warn)">liquidado/em liquidação a pagar '+fmt(lap+emliq)+'</span><span style="--c:var(--accent)">a liquidar</span><span style="--c:var(--bar3)">disponível</span></div></section>';
  // caixa
  var bco=s(m,"1.1.1.1.1.02"), cmi=s(m,"1.1.1.1.2.01.02"), cf=s(m,"1.1.1.1.2.02.01.01.01");
  var rows=[["Bancos (PRF) · 1.1.1.1.1.02",bco,p&&s(p,"1.1.1.1.1.02")],["Contas internas · 1.1.1.1.2.01.02",cmi,p&&s(p,"1.1.1.1.2.01.02")],["Cota financeira (fonte 10) · 1.1.1.1.2.02.01.01.01",cf,p&&s(p,"1.1.1.1.2.02.01.01.01")],
    ["Fornecedores · 2.1.3.1.1.01",-s(m,"2.1.3.1.1.01"),p&&-s(p,"2.1.3.1.1.01")],["Investimentos a pagar · 2.1.8.9.1.01",-s(m,"2.1.8.9.1.01"),p&&-s(p,"2.1.8.9.1.01")],
    ["IRRF retido · 2.1.8.8.1.01",-s(m,"2.1.8.8.1.01"),p&&-s(p,"2.1.8.8.1.01")],["INSS retido · 2.1.8.8.1.03",-s(m,"2.1.8.8.1.03"),p&&-s(p,"2.1.8.8.1.03")],["ISS retido · 2.1.8.8.1.88",-s(m,"2.1.8.8.1.88"),p&&-s(p,"2.1.8.8.1.88")]];
  h+='<section class="card"><h2>Caixa e obrigações no fim do mês</h2><div class="tbl"><table><thead><tr><th>Conta</th><th class="n">Saldo</th><th class="n">vs mês anterior</th></tr></thead><tbody>'+rows.map(function(r,i){return (i===3?'<tr><td colspan="3" style="border:0;padding-top:10px" class="note">Obrigações</td></tr>':'')+'<tr><td>'+r[0]+'</td><td class="n">'+fmt(r[1])+'</td><td class="n">'+(p?delta(r[1],r[2],i<3):"")+'</td></tr>';}).join("")+'</tbody></table></div></section></div>';
  // gastos
  var g=[["Diárias","3.3.2.1"],["Serviços de terceiros PJ","3.3.2.3"],["Serviços de terceiros PF","3.3.2.2"],["Consumo de material","3.3.1.1"],["Juros e multas de mora","3.4.2.3"],["Depreciação","3.3.3.1"]];
  h+='<div class="grid"><section class="card"><h2>Gasto por mês (diárias, serviços PJ, consumo)</h2>'+chartGastos()+'</section>';
  h+='<section class="card"><h2>Despesas (variações patrimoniais diminutivas)</h2><div class="tbl"><table><thead><tr><th>Item</th><th class="n">No mês</th><th class="n">No ano</th></tr></thead><tbody>'+g.map(function(r){return '<tr><td>'+r[0]+' <span class="note">'+r[1]+'</span></td><td class="n">'+fmt(mov(m,r[1]))+'</td><td class="n">'+fmt(s(m,r[1]))+'</td></tr>';}).join("")+'</tbody></table></div></section></div>';
  // pendências
  var pend=[["Diárias a conceder","1.1.3.1.1.01.90","zerar até dezembro"],["Diárias antecipadas concedidas","1.1.3.1.1.01.01","comprovar/baixar"],["Bens a incorporar","1.2.3.1.1.88.01","tombar no patrimônio"],["Bens a transferir","1.2.3.1.1.04","concluir transferência"],["Obras e instalações em andamento","1.2.3.2.1.03","nota explicativa"],["RP não processados a liquidar","6.3.1.1","revisar para cancelamento"],["Contratos de serviço a executar","8.1.2.3.2.01","compromisso futuro"],["Contratos de fornecimento a executar","8.1.2.3.1.01","compromisso futuro"]];
  var est=s(m,"1.1.5.6.1"), cons=s(m,"3.3.1.1"), meses=m.mes||12, mes_est=cons?est/(cons/meses):0;
  h+='<section class="card"><h2>Pendências e saldos a explicar</h2><div class="tbl"><table><thead><tr><th>Conta</th><th class="n">Saldo</th><th class="n">vs mês anterior</th><th>Ação</th></tr></thead><tbody>'+pend.map(function(r){var v=Math.abs(s(m,r[1])),o=p?Math.abs(s(p,r[1])):null;return '<tr><td>'+r[0]+' <span class="note">'+r[1]+'</span></td><td class="n">'+fmt(v)+'</td><td class="n">'+(p?delta(v,o):"")+'</td><td class="note">'+r[2]+'</td></tr>';}).join("")
    +'<tr><td>Almoxarifado: estoque × consumo médio <span class="note">1.1.5.6.1 / 3.3.1.1</span></td><td class="n">'+fmt(est)+'</td><td class="n">'+(mes_est?mes_est.toLocaleString("pt-BR",{maximumFractionDigits:1})+" meses":"")+'</td><td class="note">verificar itens parados</td></tr></tbody></table></div></section>';
  // evolução
  var evo=[["Caixa total",function(x){return s(x,"1.1.1.1.1.02")+s(x,"1.1.1.1.2.01.02")+s(x,"1.1.1.1.2.02.01.01.01");}],["Obrigações (passivo circulante)",function(x){return -s(x,"2.1");}],["Liquidado a pagar",function(x){return -s(x,"6.2.2.1.3.03");}],["Empenhado a liquidar",function(x){return -s(x,"6.2.2.1.3.01");}],["Crédito disponível",function(x){return -s(x,"6.2.2.1.1");}],["Pago no ano",function(x){return -s(x,"6.2.2.1.3.04");}],["RP não processados a liquidar",function(x){return -s(x,"6.3.1.1");}]];
  var a=ids();
  h+='<section class="card"><h2>Evolução mês a mês</h2><div class="tbl"><table><thead><tr><th>Indicador</th>'+a.map(function(id){return '<th class="n">'+label(DATA[id])+'</th>';}).join("")+'</tr></thead><tbody>'+evo.map(function(e){return '<tr><td>'+e[0]+'</td>'+a.map(function(id){return '<td class="n"'+(id===SEL?' style="font-weight:600"':'')+'>'+fmt(e[1](DATA[id]))+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div></section>';
  // consulta
  h+='<section class="card"><h2>Consultar qualquer conta do balancete</h2><input type="search" id="q" placeholder="Número ou nome da conta (ex.: 2.1.8.8 ou diárias)" value="'+esc(Q)+'"><div id="qres" class="tbl" style="margin-top:10px"></div></section>';
  $("main").innerHTML=h;
  renderQuery();
}
function renderQuery(){
  var el=$("qres"); if(!el)return; var m=DATA[SEL], q=Q.trim().toLowerCase();
  if(!q){el.innerHTML='<p class="note">Digite para ver o saldo da conta em cada mês salvo.</p>';return;}
  var hits=m.contas.filter(function(r){return r.c.indexOf(q)===0||r.n.toLowerCase().indexOf(q)>=0;}).slice(0,40), a=ids();
  if(!hits.length){el.innerHTML='<p class="note">Nenhuma conta encontrada neste mês.</p>';return;}
  el.innerHTML='<table><thead><tr><th>Conta</th>'+a.map(function(id){return '<th class="n">'+label(DATA[id])+'</th>';}).join("")+'</tr></thead><tbody>'+hits.map(function(r){return '<tr><td><span class="num">'+esc(r.c)+'</span> '+esc(r.n)+'</td>'+a.map(function(id){var x=DATA[id].contas.find(function(y){return y.c===r.c;});return '<td class="n">'+(x?dc(x.s):"—")+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table>';
}

$("months").addEventListener("click",function(e){var b=e.target.closest("button[data-id]");if(!b)return;SEL=b.dataset.id;try{localStorage.setItem("painel-sel",SEL);}catch(_){}render();});
$("main").addEventListener("input",function(e){if(e.target.id==="q"){Q=e.target.value;renderQuery();}});
$("fileIn").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f)return; var rd=new FileReader();
  rd.onload=async function(){
    var msg=$("msg"); msg.className="msg";
    try{
      var m=parseBalancete(rd.result);
      if(m.ue&&m.ue!=="1250057")throw new Error("Este balancete é da UE "+m.ue+", não do CPE (1250057).");
      var t=m.totais; if(!t||Math.abs(t.d-t.c)>0.01) msg.textContent="Atenção: totais de débito e crédito não batem. ";
      DATA[m.id]=m; SEL=m.id; render();
      if(db&&canWrite){await db.collection("meses").doc(m.id).set(m);msg.textContent+="Balancete de "+MESESL[m.mes]+"/"+m.ano+" salvo.";}
      else msg.textContent+="Balancete de "+MESESL[m.mes]+"/"+m.ano+" aberto só nesta tela (você não tem permissão para salvar).";
    }catch(err){msg.className="msg err";msg.textContent=(err&&err.message)||"Não foi possível ler o arquivo.";}
    e.target.value="";
  };
  rd.readAsText(f,"latin1");
});

(async function(){
  try{SEL=localStorage.getItem("painel-sel");}catch(_){}
  var timer=setTimeout(function(){if(!ids().length)$("main").innerHTML='<div class="empty">Não foi possível carregar os meses salvos. Você ainda pode abrir um balancete .TXT para ver nesta tela.</div>';},10000);
  var c=window.claude; if(!c||!c.use){clearTimeout(timer);render();return;}
  db=await c.use("db"); var user=await c.use("user");
  if(user){try{canWrite=(await user.can("data.write"))!==false;}catch(_){canWrite=true;}}
  if(!db){clearTimeout(timer);render();return;}
  db.collection("meses").onSnapshot(function(snap){clearTimeout(timer);DATA={};snap.docs.forEach(function(d){DATA[d.id]=d.data();});var a=ids();if(!SEL||!DATA[SEL])SEL=a[a.length-1]||null;render();},function(){clearTimeout(timer);render();});
})();
</script>
