<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador SIAFI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Só o terminal: 80 colunas x 26 linhas, centralizado, nada em volta.
     Tema único escuro, deliberado: imita o emulador 3270 do SIAFI. */
  :root {
    color-scheme: dark;
    --bg: #000;
    --txt: #46e36a;      /* campos protegidos */
    --lbl: #5fd7ff;      /* rotulos */
    --inp: #f4f4f4;      /* campos de digitacao */
    --msg: #ffe066;      /* linha de mensagem */
    --err: #ff6b6b;
    --dim: #2f8f45;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; padding: 12px; box-sizing: border-box; }
  #t {
    font-family: var(--mono);
    font-size: min(17px, calc((100vw - 24px) / 49));
    line-height: 1.32;
    color: var(--txt);
    white-space: pre;
    width: 80ch;
    min-height: 26lh;
  }
  #t .l { color: var(--lbl); }
  #t .m { color: var(--msg); }
  #t .e { color: var(--err); }
  #t .d { color: var(--dim); }
  #t .b { color: #fff; font-weight: 600; }
  #t .az { color: #7aa7ff; }       /* codigos e itens de menu (azul do 3270) */
  #t .w { color: #fff; font-weight: 600; }
  #t .r1 { color: #3fe0e6; }
  #t .r2 { color: #8fe03a; }
  #t .pf { cursor: pointer; }
  #t .pf:hover { color: #fff; }
  #t input {
    font: inherit; line-height: inherit; color: var(--inp); background: transparent;
    border: 0; padding: 0; margin: 0; text-transform: uppercase; caret-color: var(--inp);
    background-image: linear-gradient(var(--dim), var(--dim));
    background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 92%;
  }
  #t input:focus { outline: none; background-color: #0f2a17; }
  #t input.lc { text-transform: none; }
  #t input::placeholder { color: transparent; }
</style>
</head>
<body>
<div id="t" role="application" aria-label="Terminal SIAFI-MG de treinamento"></div>
<script>
(function () {
  "use strict";

  // ===================================================== tabelas do treino

  var SENHA = "TREINO";
  var UES = { "1250057": "CPE PMMG - OPERACIONAL" };
  var UPG = { "1250057": "0025" };
  var UPG_NOME = { "0025": "EXECUCAO DAS DESPESAS DO CPRV E UNIDADES SUBORDINADAS" };

  var CREDORES = {

    "22333444000181": { nome: "PAPELARIA MODELO LTDA", banco: "104", ag: "0987-1", cc: "12345-6" },

  // Especificacoes SIAD que a "integracao" devolve ao SIAFI.

    "4566": { proc: "1251655000300" + "2026", contrato: { tipo: "02", num: "9155" }, modalidade: "PREGAO" },

    "5102": { proc: "1251655000620" + "2026", contrato: { tipo: "02", num: "9170" }, modalidade: "PREGAO" },
    "5103": { proc: "1251655000630" + "2026", contrato: { tipo: "02", num: "9180" }, modalidade: "PREGAO" },
    // Modelo do relatorio SIAD "Relatorio de dados de especificacao" (39.21, contrato 009521970).
    "7256852": { proc: "0250457000025" + "2026", contrato: { tipo: "02", num: "9521970" }, modalidade: "PREGAO",
      // Dotacao orcamentaria do relatorio: UO 1251, 06 181 137 4366 0001, 3.3.90.39 item 21, F 10, IPU 8, IPG 1.
      dot: { pa: "4366", ca: "0001", nat: "339039", item: "21", fonte: "10", proc: "8", ipe: "1" },
      cnpj: "17676389000192", valor: 3740000 }
  };
  // Tabela Elemento/Item: exige especificacao SIAD?
  var EXIGE_ESPEC = ["30.05", "30.16", "30.17", "37.01", "37.02", "39.18", "39.21", "39.99"];
  // Anexo XIII do PARO: itens executados so na cota de Elemento/Item.
  var MARCADOS = ["30.23", "30.25", "30.26", "30.33", "30.34", "37.01", "37.02",
    "37.04", "37.05", "39.03", "39.12", "39.13", "39.15", "39.17", "39.18",
    "39.19", "39.20", "39.21", "39.34", "39.35", "39.43", "39.61", "39.69",
    "39.87", "40.02", "40.03", "40.04", "40.05", "40.06", "40.07", "92.02", "93.01"];

  var EVENTOS = [
    "CONTRIBUICAO/RETENCAO/DESCONTOS PREVIDENCIARIOS",
    "OUTRAS RETENCOES",
    "RESSARCIMENTO AO ESTADO-ORCAMENTO CORRENTE-RECURSOS TESOURO",
    "DEPOSITOS JUDICIAIS-OUTRAS DESPESAS CORRENTES",
    "FUNFIP-FUNDO FINANCEIRO PREVIDENCIARIO A RECOLHER",
    "RETENCAO DE CAUCOES E GARANTIAS DIVERSAS",
    "OUTROS IMPOSTOS A RECOLHER AO TESOURO ESTADUAL-ITCD"
  ];
  var HIST_EMP = ["PESSOAL E ENCARGOS SOCIAIS", "JUROS E ENCARGOS DA DIVIDA",
    "OUTRAS DESPESAS CORRENTES", "INVESTIMENTOS", "INVERSOES FINANCEIRAS", "AMORTIZACAO DA DIVIDA"];
  var TIPOS_OP = ["Credores Diversos", "Por Credor", "Com Desconto", "Por Codigo de Barras",
    "Recolhimento de Retencao por Credor", "Guia Previdenciaria de Retencao s/ Codigo de Barras",
    "Guia Previdenciaria por Empenho s/ Codigo de Barras", "Depositos Diversas Origens",
    "Credores Entidades e Agentes", "Suprimento de Caixa", "Compra de Moeda Estrangeira",
    "Sentenca Judicial", "Programas Sociais"];

  // Plano de contas do treino (estrutura do PCASP; ultimo nivel e saldos ficticios).
  var ACCTS = [
    ["cota",     "1.1.1.1.2.02.01.01.01", "D", "COTA FINANCEIRA A UTILIZAR"],
    ["estoque",  "1.1.5.6.1.01",          "D", "ALMOXARIFADO - MATERIAL DE CONSUMO"],
    ["fornec",   "2.1.3.1.1.01",          "C", "FORNECEDORES E CONTAS A PAGAR"],
    ["irrf",     "2.1.8.8.1.01",          "C", "IRRF A RECOLHER"],
    ["inss",     "2.1.8.8.1.03",          "C", "RETENCOES PREVIDENCIARIAS"],
    ["outras",   "2.1.8.8.1.88",          "C", "OUTRAS RETENCOES"],
    ["vpd",      "3.3.2.3.1.01",          "D", "VPD - SERVICOS DE TERCEIROS PJ"],
    ["credDisp", "6.2.2.1.1.00",          "C", "CREDITO DISPONIVEL"],
    ["empLiq",   "6.2.2.1.3.01",          "C", "CRED. EMPENHADO A LIQUIDAR"],
    ["liqPagar", "6.2.2.1.3.03",          "C", "CRED. EMPENHADO LIQUIDADO A PAGAR"],
    ["pago",     "6.2.2.1.3.04",          "C", "CRED. EMPENHADO PAGO"],
    ["ddr1",     "8.2.1.1.1.01",          "C", "DDR - DISPONIVEL"],
    ["ddr2",     "8.2.1.1.2.01",          "C", "DDR - COMPROMETIDA POR EMPENHO"],
    ["ddr3",     "8.2.1.1.3.01",          "C", "DDR - COMPROMETIDA POR LIQUIDACAO"],
    ["ddr4",     "8.2.1.1.4.01",          "C", "DDR - UTILIZADA"],
    ["cotaGlobal", "9.9.8.0.2.03.01",     "D", "COTA A EMPENHAR - GLOBAL (GMIFP)"],
    ["cotaItem",   "9.9.8.0.2.03.02",     "D", "COTA A EMPENHAR - ELEMENTO/ITEM"]
  ];
  var SALDOS = { cota: 4000000, estoque: 1865040, fornec: 210000, irrf: 0, inss: 0, outras: 0,
    vpd: 6122500, credDisp: 16500000, empLiq: 1530000, liqPagar: 210000, pago: 4875000,
    ddr1: 9500000, ddr2: 1530000, ddr3: 210000, ddr4: 4875000, cotaGlobal: 3800000, cotaItem: 9000000 };

  function novoEstado() {
    return {
      screen: "login", msg: "", msgErr: false, user: "", ue: "", ctx: {}, v19: true,
      contas: JSON.parse(JSON.stringify(SALDOS)),
      seqEmp: 862, seqOPg: 26, seqOPd: 29,
      emps: [
        empBase("845", "33444555000181", "339030", "17", "E", 1530000),
        (function () {
          var e = empBase("851", "44555666000181", "339039", "99", "O", 210000);
          e.liqs.push({ sq: 1, bruto: 210000, ret: [], liquido: 210000 });
          return e;
        })()
      ]
    };
  }
  function empBase(num, cnpj, nat, item, tipo, valor) {
    return { num: num, uo: "1251", prog: "06181701200100" + "01", nat: nat, item: item,
      fonte: "10", proc: "8", ipe: "1", cnpj: cnpj, tipo: tipo, empenhado: valor,
      reforcos: [], liqs: [], pagoNet: 0, pagoBruto: 0, espec: "", procSiad: "" };
  }

  var S = novoEstado();
  var CHAVE = "siafi-treino-v3";
  function salva() {
    try {
      var c = JSON.parse(JSON.stringify(S));
      c.msg = ""; // a senha nunca e guardada; so o estado do treino
      localStorage.setItem(CHAVE, JSON.stringify(c));
    } catch (e) {}
  }
  function recupera() {
    try {
      var d = JSON.parse(localStorage.getItem(CHAVE) || "null");
      if (d && d.contas && d.emps && !d.v19) { d.contas.cotaItem += 4500000; d.contas.credDisp += 4500000; d.v19 = true; }
      if (d && d.contas && d.emps) { S = d; S.screen = "login"; S.ctx = {}; S.user = ""; return true; }
    } catch (e) {}
    return false;
  }

  // ===================================================== utilitarios
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s.slice(0, n); }
  function lpad(s, n) { s = String(s); while (s.length < n) s = " " + s; return s; }
  function center(s, n) { s = String(s); var l = Math.max(0, Math.floor((n - s.length) / 2)); return pad(" ".repeat(l) + s, n); }
  function digits(x) { return String(x || "").replace(/\D/g, ""); }
  function brl(c) {
    var neg = c < 0; c = Math.abs(Math.round(c));
    var s = (c / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + s;
  }
  // Como no SIAFI: so numeros; os dois ultimos digitos sao os centavos.
  function valor(raw) { var t = String(raw || "").trim(); return /^\d+$/.test(t) ? parseInt(t, 10) : null; }
  function fmtCnpj(c) { c = digits(c); return c.length === 14 ? c.slice(0, 8) + "/" + c.slice(8, 12) + "-" + c.slice(12) : c; }
  function fmtProg(p) { p = digits(p); return [p.slice(0, 2), p.slice(2, 5), p.slice(5, 8), p.slice(8, 12), p.slice(12, 16)].join(" "); }
  function fmtProc(p) { p = digits(p); return p.slice(0, 7) + " " + p.slice(7, 10) + " " + p.slice(10); }
  function cnpjValido(c) {
    c = digits(c);
    if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
    function dv(b) {
      var w = b.length === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s = 0;
      for (var i = 0; i < b.length; i++) s += +b[i] * w[i];
      return s % 11 < 2 ? 0 : 11 - s % 11;
    }
    var d1 = dv(c.slice(0, 12)), d2 = dv(c.slice(0, 12) + d1);
    return c.slice(12) === "" + d1 + d2;
  }
  function elemItem(nat, item) { nat = digits(nat); item = digits(item); return nat.slice(4, 6) + "." + ("0" + item).slice(-2); }
  function hoje() { var d = new Date(); return [("0" + d.getDate()).slice(-2), ("0" + (d.getMonth() + 1)).slice(-2), d.getFullYear()]; }
  function hojeStr() { return hoje().join("/"); }
  function hora() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function say(m, err) { S.msg = m; S.msgErr = !!err; }
  function erro(m) { say(m, true); }
  function go(sc, msg) { S.screen = sc; say(msg || ""); }
  function findEmp(n) { n = String(parseInt(digits(n), 10)); return S.emps.filter(function (e) { return e.num === n; })[0] || null; }
  function liquidado(e) { return e.liqs.reduce(function (a, l) { return a + l.bruto; }, 0); }
  function liqNet(e) { return e.liqs.reduce(function (a, l) { return a + l.liquido; }, 0); }
  function totalEmp(e) { return e.empenhado + e.reforcos.reduce(function (a, r) { return a + r.valor; }, 0); }
  function saldoLiq(e) { return totalEmp(e) - liquidado(e); }
  function saldoPagar(e) { return liqNet(e) - e.pagoNet; }
  // Diario contabil do treino: cada documento grava as contas que movimentou.
  var LANC = null;
  function abreLanc(doc, desc, emp) { LANC = { data: hojeStr(), doc: doc, desc: desc, emp: emp || "", mov: {} }; }
  function fechaLanc() {
    if (LANC) {
      var m = Object.keys(LANC.mov).filter(function (k) { return LANC.mov[k]; });
      if (m.length) (S.diario = S.diario || []).push({ data: LANC.data, doc: LANC.doc, desc: LANC.desc, emp: LANC.emp,
        mov: m.map(function (k) { return [k, LANC.mov[k]]; }) });
    }
    LANC = null;
  }
  function mv(id, d) { S.contas[id] += d; if (LANC) LANC.mov[id] = (LANC.mov[id] || 0) + d; }

  // ===================================================== montagem da tela
  var W = 80;
  // f(): campo de digitacao com largura fixa em colunas.
  function f(id, len, o) {
    o = o || {};
    return '<input id="' + id + '" maxlength="' + len + '" size="' + len + '" style="width:' + len + 'ch"' +
      (o.pw ? ' type="password" class="lc"' : "") + ' autocomplete="off" spellcheck="false" data-def="' +
      esc(o.def == null ? "" : o.def) + '">';
  }
  function L(s) { return '<span class="l">' + esc(s) + "</span>"; }
  function B(s) { return '<span class="b">' + esc(s) + "</span>"; }
  function row(left, mid, right) { return pad(left, 12) + center(mid, 50) + lpad(right, 18); }
  function head(code, vcode, title, sub) {
    var u = S.user || "M000000";
    return [
      esc(row(code, "Estado de Minas Gerais", "PRODEMGE")),
      esc(row(vcode, "S I A F I - MG", hojeStr())),
      esc(row(u, title, hora())),
      esc(row("ANO: " + 2026, sub || "", "GA20")),
      esc("UE:  " + S.ue),
      '<span class="az">TREINAMENTO</span>'
    ];
  }
  // Caixa desenhada por cima da tela, como as janelas do SIAFI.
  function box(base, col, top, width, inner) {
    // A tela de baixo fica congelada: campos viram texto.
    var out = base.map(function (h) { return esc(strip(h)); });
    var lines = ["+" + "-".repeat(width - 2) + "+"].map(esc)
      .concat(inner.map(function (h) { return "|" + h + "|"; }))
      .concat([esc("+" + "-".repeat(width - 2) + "+")]);
    for (var i = 0; i < lines.length; i++) {
      var r = top + i;
      while (out.length <= r) out.push("");
      var plain = strip(out[r]);
      out[r] = esc(pad(plain, col).slice(0, col)) + lines[i];
    }
    return out;
  }
  // Linha interna de caixa: texto + campos, com largura visivel exata.
  function bl(width, parts) {
    var vis = 0, h = "";
    parts.forEach(function (p) {
      if (typeof p === "string") { h += esc(p); vis += p.length; }
      else { h += p.h; vis += p.w; }
    });
    return h + esc(" ".repeat(Math.max(0, width - 2 - vis)));
  }
  function F(id, len, o) { return { h: f(id, len, o), w: len }; }
  function H(html, w) { return { h: html, w: w }; }
  function strip(h) {
    var d = document.createElement("div"); d.innerHTML = h;
    Array.prototype.forEach.call(d.querySelectorAll("input"), function (el) {
      var n = +el.getAttribute("maxlength"), v = el.getAttribute("data-def") || "";
      el.replaceWith(document.createTextNode(v ? pad(v, n) : "_".repeat(n)));
    });
    return d.textContent;
  }

  var PFRULER = "Enter-PF1---PF2---PF3---PF4---PF5---PF6---PF7---PF8---PF9---PF10--PF11--PF12--";
  function ruler(labels) {
    var r1 = PFRULER.replace(/PF(\d+)/g, function (m, n) {
      return '<span class="pf" data-pf="' + n + '">' + m + "</span>";
    });
    var r2 = " ".repeat(W).split("");
    Object.keys(labels || {}).forEach(function (k) {
      var i = PFRULER.indexOf("PF" + k + "-"); if (i < 0) return;
      var t = labels[k]; for (var j = 0; j < t.length; j++) r2[i + j] = t[j];
    });
    var s2 = esc(r2.join("").replace(/\s+$/, ""));
    Object.keys(labels || {}).forEach(function (k) {
      s2 = s2.replace(labels[k], '<span class="pf" data-pf="' + k + '">' + esc(labels[k]) + "</span>");
    });
    return [r1, s2];
  }

  // ===================================================== telas
  var SC = {};

  // ---- login (modelo de treino: so aceita o usuario de treinamento)
  // Rodape proprio (telas de acesso e de selecao de UE nao usam a regua de PFs).
  function rodape(itens) {
    var h = "", col = 0;
    itens.forEach(function (it) {
      h += esc(" ".repeat(Math.max(0, it[0] - col))) + '<span class="pf az" data-pf="' + it[1] + '">' + esc(it[2]) + "</span>";
      col = it[0] + it[2].length;
    });
    return h;
  }
  function horaSeg() { var d = new Date(); return hora() + ":" + ("0" + d.getSeconds()).slice(-2); }
  function az(t) { return '<span class="az">' + esc(t) + "</span>"; }
  function wb(t) { return '<span class="w">' + esc(t) + "</span>"; }

  // ---- Tela de acesso (modelo de treino: a senha e sempre TREINO)
  SC.login = {
    pf: {},
    footer: function () {
      return [rodape([[0, 1, "PF1-Duvidas"], [28, 5, "PF5-Recuperacao de Senha"], [66, 6, "PF6-Mensagens"]]),
        rodape([[0, 11, "PF11-Reiniciar dados do treino"], [66, 12, "PF12-Fim"]])];
    },
    draw: function () {
      var d = hoje();
      return [
        az(pad("SIAFI-TREINO", 70)) + az(d[0] + "/" + d[1] + "/" + String(d[2]).slice(-2)),
        az(pad("", 70) + horaSeg()),
        "", "", "",
        '<span class="m">' + esc(center("A M B I E N T E   D E   T R E I N A M E N T O", W)) + "</span>",
        "",
        wb(center("S I A F I - M G   (SIMULADOR)", W)),
        "",
        '<span class="d">' + esc(center("Dados ficticios. Nada do que for digitado aqui sai deste navegador.", W)) + "</span>",
        '<span class="d">' + esc(center("Senha de treinamento: TREINO  (nunca use sua senha real)", W)) + "</span>",
        "", "", "", "", "",
        L("Aplicacao: ") + f("app", 8),
        L("Usuario  : ") + f("usr", 7),
        L("Senha    : ") + f("pwd", 8, { pw: true })
      ];
    },
    enter: function (v) {
      if (!v.app) return erro("0001-INFORME A APLICACAO.");
      if (v.app.trim().toUpperCase() !== "SIMG") return erro("0003-APLICACAO INVALIDA. PARA O SIAFI-MG INFORME: SIMG");
      if (!v.usr || !v.pwd) return erro("0001-INFORME USUARIO E SENHA.");
      // A aplicacao do SIAFI-MG e SIMG; qualquer codigo de usuario serve; a senha e
      // sempre a de treino, para ninguem digitar aqui a senha de um sistema real.

        bl(W2, [" Ano Exercicio:      2026"]), bl(W2, [" Unid. Executora:    " + S.ue]),
        bl(W2, [" Unid. Orcamentaria: ", F("uo", 4)]), bl(W2, [" CNPJ/Credor:        " + S.ctx.cnpj]),
        bl(W2, [" GMI FP:             ", F("gmi", 4), " ", F("fp", 3)]), bl(W2, [" Ordenador Despesa:  ", F("ord", 7)]),
        bl(W2, [" ---------Enter---PF3---PF6------"]), bl(W2, ["                Volta U.O."])]);
    },
    enter: function (v) {
      var uo = digits(v.uo), gmi = digits(v.gmi), fp = digits(v.fp), ord = digits(v.ord);
      if (!uo || !gmi || !fp || !ord) return erro("0004-CAMPO DE PREENCHIMENTO OBRIGATORIO.");
      if (!UOS[uo]) return erro("0016-UNIDADE ORCAMENTARIA NAO CADASTRADA. TECLE PF6 PARA SELECIONAR.");
      if (!ORDS[ord]) return erro("0024-ORDENADOR DE DESPESA NAO CADASTRADO PARA A UNIDADE.");
      if (retSaldo(S.ctx.cnpj, gmi, fp) <= 0) return erro("0160-NAO HA RETENCAO A RECOLHER PARA O CREDOR/GMI/FP INFORMADO.");
      S.ctx.uo = uo; S.ctx.gmi = gmi; S.ctx.fp = fp; S.ctx.ord = ord; go("popCBBarras");
    },
    pf6: function () { setVal("uo", "1251"); say("0020-UNIDADE ORCAMENTARIA SELECIONADA: 1251."); },
    pf3: function () { go("popCBConv"); }
  };
  SC.popCBBarras = {
    pf: { 3: "Volta" },
    draw: function () {
      var W2 = 64;
      return box(SC.popCBConv.draw(), 10, 12, W2, [bl(W2, ["            Codigo de Barras - Pagamento de Tributos"]),
        bl(W2, [" Credor:"]), bl(W2, [" " + fmtCnpj(S.ctx.cnpj) + " - " + CREDORES[S.ctx.cnpj].nome]), bl(W2, [""]),
        bl(W2, [" Codigo de Barras:"]),
        bl(W2, [" ", F("b1", 11), " ", F("d1", 1), " ", F("b2", 11), " ", F("d2", 1), " ", F("b3", 11), " ", F("d3", 1), " ", F("b4", 11), " ", F("d4", 1)]),
        bl(W2, [" ------------------------Enter---PF3--------------------------"]), bl(W2, ["                              Volta"])]);
    },
    enter: function (v) {
      var b = [v.b1, v.b2, v.b3, v.b4].map(digits), d = [v.d1, v.d2, v.d3, v.d4].map(digits);
      for (var i = 0; i < 4; i++) {
        if (b[i].length !== 11 || d[i].length !== 1) return erro("0004-INFORME O CODIGO DE BARRAS COMPLETO (4 BLOCOS DE 11 DIGITOS + DV).");
        if (mod10(b[i]) !== +d[i]) return erro("0161-DIGITO VERIFICADOR DO " + (i + 1) + "o BLOCO INVALIDO. CONFIRA A DIGITACAO.");
      }
      var cod = b.join("");
      if (cod.charAt(0) !== "8") return erro("0162-CODIGO DE BARRAS NAO E DE ARRECADACAO (DEVE INICIAR COM 8).");
      S.ctx.barra = b.map(function (x, i) { return x + " " + d[i]; }).join(" ");
      S.ctx.vlBarra = parseInt(cod.slice(4, 15), 10);
      go("opCBReg");
    },
    pf3: function () { go("popCBRet"); }
  };
  function cabCB(code, vcode, title) {
    var cr = CREDORES[S.ctx.cnpj];
    return [esc(row(code, "Estado de Minas Gerais", "PRODEMGE")), esc(row(vcode, "S I A F I - MG", hojeStr())),
      esc(row(S.user, title, hora())), esc(row("", "Pagamento por Codigo de Barra - Retencao", "GAS3")),
      L("Ano Exercicio: ") + "2026 " + L("GMI FP: ") + S.ctx.gmi + " " + S.ctx.fp,
      L("Unid. Executora:    ") + esc(S.ue + " - " + UES[S.ue]), L("Unid. Orcamentaria: ") + esc(S.ctx.uo + " - PMMG"),
      L("Credor NF/Fatura: ") + esc(fmtCnpj(S.ctx.cnpj) + " - " + cr.nome)];
  }
  SC.opCBReg = {
    pf: { 3: "Volta", 9: "MenuP", 12: "Fim" },
    draw: function () {
      var c = S.ctx;
      var l = cabCB("NFCAEK35", "VFCAEK35", "Registrar Ordem de Pagamento Bancaria");
      l.push(L("Conta Debitar:   ") + f("cu", 1) + " " + L("Conta Unica"),
        "                 " + f("ob", 1) + " " + L("Banco: ") + f("bB", 3) + " " + L("Agencia: ") + f("bA", 5) + " - " + f("bAd", 1) +
          " " + L("Conta: ") + f("bC", 6) + " - " + f("bCd", 1),
        L("Nr. Empenho da Multa             : ") + f("emM", 7) + "  " + L("Valor: ") + f("vM", 15),
        L("Nr. Empenho da Taxa de Expediente: ") + f("emT", 7) + "  " + L("Valor: ") + f("vT", 15),
        "  " + L("Ano Ret./Emp.") + "              " + L("Vl. Cod. Barra: ") + esc(lpad(brl(c.vlBarra), 15)),
        "  2026 2026                  " + L("Saldo a Pagar:  ") + esc(lpad(brl(retSaldo(c.cnpj, c.gmi, c.fp)), 15)),
        "                             " + L("Valor Retencao: ") + f("vR", 15), "",
        L("Ordenador Despesa: ") + esc(c.ord + " - " + ORDS[c.ord]));
      return l;
    },
    enter: function (v) {
      var c = S.ctx, up = function (x) { return (x || "").toUpperCase(); };
      var cu = up(v.cu) === "X", ob = up(v.ob) === "X";
      if (cu === ob) return erro("0033-MARQUE 'X' EM CONTA UNICA OU NO BANCO A DEBITAR.");
      if (ob && (!digits(v.bB) || !digits(v.bA) || !digits(v.bC))) return erro("0034-INFORME BANCO, AGENCIA E CONTA A DEBITAR.");
      var vR = valor(v.vR) || 0, vT = valor(v.vT) || 0, vM = valor(v.vM) || 0;
      if (!vR) return erro("0022-INFORME O VALOR DA RETENCAO. SO NUMEROS, SEM PONTO NEM VIRGULA.");
      if (vR > retSaldo(c.cnpj, c.gmi, c.fp)) return erro("0163-VALOR DA RETENCAO MAIOR QUE O SALDO A PAGAR.");
      var extra = [];
      if (vT || digits(v.emT)) extra.push(["taxa", digits(v.emT), vT]);
      if (vM || digits(v.emM)) extra.push(["multa", digits(v.emM), vM]);
      for (var i = 0; i < extra.length; i++) {
        var e = findEmp(extra[i][1] || "0");
        if (!e || !extra[i][2]) return erro("0164-INFORME O EMPENHO E O VALOR DA " + extra[i][0].toUpperCase() + ".");
        if (e.cnpj !== c.cnpj) return erro("0049-EMPENHO " + e.num + " NAO PERTENCE AO CREDOR INFORMADO.");
        if (extra[i][2] > saldoPagar(e)) return erro("0052-VALOR MAIOR QUE O SALDO A PAGAR DO EMPENHO " + e.num + ".");
      }
      if (vR + vT + vM !== c.vlBarra) return erro("0165-SOMA DOS VALORES (" + brl(vR + vT + vM) + ") DIFERENTE DO VALOR DO CODIGO DE BARRAS.");
      c.vR = vR; c.extra = extra;
      c.conta = cu ? "Conta Unica" : "Banco: " + digits(v.bB) + " Agencia: " + digits(v.bA) + "-" + digits(v.bAd) + " Conta: " + digits(v.bC) + "-" + digits(v.bCd);
      c.hist = { tipo: "OP", titulo: "Ordem de Pagamento Bancaria", padraoFixo: 1, padraoTxt: "REGISTRO ORDEM PAGAMENTO BANCARIA",
        ref: "PAGAMENTO REFERENTE A", fim: "opCBResumo" };
      go("histRef");
    },
    pf3: function () { go("popCBBarras"); }
  };
  SC.opCBResumo = {
    pf: { 2: "Anula", 3: "Volta", 5: "Conf", 9: "MenuP", 12: "Fim" },
    draw: function () {
      var c = S.ctx;
      var l = cabCB("NFCAEK35", "VFCAEK3C", "Resumo Ordem de Pagamento Bancaria");
      l[4] = L("Ano Exercicio: ") + "2026 " + L("Nr.Doc: ") + (c.doc || "") + "   " + L("GMI FP: ") + c.gmi + " " + c.fp;
      var tx = (c.extra || []).filter(function (x) { return x[0] === "taxa"; })[0], mu = (c.extra || []).filter(function (x) { return x[0] === "multa"; })[0];
      l.push(L("Conta Debitada:   ") + esc(c.conta), L("Codigo de Barra:  ") + esc(c.barra),
        L("Nr. Empenho Multa: ") + (mu ? mu[1] : "") + "   " + L("Nr. Empenho Taxa: ") + (tx ? tx[1] : ""), "",
        "                    " + L("Total Retencao: ") + esc(lpad(brl(c.vR), 15)),
        "                    " + L("Vl. Multa:      ") + esc(lpad(mu ? brl(mu[2]) : "", 15)),
        "                    " + L("Vl. Taxa Exped.:") + esc(lpad(tx ? brl(tx[2]) : "", 15)),
        "                    " + L("Vl. Ordem Pagto:") + esc(lpad(brl(c.vlBarra), 15)), "",
        L("Ordenador Despesa: ") + esc(c.ord + " - " + ORDS[c.ord]));
      return l;
    },
    pf5: function () {
      var c = S.ctx;
      if (c.doc) return;
      var rest = c.vR, emps = [];
      abreLanc("OP " + (S.seqOPd + 1), "PAGAMENTO POR CODIGO DE BARRAS", "");
      (S.retPend || []).forEach(function (r) {
        if (!rest || r.cnpj !== c.cnpj || r.gmi !== c.gmi || r.fp !== c.fp || !r.saldo) return;
        var x = Math.min(r.saldo, rest); r.saldo -= x; rest -= x;
        if (emps.indexOf(r.emp) < 0) emps.push(r.emp); LANC.desc = "RECOLHIMENTO DE RETENCAO (GUIA)";
        mv(r.ev === 0 ? "inss" : "outras", -x);
      });
      (c.extra || []).forEach(function (x) {
        var e = findEmp(x[1]), bruto = Math.round(x[2] * liquidado(e) / liqNet(e));
        if (emps.indexOf(e.num) < 0) emps.push(e.num);
        e.pagoNet += x[2]; e.pagoBruto += bruto;
        (e.pags = e.pags || []).push({ data: hojeStr(), valor: x[2], doc: "" });
        mv("liqPagar", -bruto); mv("pago", bruto); mv("ddr3", -bruto); mv("ddr4", bruto); mv("fornec", -x[2]);
      });
      mv("cota", -c.vlBarra);
      S.seqOPd += 1; c.doc = String(S.seqOPd);
      if (LANC) LANC.emp = emps.join(",");
      fechaLanc();
      say("0011-REGISTRO EFETUADO.");
    },
    enter: function () { if (S.ctx.doc) go("m71"); },
    pf2: function () { if (!S.ctx.doc) go("m71", "0013-REGISTRO ANULADO."); },
    pf3: function () { go("m71"); }
  };

  // ===================================================== motor
  var T = document.getElementById("t");
  var telaAnterior = null, keep = {};
  function fieldEls() { return Array.prototype.slice.call(T.querySelectorAll("input")); }
  function setVal(id, v) { var el = document.getElementById(id); if (el) el.value = v; keep[id] = v; }
  function clearFields() { fieldEls().forEach(function (el) { el.value = ""; }); keep = {}; }
  function vals() { var o = {}; fieldEls().forEach(function (el) { o[el.id] = el.value.trim(); }); return o; }

  var ERR_CAMPO = { "0141": "espec", "0142": "pUn", "0143": "espec", "0024": "ord", "0020": "cr1", "0021": "cr1",
    "0148": "cr1", "0012": "pa", "0145": "pa", "0146": "nat", "0019": "nat", "0026": "fonte", "0147": "fonte",
    "0138": "upg", "0022": "valor", "0149": "valor", "0031": "valor", "0025": "tipo" };
  function render() {
    var sc = SC[S.screen];
    // Na mesma tela (erro, segunda fase), o que foi digitado continua la.
    if (telaAnterior === S.screen) fieldEls().forEach(function (el) { keep[el.id] = el.value; });
    else keep = {};
    telaAnterior = S.screen;
    var lines = sc.draw();
    while (lines.length < 23) lines.push("");
    lines = lines.slice(0, 23);
    var msg = S.msg ? '<span class="' + (S.msgErr ? "e" : "m") + '">' + esc(S.msg) + "</span>" : "";
    var r = ruler(sc.pf);
    r = sc.footer ? sc.footer() : ['<span class="r1">' + r[0] + "</span>", '<span class="r2">' + r[1] + "</span>"];
    if (/Estado de Minas Gerais/.test(lines[0]) && lines[0].indexOf("<") < 0) {
      for (var i = 0; i < 5; i++) {
        var t = lines[i]; if (!t || t.indexOf("<") >= 0) continue;
        if (i === 4) { if (/^UE:/.test(t)) lines[i] = '<span class="w">' + t + "</span>"; continue; }
        var a = t.slice(0, 12), m = t.slice(12, 62), z = t.slice(62);
        var zc = /PRODEMGE|GA20/.test(z) ? "az" : "w";
        lines[i] = '<span class="' + (i === 3 ? "w" : "az") + '">' + a + '</span><span class="w">' + m +
          '</span><span class="' + zc + '">' + z + "</span>";
      }
    }
    T.innerHTML = [msg].concat(lines).concat(r).join("\n");
    fieldEls().forEach(function (el) {
      var d = el.getAttribute("data-def");
      if (keep[el.id] != null && keep[el.id] !== "") el.value = keep[el.id];
      else if (d) el.value = d;
    });
    if (sc.after) sc.after();
    // Depois de um erro, o cursor vai para o campo com problema, todo selecionado:
    // o que for digitado substitui o conteudo antigo.
    var ef = S.msgErr && ERR_CAMPO[(S.msg || "").slice(0, 4)];
    var efEl = ef && document.getElementById(ef);
    if (efEl) { efEl.focus(); efEl.select(); }
    else {
      var first = fieldEls().filter(function (el) { return !el.value; })[0] || fieldEls()[0];
      if (first) first.focus();
    }
    if (S.screen !== "login") salva();
  }

  function pf(n) {
    var sc = SC[S.screen], v = vals(), fn = sc["pf" + n];
    if (n === 12 && !fn) { S.user = ""; S.ctx = {}; go("login", "0000-SESSAO ENCERRADA."); return render(); }
    if (n === 9 && !fn && S.screen !== "login" && S.screen !== "ueSel") { S.ctx = {}; go("subs"); return render(); }
    if (fn) fn(v); else erro("0015-TECLA INVALIDA.");
    render();
  }

  document.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if ((k === "Enter" && (ev.ctrlKey || ev.metaKey)) || k === "F5") { ev.preventDefault(); return pf(5); }
    if (k === "Escape") { ev.preventDefault(); return pf(3); }
    var m = /^F(\d{1,2})$/.exec(k);
    if (m) { ev.preventDefault(); return pf(+m[1]); }
    if (k === "Enter") {
      ev.preventDefault();
      var sc = SC[S.screen];
      if (sc.enter) sc.enter(vals()); else erro("0017-TECLE PF5 PARA CONFIRMAR OU PF2 PARA ANULAR.");
      return render();
    }
    var els = fieldEls(), i = els.indexOf(document.activeElement);
    if (k === "ArrowDown" || k === "ArrowUp") {
      ev.preventDefault();
      if (!els.length) return;
      var j = i < 0 ? 0 : (i + (k === "ArrowDown" ? 1 : -1) + els.length) % els.length;
      els[j].focus(); els[j].select();
    }
  });
  // Salto automatico para o proximo campo quando o cursor chega ao fim (como no 3270).
  function avanca(el) {
    var els = fieldEls(), i = els.indexOf(el);
    if (i >= 0 && i < els.length - 1) { els[i + 1].focus(); els[i + 1].select(); }
  }
  T.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.tagName === "INPUT" && el.value.length >= +el.maxLength && el.selectionStart >= +el.maxLength) avanca(el);
  });
  // Digitacao por cima (sobrescreve), como no terminal 3270: clicar num campo
  // preenchido e digitar troca os caracteres em vez de empurra-los.
  T.addEventListener("beforeinput", function (ev) {
    var el = ev.target;
    if (el.tagName !== "INPUT" || ev.inputType !== "insertText" || !ev.data || ev.data.length !== 1) return;
    if (clicado === el) {
      clicado = null; ev.preventDefault();
      el.value = ev.data; el.setSelectionRange(1, 1);
      if (+el.maxLength <= 1) avanca(el);
      return;
    }
    var a = el.selectionStart, b = el.selectionEnd, v = el.value, max = +el.maxLength;
    if (a !== b || a >= v.length) return;
    ev.preventDefault();
    el.value = v.slice(0, a) + ev.data + v.slice(a + 1);
    el.setSelectionRange(a + 1, a + 1);
    if (a + 1 >= max) avanca(el);
  });
  // Clicar num campo preenchido e digitar substitui o valor antigo inteiro.
  // (Setas, Backspace ou Delete logo apos o clique permitem corrigir so um digito.)
  var clicado = null;
  T.addEventListener("mousedown", function (ev) {
    var el = ev.target; clicado = el.tagName === "INPUT" && el.value ? el : null;
  }, true);
  document.addEventListener("keydown", function (ev) { if (ev.key.length !== 1) clicado = null; }, true);
  // A regua de PF tambem responde ao clique (teclados sem F1-F12).
  T.addEventListener("mousedown", function (ev) {
    var p = ev.target.closest && ev.target.closest(".pf");
    if (p) { ev.preventDefault(); pf(+p.getAttribute("data-pf")); }
  });

  if (recupera()) say("0000-INFORME USUARIO E SENHA. SEU PROGRESSO NO TREINAMENTO FOI MANTIDO.");
  else say("0000-INFORME USUARIO E SENHA.");
  render();
})();
</script>
</body>
</html>
