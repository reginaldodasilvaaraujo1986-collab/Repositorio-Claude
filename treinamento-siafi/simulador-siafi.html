<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador SIAFI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Só o terminal: 80 colunas x 26 linhas, centralizado, nada em volta.
     Tema único escuro, deliberado: imita o emulador 3270 do SIAFI. */
  :root {
    color-scheme: dark;
    --bg: #000;
    --txt: #46e36a;      /* campos protegidos */
    --lbl: #5fd7ff;      /* rotulos */
    --inp: #f4f4f4;      /* campos de digitacao */
    --msg: #ffe066;      /* linha de mensagem */
    --err: #ff6b6b;
    --dim: #2f8f45;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; padding: 12px; box-sizing: border-box; }
  #t {
    font-family: var(--mono);
    font-size: min(17px, calc((100vw - 24px) / 49));
    line-height: 1.32;
    color: var(--txt);
    white-space: pre;
    width: 80ch;
    min-height: 26lh;
  }
  #t .l { color: var(--lbl); }
  #t .m { color: var(--msg); }
  #t .e { color: var(--err); }
  #t .d { color: var(--dim); }
  #t .b { color: #fff; font-weight: 600; }
  #t .pf { cursor: pointer; }
  #t .pf:hover { color: #fff; }
  #t input {
    font: inherit; line-height: inherit; color: var(--inp); background: transparent;
    border: 0; padding: 0; margin: 0; text-transform: uppercase; caret-color: var(--inp);
    background-image: linear-gradient(var(--dim), var(--dim));
    background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 92%;
  }
  #t input:focus { outline: none; background-color: #0f2a17; }
  #t input.lc { text-transform: none; }
  #t input::placeholder { color: transparent; }
</style>
</head>
<body>
<div id="t" role="application" aria-label="Terminal SIAFI-MG de treinamento"></div>
<script>
(function () {
  "use strict";

  // ===================================================== tabelas do treino
  // Todos os codigos e nomes abaixo sao ficticios, para treinamento.
  var SENHA = "TREINO";
  var UES = { "1250057": "UNIDADE DE TREINAMENTO PMMG - OPERACIONAL" };
  var UOS = { "1251": "POLICIA MILITAR DO ESTADO DE MINAS GERAIS" };
  var ORDS = { "350057": "ORDENADOR DE DESPESA - TREINAMENTO" };
  var CREDORES = {
    "11222333000181": { nome: "APOIO TOTAL SERVICOS LTDA", banco: "001", ag: "1234-5", cc: "98765-0" },
    "22333444000181": { nome: "PAPELARIA MODELO LTDA", banco: "104", ag: "0987-1", cc: "12345-6" },
    "33444555000181": { nome: "COMERCIAL ALFA LTDA", banco: "237", ag: "0001-2", cc: "55555-5" },
    "44555666000181": { nome: "SERVICOS BETA LTDA", banco: "341", ag: "3380-0", cc: "77777-7" },
    "29979036000140": { nome: "INSTITUTO NACIONAL DO SEGURO SOCIAL" },
    "18715383000140": { nome: "MUNICIPIO DE BELO HORIZONTE" }
  };
  // Especificacoes SIAD que a "integracao" devolve ao SIAFI.
  var ESPECS = {
    "4812": { proc: "1250057412" + "2026", contrato: { tipo: "02", num: "9140" }, modalidade: "PREGAO" },
    "4566": { proc: "1250057300" + "2026", contrato: { tipo: "02", num: "9155" }, modalidade: "PREGAO" }
  };
  // Tabela Elemento/Item: exige especificacao SIAD?
  var EXIGE_ESPEC = ["30.05", "30.17", "37.02", "39.99"];
  // Anexo XIII do PARO: itens executados so na cota de Elemento/Item.
  var MARCADOS = ["30.23", "30.25", "30.26", "30.33", "30.34", "37.01", "37.02",
    "37.04", "37.05", "39.03", "39.12", "39.13", "39.15", "39.17", "39.18",
    "39.19", "39.20", "39.21", "39.34", "39.35", "39.43", "39.61", "39.69",
    "39.87", "40.02", "40.03", "40.04", "40.05", "40.06", "40.07", "92.02", "93.01"];

  var EVENTOS = [
    "CONTRIBUICAO/RETENCAO/DESCONTOS PREVIDENCIARIOS",
    "OUTRAS RETENCOES",
    "RESSARCIMENTO AO ESTADO-ORCAMENTO CORRENTE-RECURSOS TESOURO",
    "DEPOSITOS JUDICIAIS-OUTRAS DESPESAS CORRENTES",
    "FUNFIP-FUNDO FINANCEIRO PREVIDENCIARIO A RECOLHER",
    "RETENCAO DE CAUCOES E GARANTIAS DIVERSAS",
    "OUTROS IMPOSTOS A RECOLHER AO TESOURO ESTADUAL-ITCD"
  ];
  var HIST_EMP = ["PESSOAL E ENCARGOS SOCIAIS", "JUROS E ENCARGOS DA DIVIDA",
    "OUTRAS DESPESAS CORRENTES", "INVESTIMENTOS", "INVERSOES FINANCEIRAS", "AMORTIZACAO DA DIVIDA"];
  var TIPOS_OP = ["Credores Diversos", "Por Credor", "Com Desconto", "Por Codigo de Barras",
    "Recolhimento de Retencao por Credor", "Guia Previdenciaria de Retencao s/ Codigo de Barras",
    "Guia Previdenciaria por Empenho s/ Codigo de Barras", "Depositos Diversas Origens",
    "Credores Entidades e Agentes", "Suprimento de Caixa", "Compra de Moeda Estrangeira",
    "Sentenca Judicial", "Programas Sociais"];

  // Plano de contas do treino (estrutura do PCASP; ultimo nivel e saldos ficticios).
  var ACCTS = [
    ["cota",     "1.1.1.1.2.02.01.01.01", "D", "COTA FINANCEIRA A UTILIZAR"],
    ["estoque",  "1.1.5.6.1.01",          "D", "ALMOXARIFADO - MATERIAL DE CONSUMO"],
    ["fornec",   "2.1.3.1.1.01",          "C", "FORNECEDORES E CONTAS A PAGAR"],
    ["irrf",     "2.1.8.8.1.01",          "C", "IRRF A RECOLHER"],
    ["inss",     "2.1.8.8.1.03",          "C", "RETENCOES PREVIDENCIARIAS"],
    ["outras",   "2.1.8.8.1.88",          "C", "OUTRAS RETENCOES"],
    ["vpd",      "3.3.2.3.1.01",          "D", "VPD - SERVICOS DE TERCEIROS PJ"],
    ["credDisp", "6.2.2.1.1.00",          "C", "CREDITO DISPONIVEL"],
    ["empLiq",   "6.2.2.1.3.01",          "C", "CRED. EMPENHADO A LIQUIDAR"],
    ["liqPagar", "6.2.2.1.3.03",          "C", "CRED. EMPENHADO LIQUIDADO A PAGAR"],
    ["pago",     "6.2.2.1.3.04",          "C", "CRED. EMPENHADO PAGO"],
    ["ddr1",     "8.2.1.1.1.01",          "C", "DDR - DISPONIVEL"],
    ["ddr2",     "8.2.1.1.2.01",          "C", "DDR - COMPROMETIDA POR EMPENHO"],
    ["ddr3",     "8.2.1.1.3.01",          "C", "DDR - COMPROMETIDA POR LIQUIDACAO"],
    ["ddr4",     "8.2.1.1.4.01",          "C", "DDR - UTILIZADA"],
    ["cotaGlobal", "9.9.8.0.2.03.01",     "D", "COTA A EMPENHAR - GLOBAL (GMIFP)"],
    ["cotaItem",   "9.9.8.0.2.03.02",     "D", "COTA A EMPENHAR - ELEMENTO/ITEM"]
  ];
  var SALDOS = { cota: 4000000, estoque: 1865040, fornec: 210000, irrf: 0, inss: 0, outras: 0,
    vpd: 6122500, credDisp: 12000000, empLiq: 1530000, liqPagar: 210000, pago: 4875000,
    ddr1: 9500000, ddr2: 1530000, ddr3: 210000, ddr4: 4875000, cotaGlobal: 3800000, cotaItem: 2500000 };

  function novoEstado() {
    return {
      screen: "login", msg: "", msgErr: false, user: "", ue: "", ctx: {},
      contas: JSON.parse(JSON.stringify(SALDOS)),
      seqEmp: 862, seqOPg: 26, seqOPd: 29,
      emps: [
        empBase("845", "33444555000181", "339030", "17", "E", 1530000),
        (function () {
          var e = empBase("851", "44555666000181", "339039", "99", "O", 210000);
          e.liqs.push({ sq: 1, bruto: 210000, ret: [], liquido: 210000 });
          return e;
        })()
      ]
    };
  }
  function empBase(num, cnpj, nat, item, tipo, valor) {
    return { num: num, uo: "1251", prog: "06181701200100" + "01", nat: nat, item: item,
      fonte: "6020", proc: "1", ipe: "0", cnpj: cnpj, tipo: tipo, empenhado: valor,
      reforcos: [], liqs: [], pagoNet: 0, pagoBruto: 0, espec: "", procSiad: "" };
  }

  var S = novoEstado();
  var CHAVE = "siafi-treino-v2";
  function salva() {
    try {
      var c = JSON.parse(JSON.stringify(S));
      c.msg = ""; // a senha nunca e guardada; so o estado do treino
      localStorage.setItem(CHAVE, JSON.stringify(c));
    } catch (e) {}
  }
  function recupera() {
    try {
      var d = JSON.parse(localStorage.getItem(CHAVE) || "null");
      if (d && d.contas && d.emps) { S = d; S.screen = "login"; S.ctx = {}; S.user = ""; return true; }
    } catch (e) {}
    return false;
  }

  // ===================================================== utilitarios
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s.slice(0, n); }
  function lpad(s, n) { s = String(s); while (s.length < n) s = " " + s; return s; }
  function center(s, n) { s = String(s); var l = Math.max(0, Math.floor((n - s.length) / 2)); return pad(" ".repeat(l) + s, n); }
  function digits(x) { return String(x || "").replace(/\D/g, ""); }
  function brl(c) {
    var neg = c < 0; c = Math.abs(Math.round(c));
    var s = (c / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + s;
  }
  // Como no SIAFI: so numeros; os dois ultimos digitos sao os centavos.
  function valor(raw) { var t = String(raw || "").trim(); return /^\d+$/.test(t) ? parseInt(t, 10) : null; }
  function fmtCnpj(c) { c = digits(c); return c.length === 14 ? c.slice(0, 8) + "/" + c.slice(8, 12) + "-" + c.slice(12) : c; }
  function fmtProg(p) { p = digits(p); return [p.slice(0, 2), p.slice(2, 5), p.slice(5, 8), p.slice(8, 12), p.slice(12, 16)].join(" "); }
  function fmtProc(p) { p = digits(p); return p.slice(0, 7) + " " + p.slice(7, 10) + " " + p.slice(10); }
  function cnpjValido(c) {
    c = digits(c);
    if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
    function dv(b) {
      var w = b.length === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s = 0;
      for (var i = 0; i < b.length; i++) s += +b[i] * w[i];
      return s % 11 < 2 ? 0 : 11 - s % 11;
    }
    var d1 = dv(c.slice(0, 12)), d2 = dv(c.slice(0, 12) + d1);
    return c.slice(12) === "" + d1 + d2;
  }
  function elemItem(nat, item) { nat = digits(nat); item = digits(item); return nat.slice(4, 6) + "." + ("0" + item).slice(-2); }
  function hoje() { var d = new Date(); return [("0" + d.getDate()).slice(-2), ("0" + (d.getMonth() + 1)).slice(-2), d.getFullYear()]; }
  function hojeStr() { return hoje().join("/"); }
  function hora() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function say(m, err) { S.msg = m; S.msgErr = !!err; }
  function erro(m) { say(m, true); }
  function go(sc, msg) { S.screen = sc; say(msg || ""); }
  function findEmp(n) { n = String(parseInt(digits(n), 10)); return S.emps.filter(function (e) { return e.num === n; })[0] || null; }
  function liquidado(e) { return e.liqs.reduce(function (a, l) { return a + l.bruto; }, 0); }
  function liqNet(e) { return e.liqs.reduce(function (a, l) { return a + l.liquido; }, 0); }
  function totalEmp(e) { return e.empenhado + e.reforcos.reduce(function (a, r) { return a + r.valor; }, 0); }
  function saldoLiq(e) { return totalEmp(e) - liquidado(e); }
  function saldoPagar(e) { return liqNet(e) - e.pagoNet; }
  function mv(id, d) { S.contas[id] += d; }

  // ===================================================== montagem da tela
  var W = 80;
  // f(): campo de digitacao com largura fixa em colunas.
  function f(id, len, o) {
    o = o || {};
    return '<input id="' + id + '" maxlength="' + len + '" size="' + len + '" style="width:' + len + 'ch"' +
      (o.pw ? ' type="password" class="lc"' : "") + ' autocomplete="off" spellcheck="false" data-def="' +
      esc(o.def == null ? "" : o.def) + '">';
  }
  function L(s) { return '<span class="l">' + esc(s) + "</span>"; }
  function B(s) { return '<span class="b">' + esc(s) + "</span>"; }
  function row(left, mid, right) { return pad(left, 12) + center(mid, 50) + lpad(right, 18); }
  function head(code, vcode, title, sub) {
    var u = S.user || "M000000";
    return [
      esc(row(code, "Estado de Minas Gerais", "PRODEMGE")),
      esc(row(vcode, "S I A F I - MG", hojeStr())),
      esc(row(u, title, hora())),
      esc(row("ANO: " + 2026, sub || "", "2G37")),
      esc("UE: " + S.ue)
    ];
  }
  // Caixa desenhada por cima da tela, como as janelas do SIAFI.
  function box(base, col, top, width, inner) {
    // A tela de baixo fica congelada: campos viram texto.
    var out = base.map(function (h) { return esc(strip(h)); });
    var lines = ["+" + "-".repeat(width - 2) + "+"].map(esc)
      .concat(inner.map(function (h) { return "|" + h + "|"; }))
      .concat([esc("+" + "-".repeat(width - 2) + "+")]);
    for (var i = 0; i < lines.length; i++) {
      var r = top + i;
      while (out.length <= r) out.push("");
      var plain = strip(out[r]);
      out[r] = esc(pad(plain, col).slice(0, col)) + lines[i];
    }
    return out;
  }
  // Linha interna de caixa: texto + campos, com largura visivel exata.
  function bl(width, parts) {
    var vis = 0, h = "";
    parts.forEach(function (p) {
      if (typeof p === "string") { h += esc(p); vis += p.length; }
      else { h += p.h; vis += p.w; }
    });
    return h + esc(" ".repeat(Math.max(0, width - 2 - vis)));
  }
  function F(id, len, o) { return { h: f(id, len, o), w: len }; }
  function H(html, w) { return { h: html, w: w }; }
  function strip(h) {
    var d = document.createElement("div"); d.innerHTML = h;
    Array.prototype.forEach.call(d.querySelectorAll("input"), function (el) {
      var n = +el.getAttribute("maxlength"), v = el.getAttribute("data-def") || "";
      el.replaceWith(document.createTextNode(v ? pad(v, n) : "_".repeat(n)));
    });
    return d.textContent;
  }

  var PFRULER = "Enter-PF1---PF2---PF3---PF4---PF5---PF6---PF7---PF8---PF9---PF10--PF11--PF12--";
  function ruler(labels) {
    var r1 = PFRULER.replace(/PF(\d+)/g, function (m, n) {
      return '<span class="pf" data-pf="' + n + '">' + m + "</span>";
    });
    var r2 = " ".repeat(W).split("");
    Object.keys(labels || {}).forEach(function (k) {
      var i = PFRULER.indexOf("PF" + k + "-"); if (i < 0) return;
      var t = labels[k]; for (var j = 0; j < t.length; j++) r2[i + j] = t[j];
    });
    var s2 = esc(r2.join("").replace(/\s+$/, ""));
    Object.keys(labels || {}).forEach(function (k) {
      s2 = s2.replace(labels[k], '<span class="pf" data-pf="' + k + '">' + esc(labels[k]) + "</span>");
    });
    return [r1, s2];
  }

  // ===================================================== telas
  var SC = {};

  // ---- login (modelo de treino: so aceita o usuario de treinamento)
  SC.login = {
    pf: { 11: "Rein", 12: "Fim" },
    draw: function () {
      return [
        "", "",
        esc(center("S I A F I - M G", W)),
        esc(center("SISTEMA INTEGRADO DE ADMINISTRACAO FINANCEIRA", W)),
        esc(center("ESTADO DE MINAS GERAIS", W)),
        "",
        '<span class="m">' + esc(center("AMBIENTE DE TREINAMENTO - DADOS FICTICIOS", W)) + "</span>",
        "", "",
        "                    " + L("Usuario .....: ") + f("usr", 7),
        "",
        "                    " + L("Senha .......: ") + f("pwd", 8, { pw: true }),
        "", "", "",
        '<span class="d">' + esc(center("Use seu codigo de usuario. Senha de treinamento: TREINO", W)) + "</span>",
        '<span class="d">' + esc(center("PF11 reinicia os dados do treinamento", W)) + "</span>"
      ];
    },
    enter: function (v) {
      if (!v.usr || !v.pwd) return erro("0001-INFORME USUARIO E SENHA.");
      // Qualquer codigo de usuario serve; a senha e sempre a de treino,
      // para ninguem digitar aqui a senha de um sistema real.
      if (!/^[A-Z0-9]{4,7}$/i.test(v.usr)) return erro("0002-CODIGO DE USUARIO INVALIDO.");
      if (v.pwd.toUpperCase() !== SENHA) return erro("0002-SENHA INVALIDA. NO TREINAMENTO A SENHA E SEMPRE: TREINO");
      S.user = v.usr.toUpperCase(); go("ueSel");
    },
    pf11: function () { S = novoEstado(); try { localStorage.removeItem(CHAVE); } catch (e) {} say("0000-DADOS DO TREINAMENTO REINICIADOS."); },
    pf12: function () { say("0000-SESSAO ENCERRADA."); }
  };

  SC.ueSel = {
    pf: { 3: "Volta", 12: "Fim" },
    draw: function () {
      return [
        esc(row("NFCAE00A", "Estado de Minas Gerais", "PRODEMGE")),
        esc(row("VFCAE00A", "S I A F I - MG", hojeStr())),
        esc(row(S.user, "Selecao de Unidade", hora())), "", "", "", "",
        "            " + L("Ano Exercicio ......: ") + "2026",
        "",
        "            " + L("Unid. Executora ....: ") + f("ue", 7),
        "", "", "",
        '<span class="d">' + esc("            Informe a Unidade Executora em que vai trabalhar.") + "</span>"
      ];
    },
    enter: function (v) {
      var ue = digits(v.ue);
      if (!ue) return erro("0004-CAMPO DE PREENCHIMENTO OBRIGATORIO.");
      if (!UES[ue]) return erro("0016-UNIDADE EXECUTORA NAO CADASTRADA OU SEM PERMISSAO PARA O USUARIO.");
      S.ue = ue; go("subs");
    },
    pf3: function () { S.user = ""; go("login"); }
  };

  function menu(code, vcode, title, sub, items, o) {
    o = o || {};
    var l = head(code, vcode, title, sub);
    l.push("", "");
    items.forEach(function (it) { l.push(esc("  " + it)); });
    while (l.length < 19) l.push("");
    l.push("        " + L("Opcao") + " < " + f("opcao", 2) + " >" +
      (o.acao ? "        " + L("Acao") + " < " + f("acao", 1) + " >      " : "                           ") +
      "  " + L("Navegacao") + " < " + f("nav", 2) + " >");
    return l;
  }
  // Navegacao direta: 51 = Execucao da Despesa, 71 = Ordem de Pagamento, 91 = Consulta.
  function navegar(n) {
    if (n === "51") return go("m51"), true;
    if (n === "71") return go("m71"), true;
    if (n === "91" || n === "92" || n === "95") return go("m91"), true;
    if (n === "05" || n === "50") return go("m05"), true;
    if (n === "07" || n === "70") return go("m07"), true;
    if (n === "09" || n === "90") return go("m09"), true;
    if (n) { erro("0003-NAVEGACAO INVALIDA."); return true; }
    return false;
  }

  SC.subs = {
    pf: { 1: "Ajuda", 3: "Volta", 12: "Fim" },
    draw: function () {
      return menu("NFCAE000", "VFCAE000", "Subsistemas", "", ["01-Rotina Administrativa", "02-Rotina Anual",
        "03-Movimentacao Orcamentaria", "04-Movimentacao da Receita", "05-Movimentacao da Despesa",
        "06-Movimentacao Financeira Escritural", "07-Movimentacao Financeira Bancaria",
        "08-Movimentacao Contabil", "09-Consulta / Relatorio", "10-Tabela"]);
    },
    enter: function (v) {
      if (navegar(digits(v.nav))) return;
      var o = digits(v.opcao);
      if (o === "05" || o === "5") return go("m05");
      if (o === "07" || o === "7") return go("m07");
      if (o === "09" || o === "9") return go("m09");
      if (o) return erro("0009-SUBSISTEMA NAO DISPONIVEL NO TREINAMENTO.");
      erro("0001-INFORME A OPCAO OU A NAVEGACAO.");
    },
    pf3: function () { go("ueSel"); }
  };

  SC.m05 = {
    pf: { 1: "Ajuda", 3: "Volta", 12: "Fim" },
    draw: function () {
      return menu("NFCAE005", "VFCAE005", "Movimentacao da Despesa", "", ["01-Execucao da Despesa",
        "02-Execucao de Restos a Pagar/Servico da Divida", "03-Anulacao da Despesa",
        "04-Apropriacao Contabil da Despesa", "05-Folha de Pessoal"]);
    },
    enter: function (v) {
      if (navegar(digits(v.nav))) return;
      var o = digits(v.opcao);
      if (o === "01" || o === "1") return go("m51");
      if (o) return erro("0009-MODULO NAO DISPONIVEL NO TREINAMENTO.");
      erro("0001-INFORME A OPCAO.");
    },
    pf3: function () { go("subs"); }
  };

  var M51 = ["01-Apropriacao do Empenho                                 1-Registrar",
    "02-Anulacao do Empenho                                    2-Consultar",

      if (prog.length !== 16) return erro("0012-PROGRAMA DE TRABALHO INVALIDO. INFORME OS 16 DIGITOS.");
      if (nat.length !== 6) return erro("0019-NATUREZA DA DESPESA INVALIDA.");
      var cred = digits(v.credor);
      if (!cred) return erro("0004-CAMPO DE PREENCHIMENTO OBRIGATORIO.");
      if (c.pessoa === "J" && !cnpjValido(cred)) return erro("0020-CNPJ INVALIDO.");
      if (!CREDORES[cred]) return erro("0021-CREDOR NAO CADASTRADO NA TABELA CREDOR/DEVEDOR.");
      c.nome = CREDORES[cred].nome;
      var tp = (v.tipo || "").toUpperCase();

        if (esp.contrato && c.cSiad !== "S") return erro("0143-ESPECIFICACAO COM CONTRATO NO SIAD. INFORME 'S' EM CONTRATO SAIDA SIAD (PF3).");

      if (!digits(v.opcao)) return erro("0001-INFORME A OPCAO.");
      if (!a) return erro("0004-INFORME A ACAO.");
      if (o === "01" && a === "1") { S.ctx = {}; return go("popOPTipo"); }
      erro("0009-OPCAO/ACAO NAO DISPONIVEL NO TREINAMENTO.");
    },
    pf3: function () { go("m07"); }
  };
  SC.popOPTipo = {
    pf: { 3: "Volta", 9: "MenuP", 12: "Fim" },
    draw: function () {
      var W2 = 58;
      return box(m71base(), 21, 5, W2, [bl(W2, ["          Ordem de Pagamento Bancaria"]), bl(W2, [" Marque"]), bl(W2, ["  'X'"])]
        .concat(TIPOS_OP.map(function (t, i) { return bl(W2, ["  ", F("tp" + i, 1), "   " + t]); })));
    },
    enter: function (v) {
      var n = [], i;
      for (i = 0; i < TIPOS_OP.length; i++) if ((v["tp" + i] || "").toUpperCase() === "X") n.push(i);
      if (n.length !== 1) return erro("0005-MARQUE 'X' EM UM TIPO DE ORDEM DE PAGAMENTO.");
      if (n[0] !== 1) return erro("0009-TIPO DE ORDEM DE PAGAMENTO NAO DISPONIVEL NO TREINAMENTO.");
      go("popOPCred");
    },
    pf3: function () { go("m71"); }
  };
  SC.popOPCred = {
    pf: { 3: "Volta" },
    draw: function () {
      var W2 = 44;
      return box(m71base(), 34, 7, W2, [bl(W2, ["          Pagamento por Credor"]), bl(W2, [""]),
        bl(W2, [" Ano Exercicio:      2026"]), bl(W2, [" Unid. Executora:    " + S.ue]),
        bl(W2, [" Unid. Orcamentaria: ", F("uo", 4)]), bl(W2, [" CPF/CAPF-Credor:    ", F("cpf", 11)]),
        bl(W2, [" CNPJ/CAPJ-Credor:   ", F("cnpj", 14)]), bl(W2, [" Ordenador Despesa:  ", F("ord", 6)]), bl(W2, [""]),
        bl(W2, [" -------------PF3--------PF6--------------"]), bl(W2, ["               Volta      Sel"])]);
    },
    enter: function (v) {
      var uo = digits(v.uo), c = digits(v.cnpj);
      if (!uo || (!c && !digits(v.cpf)) || !digits(v.ord)) return erro("0004-CAMPO DE PREENCHIMENTO OBRIGATORIO.");
      if (!UOS[uo]) return erro("0016-UNIDADE ORCAMENTARIA NAO CADASTRADA. TECLE PF6 PARA SELECIONAR.");
      if (!c) return erro("0021-CREDOR NAO CADASTRADO NA TABELA CREDOR/DEVEDOR.");
      if (!cnpjValido(c)) return erro("0020-CNPJ INVALIDO.");
      if (!CREDORES[c]) return erro("0021-CREDOR NAO CADASTRADO NA TABELA CREDOR/DEVEDOR.");
      if (!ORDS[digits(v.ord)]) return erro("0024-ORDENADOR DE DESPESA NAO CADASTRADO PARA A UNIDADE.");
      S.ctx = { uo: uo, cnpj: c, ord: digits(v.ord), fase: 1 };
      go("opEK03");
    },
    pf6: function () { setVal("uo", "1251"); say("0020-UNIDADE ORCAMENTARIA SELECIONADA: 1251."); },
    pf3: function () { go("popOPTipo"); }
  };

  function aliqIrrf(e) { return e.nat.slice(4, 6) === "30" ? 0.012 : 0.048; }
  function cabOP(code, vcode, title, extra) {
    var cr = CREDORES[S.ctx.cnpj];
    return [esc(row(code, "Estado de Minas Gerais", "PRODEMGE")), esc(row(vcode, "S I A F I - MG", hojeStr())),
      esc(row(S.user, title, hora())), esc(row("", "Pagamento por Credor", "B162")), extra,
      L("Unid. Executora:  ") + esc(S.ue + " - " + UES[S.ue]), L("Unid. Orcamentaria: ") + esc(S.ctx.uo + " - PMMG"),
      L("CNPJ-Credor:    ") + esc(fmtCnpj(S.ctx.cnpj) + " - " + cr.nome)];
  }
  SC.opEK03 = {
    pf: { 3: "Volta", 9: "MenuP", 12: "Fim" },
    draw: function () {
      var c = S.ctx, cr = CREDORES[c.cnpj];
      var l = cabOP("NFCAEK03", "VFCAEK03", "Registrar Ordem de Pagamento Bancaria",
        L("Ano Exercicio:    ") + "2026      " + L("Ano Empenho: ") + f("anoEmp", 4, { def: "2026" }) +
        (c.fase >= 2 ? "    " + L("Dt.Pagto: ") + f("pgD", 2, { def: c.dt[0] }) + " / " + f("pgM", 2, { def: c.dt[1] }) + " / " + f("pgA", 4, { def: c.dt[2] }) : ""));
      l.push("",
        L("Conta Debitar:  ") + f("cu", 1) + " " + L("Conta Unica"),
        "                " + f("ob", 1) + " " + L("Banco: ") + f("obB", 3) + " " + L("Agencia: ") + f("obA", 6) + " " + L("Conta: ") + f("obC", 10),
        L("Conta Creditar:   Banco: ") + esc(cr.banco || "") + " " + L("Agencia: ") + esc(cr.ag || "") + " " + L("Conta: ") + esc(cr.cc || ""),
        "     " + L("Nr. Emp.") + "       " + L("Saldo a Pagar") + "    " + L("Vl. Bruto a Pagar") + "  " + L("IRRF(S/N)/Codigo"));
      for (var i = 0; i < 6; i++) {
        var e = c.sel && c.sel[i] ? findEmp(c.sel[i]) : null;
        l.push("     " + f("ne" + i, 7) + "  " + esc(lpad(e ? brl(saldoPagar(e)) : "", 16)) + "   " + f("vb" + i, 15) + "    " + f("ir" + i, 1) + "     " + f("cd" + i, 4));
      }
      l.push("", L("Ordenador Despesa: ") + esc(c.ord + " - " + ORDS[c.ord]));
      return l;
    },
    enter: function (v) {
      var c = S.ctx, up = function (x) { return (x || "").toUpperCase(); };
      if (digits(v.anoEmp) !== "2026") return erro("0050-ANO DO EMPENHO INVALIDO.");
      var cu = up(v.cu) === "X", ob = up(v.ob) === "X";
      if (cu === ob) return erro("0033-MARQUE 'X' EM CONTA UNICA OU INFORME OUTRO BANCO.");
      if (ob && (!digits(v.obB) || !digits(v.obA) || !digits(v.obC))) return erro("0034-INFORME BANCO, AGENCIA E CONTA A DEBITAR.");
      var sel = [];
      for (var i = 0; i < 6; i++) {
        var n = digits(v["ne" + i]);
        if (!n) continue;
        var e = findEmp(n);
        if (!e || e.uo !== c.uo) return erro("0041-EMPENHO " + n + " NAO CADASTRADO PARA A UNIDADE.");
        if (e.cnpj !== c.cnpj) return erro("0049-EMPENHO " + n + " NAO PERTENCE AO CREDOR INFORMADO.");
        if (saldoPagar(e) <= 0) return erro("0051-EMPENHO " + n + " SEM SALDO LIQUIDADO A PAGAR.");
        sel.push(e.num);
      }
      if (!sel.length) return erro("0004-INFORME O NUMERO DO EMPENHO.");
      var mudou = JSON.stringify(sel) !== JSON.stringify(c.sel || []);
      c.sel = sel;
      c.conta = cu ? { unica: true } : { banco: digits(v.obB), ag: digits(v.obA), cc: digits(v.obC) };
      if (mudou || !c.fase || c.fase < 1.5) { c.fase = 1.5; return say("INFORME O VALOR BRUTO A PAGAR E O IRRF E TECLE ENTER."); }
      var itens = [];
      for (var j = 0; j < sel.length; j++) {
        var em = findEmp(sel[j]), vb = valor(v["vb" + j]), ir = up(v["ir" + j]), cd = digits(v["cd" + j]);
        if (!vb) return erro("0022-VALOR BRUTO INVALIDO. DIGITE SO NUMEROS, SEM PONTO NEM VIRGULA.");
        if (vb > saldoPagar(em)) return erro("0052-VALOR BRUTO MAIOR QUE O SALDO A PAGAR DO EMPENHO " + em.num + ".");
        if (ir !== "S" && ir !== "N") return erro("0018-DIGITE S(SIM) OU N(NAO).");
        if (!cd) return erro("0053-INFORME O CODIGO DO IRRF.");
        // IRRF sobre o valor bruto da nota proporcional ao que se paga agora.
        var base = Math.round(vb * liquidado(em) / liqNet(em));
        itens.push({ num: em.num, vb: vb, irrf: ir === "S" ? Math.round(base * aliqIrrf(em)) : 0, cod: cd });
      }
      c.itens = itens;
      if (c.fase < 2) {
        var d = new Date(); d.setDate(d.getDate() + 3);
        c.dt = [("0" + d.getDate()).slice(-2), ("0" + (d.getMonth() + 1)).slice(-2), "" + d.getFullYear()];
        c.fase = 2; return say("0139- TECLE 'ENTER' PARA CONTINUAR OU ALTERE A DATA DE PAGAMENTO.");
      }
      var dd = +digits(v.pgD), mm = +digits(v.pgM), aa = +digits(v.pgA), dt = new Date(aa, mm - 1, dd);
      if (!dd || !mm || dt.getDate() !== dd || dt.getMonth() !== mm - 1) return erro("0035-DATA DE PAGAMENTO INVALIDA.");
      var hj = new Date(); hj.setHours(0, 0, 0, 0);
      if (dt < hj) return erro("0036-DATA DE PAGAMENTO MENOR QUE A DATA ATUAL.");
      c.dtPag = [("0" + dd).slice(-2), ("0" + mm).slice(-2), aa].join("/");
      c.hist = { tipo: "OP", titulo: "ORDEM DE PAGAMENTO BANCARIA", padraoFixo: 1, padraoTxt: "REGISTRO ORDEM PAGAMENTO BANCARIA",
        ref: "REGISTRA PAGAMENTO POR CREDOR -", fim: "opResumo" };
      go("histRef");
    },
    pf3: function () { go("popOPCred"); }
  };
  function telaResumo(o) {
    var c = S.ctx, cr = CREDORES[c.cnpj];
    var l = [esc(row("NFCAEK03", "Estado de Minas Gerais", "PRODEMGE")), esc(row("VFCAEK0B", "S I A F I - MG", hojeStr())),
      esc(row(S.user, "Resumo Ordem de Pagamento Global", hora())), esc(row("", "Ordem de Pagamento por Credor", "B162")),
      L("Ano Exercicio: ") + "2026  " + L("Data Registro: ") + hojeStr() + "  " + L("Data Pagamento: ") + c.dtPag,
      L("Unid. Executora: ") + esc(S.ue + " - " + UES[S.ue]), L("Unid. Orcamentaria: ") + esc(c.uo + " - PMMG"),
      L("CNPJ - Credor:   ") + esc(fmtCnpj(c.cnpj) + " - " + cr.nome), "",
      L("Conta Debitada:  ") + esc(c.conta.unica ? "Conta Unica" : "Banco: " + c.conta.banco + " Agencia: " + c.conta.ag + " Conta: " + c.conta.cc),
      L("Conta Creditada: ") + esc("Banco: " + cr.banco + " Agencia: " + cr.ag + " Conta: " + cr.cc),
      L("Nr. Documento Global: ") + pad(o.glob || "", 20) + L("Ano Empenho: ") + "2026" + "        " + L("Cod."),
      L("Nr.Emp. Nr.Doc.  Vl. Bruto a Pagar      Vl. IRRF     Vl. Ordem Pagto  IRRF")];
    c.itens.forEach(function (it, i) {
      l.push(esc(pad(it.num, 8) + pad(o.docs ? o.docs[i] : "", 6) + lpad(brl(it.vb), 18) + lpad(it.irrf ? brl(it.irrf) : "", 14) +
        lpad(brl(it.vb - it.irrf), 20) + "  " + it.cod));
    });
    while (l.length < 20) l.push("");
    l.push(L("Ordenador Despesa: ") + esc(c.ord + " - " + ORDS[c.ord]));
    return l;
  }
  SC.opResumo = {
    pf: { 2: "Anula", 3: "Volta", 5: "Conf", 9: "MenuP", 12: "Fim" },
    draw: function () { return S.ctx.reg ? telaResumo(S.ctx.reg) : telaResumo({}); },
    pf5: function () {
      var c = S.ctx;
      if (c.reg) return;
      S.seqOPg += 1;
      var docs = [];
      c.itens.forEach(function (it) {
        var e = findEmp(it.num);
        S.seqOPd += 1; docs.push(String(S.seqOPd));
        var bruto = Math.round(it.vb * liquidado(e) / liqNet(e));
        if (it.vb === saldoPagar(e)) bruto = liquidado(e) - e.pagoBruto;
        e.pagoNet += it.vb; e.pagoBruto += bruto;
        mv("liqPagar", -bruto); mv("pago", bruto); mv("ddr3", -bruto); mv("ddr4", bruto);
        mv("fornec", -it.vb); mv("irrf", it.irrf); mv("cota", -(it.vb - it.irrf));
      });
      c.reg = { glob: String(S.seqOPg), docs: docs };
      say("0011-REGISTRO EFETUADO.");
    },
    enter: function () { if (S.ctx.reg) go("m71"); },
    pf2: function () { if (!S.ctx.reg) go("m71", "0013-REGISTRO ANULADO."); },
    pf3: function () { go("m71"); }
  };

  // ---- Consulta / Relatorio: saldo de contas contabeis (modelo do treino)
  SC.m09 = {
    pf: { 1: "Ajuda", 3: "Volta", 12: "Fim" },
    draw: function () {
      return menu("NFCAE009", "VFCAE009", "Consulta / Relatorio", "", ["01-Tabela", "02-Saldo Contabil"]);
    },
    enter: function (v) {
      if (navegar(digits(v.nav))) return;
      var o = digits(v.opcao);
      if (o === "02" || o === "2") return go("m91");
      if (o) return erro("0009-MODULO NAO DISPONIVEL NO TREINAMENTO.");
      erro("0001-INFORME A OPCAO.");
    },
    pf3: function () { go("subs"); }
  };
  SC.m91 = {
    pf: { 3: "Volta", 7: "-Pag", 8: "+Pag", 9: "MenuP", 12: "Fim" },
    draw: function () {
      var q = (S.ctx.busca || "").toUpperCase(), qd = digits(q);
      var lista = ACCTS.filter(function (a) {
        if (!q) return true;
        return a[1].indexOf(q) === 0 || (qd && qd === q.replace(/\./g, "") && a[1].replace(/\./g, "").indexOf(qd) === 0) || a[3].indexOf(q) >= 0;
      });
      var l = head("NFCAE091", "VFCAE091", "Consulta / Relatorio", "Saldo Contabil");
      l.push("", "  " + L("Conta Contabil (ou parte do nome): ") + f("busca", 24), "",
        L(pad("  Conta", 25) + pad("Descricao", 36) + "D/C" + lpad("Saldo", 16)));
      if (!lista.length) l.push(esc("  0090-NENHUMA CONTA ENCONTRADA."));
      lista.slice(0, 15).forEach(function (a) {
        l.push(esc("  " + pad(a[1], 23) + pad(a[3], 36) + " " + a[2] + " " + lpad(brl(S.contas[a[0]]), 16)));
      });
      return l;
    },
    enter: function (v) { S.ctx.busca = (v.busca || "").trim(); keep.busca = S.ctx.busca; say(""); },
    pf3: function () { S.ctx = {}; go("m09"); }
  };

  // ===================================================== motor
  var T = document.getElementById("t");
  var telaAnterior = null, keep = {};
  function fieldEls() { return Array.prototype.slice.call(T.querySelectorAll("input")); }
  function setVal(id, v) { var el = document.getElementById(id); if (el) el.value = v; keep[id] = v; }
  function clearFields() { fieldEls().forEach(function (el) { el.value = ""; }); keep = {}; }
  function vals() { var o = {}; fieldEls().forEach(function (el) { o[el.id] = el.value.trim(); }); return o; }

  function render() {
    var sc = SC[S.screen];
    // Na mesma tela (erro, segunda fase), o que foi digitado continua la.
    if (telaAnterior === S.screen) fieldEls().forEach(function (el) { keep[el.id] = el.value; });
    else keep = {};
    telaAnterior = S.screen;
    var lines = sc.draw();
    while (lines.length < 23) lines.push("");
    lines = lines.slice(0, 23);
    var msg = S.msg ? '<span class="' + (S.msgErr ? "e" : "m") + '">' + esc(S.msg) + "</span>" : "";
    var r = ruler(sc.pf);
    T.innerHTML = [msg].concat(lines).concat(r).join("\n");
    fieldEls().forEach(function (el) {
      var d = el.getAttribute("data-def");
      if (keep[el.id] != null && keep[el.id] !== "") el.value = keep[el.id];
      else if (d) el.value = d;
    });
    if (sc.after) sc.after();
    var first = fieldEls().filter(function (el) { return !el.value; })[0] || fieldEls()[0];
    if (first) first.focus();
    if (S.screen !== "login") salva();
  }

  function pf(n) {
    var sc = SC[S.screen], v = vals(), fn = sc["pf" + n];
    if (n === 12 && !fn) { S.user = ""; S.ctx = {}; go("login", "0000-SESSAO ENCERRADA."); return render(); }
    if (n === 9 && !fn && S.screen !== "login" && S.screen !== "ueSel") { S.ctx = {}; go("subs"); return render(); }
    if (fn) fn(v); else erro("0015-TECLA INVALIDA.");
    render();
  }

  document.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if ((k === "Enter" && (ev.ctrlKey || ev.metaKey)) || k === "F5") { ev.preventDefault(); return pf(5); }
    if (k === "Escape") { ev.preventDefault(); return pf(3); }
    var m = /^F(\d{1,2})$/.exec(k);
    if (m) { ev.preventDefault(); return pf(+m[1]); }
    if (k === "Enter") {
      ev.preventDefault();
      var sc = SC[S.screen];
      if (sc.enter) sc.enter(vals()); else erro("0017-TECLE PF5 PARA CONFIRMAR OU PF2 PARA ANULAR.");
      return render();
    }
    var els = fieldEls(), i = els.indexOf(document.activeElement);
    if (k === "ArrowDown" || k === "ArrowUp") {
      ev.preventDefault();
      if (!els.length) return;
      var j = i < 0 ? 0 : (i + (k === "ArrowDown" ? 1 : -1) + els.length) % els.length;
      els[j].focus(); els[j].select();
    }
  });
  // Salto automatico para o proximo campo quando o atual enche (como no 3270).
  T.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.tagName === "INPUT" && el.value.length >= +el.maxLength) {
      var els = fieldEls(), i = els.indexOf(el);
      if (i >= 0 && i < els.length - 1) { els[i + 1].focus(); els[i + 1].select(); }
    }
  });
  // A regua de PF tambem responde ao clique (teclados sem F1-F12).
  T.addEventListener("mousedown", function (ev) {
    var p = ev.target.closest && ev.target.closest(".pf");
    if (p) { ev.preventDefault(); pf(+p.getAttribute("data-pf")); }
  });

  if (recupera()) say("0000-INFORME USUARIO E SENHA. SEU PROGRESSO NO TREINAMENTO FOI MANTIDO.");
  else say("0000-INFORME USUARIO E SENHA.");
  render();
})();
</script>
</body>
</html>
