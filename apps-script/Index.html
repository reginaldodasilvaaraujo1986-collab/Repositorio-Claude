    const c = Object.assign({}, S.edit.campos);
    const curso = cursosComAba().find(x => x.aba === c.aba);
    const modeloT = S.dados.turmas.find(x => x.aba === c.aba && x.turma === c.modelo);
    // Nome interno da turma na planilha: se ficar em branco, sigla do curso + cidade.
    if (!c.nome.trim()) c.nome = c.cursoOficial ? cursoCurto(c.cursoOficial) + ' - ' + ((c.cidade || '').trim() || fmt(c.inicio)) : '';
    if (!c.nome.trim()) return toast('Escolha o curso (SiGE) ou informe um nome para a turma.', 'err');
    if (!c.inicio || !c.fim) return toast('Preencha início e término.', 'err');
    if (c.fim < c.inicio) return toast('O término não pode ser antes do início.', 'err');
    gravarNoServidor('criarTurma', {
      aba: c.aba, modelo: c.modelo, nome: c.nome.trim(), curso: (modeloT && modeloT.curso) || (curso ? curso.curso : c.aba), unidade: c.unidade,
      cursoOficial: c.cursoOficial, cidade: (c.cidade || '').trim(),
      matriculados: (String(c.vagas || '').match(/\d+/) || [estimativaPorTurma(resolucaoDoAno(anoRef()).find(r => r.grupo === c.cursoOficial)) || ''])[0],
      inicio: c.inicio, fim: c.fim, local: c.local.trim(), vagas: c.vagas.trim(), treinamento: c.treinamento.trim()
    }, () => {
      toast('✓ Turma criada: ' + c.nome.trim() + (RUN ? '. Atualizando…' : ''));
      fecharDrawer();
      if (RUN) carregar(true); else refrescar();
    });
  }

  /** Turmas atuais agrupadas pelo curso do SiGE, comparadas à Resolução do ano novo. */
  function planoDoAno(novo) {
    const res = resolucaoDoAno(novo), idx = {};
    res.forEach(r => { idx[r.grupo] = r; });
    const grupos = {};
    S.dados.turmas.filter(t => t.sit !== 'canc').forEach(t => { const g = nomeCurso(t); (grupos[g] = grupos[g] || []).push(t); });
    res.forEach(r => { grupos[r.grupo] = grupos[r.grupo] || []; });
    const c = S.edit.campos;
    if (!c.manter) { // padrão: as primeiras N turmas (por data), N = turmas previstas
      c.manter = [];
      Object.keys(grupos).forEach(g => {
        const n = idx[g] ? idx[g].turmas : 0;
        grupos[g].slice().sort((a, b) => String(a.inicio).localeCompare(String(b.inicio))).slice(0, n).forEach(t => c.manter.push(t.id));
      });
    }
    return Object.keys(grupos).map(g => {
      const turmas = grupos[g].slice().sort((a, b) => String(a.inicio).localeCompare(String(b.inicio)));
      const marcadas = turmas.filter(t => c.manter.indexOf(t.id) >= 0).length;
      const r = idx[g] || null;
      return { grupo: g, r: r, turmas: turmas, marcadas: marcadas, est: estimativaPorTurma(r), ok: r ? marcadas === r.turmas : marcadas === 0 };
    }).sort((a, b) => (!!b.r - !!a.r) || (a.ok - b.ok) || a.grupo.localeCompare(b.grupo, 'pt-BR'));
  }

  function salvarEquipe() {
    const lista = S.edit.campos.lista.map(x => String(x || '').trim()).filter(Boolean);
    if (!lista.length) return toast('Informe ao menos um nome.', 'err');
    if (new Set(lista.map(norm)).size !== lista.length) return toast('Há nomes repetidos.', 'err');
    gravarNoServidor('salvarResponsaveis', { lista: lista }, () => {
      S.dados.responsaveis = lista;
      normalizarResponsaveis();
      if (S.f.resp && S.f.resp !== '__sem' && lista.indexOf(S.f.resp) < 0) S.f.resp = '';
      toast('✓ Equipe atualizada');
      fecharDrawer(); montarFiltros(); refrescar();
    });
  }

  function criarAno() {
    const c = S.edit.campos;
    const novo = anoRef() + 1;
    const idx = {}; resolucaoDoAno(novo).forEach(r => { idx[r.grupo] = r; });
    const cancelar = S.dados.turmas.filter(t => t.sit !== 'canc' && t.linhaCadastro && c.manter.indexOf(t.id) < 0).map(t => t.linhaCadastro);
    const matriculados = {};
    (S.dados.formandos || []).forEach(x => {
      const t = turmaDoFormando(x);
      if (!x.linha) return;
      if (t && c.manter.indexOf(t.id) < 0) { matriculados[x.linha] = 0; return; }
      const est = estimativaPorTurma(idx[cursoDoFormando(x)]);
      if (est != null) matriculados[x.linha] = est;
    });
    gravarNoServidor('criarAnoSeguinte', { modoDatas: c.modoDatas, canceladas: c.canceladas, cancelar: cancelar, matriculados: matriculados }, r => {
      fecharDrawer();
      if (!RUN) { refrescar(); return; }
      toast('✓ Planilha de ' + r.ano + ' criada: ' + r.nome);
      S.ano = r.ano; S.pg = {}; S.calMes = 0;
      carregar(true);
    });
  }

  function anel(pct, tam) {
    const r = tam / 2 - 5, c = 2 * Math.PI * r, m = tam / 2;
    return '<svg class="ring" width="' + tam + '" height="' + tam + '" viewBox="0 0 ' + tam + ' ' + tam + '">' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--surface-3)" stroke-width="6"/>' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--s-enc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100) + ' ' + c + '" transform="rotate(-90 ' + m + ' ' + m + ')"/></svg>';
  }

  function rosca(seg, tam, centro, sub) {
    const total = soma(seg, s => s.v) || 1, r = tam / 2 - 11, c = 2 * Math.PI * r, m = tam / 2;
    let acc = 0;
    const arcos = seg.filter(s => s.v).map(s => {
      const len = s.v / total * c;
      const el = '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:' + s.cor + '" stroke-width="16" stroke-dasharray="' + Math.max(0, len - 1.5) + ' ' + c + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 ' + m + ' ' + m + ')" data-tip="<b>' + s.l + '</b>' + s.v + ' (' + Math.round(s.v / total * 100) + '%)"/>';
      acc += len; return el;
    }).join('');
    return '<svg width="' + tam + '" height="' + tam + '" style="flex:none">' + arcos +
      '<text x="50%" y="49%" text-anchor="middle" style="font:600 21px Fraunces,serif;fill:var(--ink)">' + esc(centro) + '</text>' +
      '<text x="50%" y="63%" text-anchor="middle" style="font:500 10.5px Inter,sans-serif;fill:var(--ink-3)">' + esc(sub) + '</text></svg>';
  }

  /* ================================================================ */
  /* Ações                                                             */
  /* ================================================================ */

  function mudarStatus(id, novo, el) {
    const e = S.idx[id];
    if (!e || e.status === novo) return;
    const anterior = e.status, conclAnterior = e.conclusao;
    e.status = novo;
    if (novo === 'Feito' && !e.conclusao) e.conclusao = S.dados.hoje;
    recalcular();
    if (!RUN) {
      toast('Demonstração: “' + e.etapa + '” → ' + novo + ' (não gravado)');
      refrescar();
      return;
    }
    el.classList.add('saving');
    google.script.run
      .withSuccessHandler(r => {
        const o = JSON.parse(r);
        e.conclusao = o.conclusao || e.conclusao;
        toast('✓ ' + e.etapa + ' → ' + novo);
        refrescar();
      })
      .withFailureHandler(err => {
        e.status = anterior; e.conclusao = conclAnterior;
        recalcular();
        toast(err.message || 'Não foi possível gravar', 'err');
        refrescar();
      })
      .atualizarStatusEtapa({
        aba: e.aba, linha: e.linha, colEtapa: e.colEtapa, colStatus: e.colStatus,
        colConclusao: e.colConclusao, etapa: e.etapa, status: novo, turma: e.turma, ano: anoRef()
      });
    refrescar();
  }

  function mudarResponsavel(id, novo, el) {
    const e = S.idx[id];
    if (!e || (e.responsavel || '') === novo) return;
    const anterior = e.responsavel, anteriorN = e.respN;
    e.responsavel = novo; e.respN = novo;
    el.classList.add('saving');
    gravarNoServidor('atualizarEtapa', { aba: e.aba, linha: e.linha, etapa: e.etapa, turma: e.turma, campos: { responsavel: novo } }, () => {
      toast('✓ ' + e.etapa + ' → ' + (novo || 'sem responsável'));
      montarFiltros(); refrescar();
    }, () => { e.responsavel = anterior; e.respN = anteriorN; });
  }

  /** Chama uma função de gravação no servidor (no modo demonstração, só simula). */
  function gravarNoServidor(fn, req, sucesso, falha) {
    req.ano = anoRef();
    if (!RUN) { toast('Demonstração: alteração não gravada na planilha'); sucesso({}); return; }
    S.salvando = true;
    refrescar();
    google.script.run
      .withSuccessHandler(r => { S.salvando = false; sucesso(JSON.parse(r)); })
      .withFailureHandler(err => {
        S.salvando = false;
        toast(err.message || 'Não foi possível gravar', 'err');
        if (falha) falha(err);
        refrescar();
      })[fn](req);
  }

  function acao(nome, el) {
    if (nome === 'nova-turma') {
      const abas = cursosComAba();
      if (!abas.length) return toast('Nenhuma aba de curso encontrada na planilha.', 'err');
      S.edit = { tipo: 'nova', campos: { aba: abas[0].aba, modelo: modeloPadrao(abas[0].aba), unidade: unidadeDoModelo(abas[0].aba, modeloPadrao(abas[0].aba)), cursoOficial: cursoDoModelo(abas[0].aba, modeloPadrao(abas[0].aba)), nome: '', cidade: '', inicio: '', fim: '', local: '', treinamento: '', vagas: '' } };
      return abrirForm('nova');
    }
    if (nome === 'salvar-nova') return salvarNovaTurma();
    if (nome === 'equipe') { S.edit = { tipo: 'equipe', campos: { lista: (S.dados.responsaveis || []).slice() } }; return abrirForm('equipe'); }
    if (nome === 'equipe-add') { S.edit.campos.lista.push(''); return abrirForm('equipe'); }
    if (nome === 'equipe-del') { S.edit.campos.lista.splice(Number(el.dataset.i), 1); return abrirForm('equipe'); }
    if (nome === 'salvar-equipe') return salvarEquipe();
    if (nome === 'criar-ano') return criarAno();

    if (nome === 'editar-etapa') {
      const e = S.idx[el.dataset.id]; if (!e) return;
      S.edit = { tipo: 'etapa', id: e.id, campos: Object.assign({ nome: e.etapa, fase: e.fase || 'ANTES', responsavel: e.respN || e.responsavel || '', documento: e.documento || '', observacoes: e.observacoes || '', conclusao: e.conclusao || '' }, regraParaCampos(e.regra)) };
      const novaTurma = S.drawer !== e.turmaId;
      S.drawer = e.turmaId;
      if (novaTurma || S.fase !== e.fase) S.fase = e.fase || 'ANTES';
      return abrirTurma(e.turmaId);
    }
    const t = S.turmaIdx[S.drawer];
    if (!t) return;
    if (nome === 'editar-turma') {
      S.edit = { tipo: 'turma', id: t.id, campos: { inicio: t.inicio || '', fim: t.fim || '', local: t.local || '', unidade: t.unidade || '', observacoes: t.observacoes || '', cursoOficial: t.cursoOficial || '', cidade: t.cidade || '' } };
      return abrirTurma(t.id);
    }
    if (nome === 'cancelar-turma') { S.edit = { tipo: 'cancelar', id: t.id, campos: { motivo: '' } }; return abrirTurma(t.id); }
    if (nome === 'nova-etapa') {
      const daTurma = S.dados.etapas.filter(e => e.turmaId === t.id).sort((a, b) => a.linha - b.linha);
      const fase = S.fase || 'ANTES';
      const ancora = el.dataset.depois != null ? daTurma.find(e => e.etapa === el.dataset.depois)
        : daTurma.filter(e => e.fase === fase).pop();
      const f = ancora ? ancora.fase : fase;
      // prazo sugerido: o mesmo da etapa de cima (ajuste se precisar)
      S.edit = { tipo: 'nova-etapa', id: t.id, campos: Object.assign({ nome: '', fase: f, depoisDe: ancora ? ancora.etapa : '', responsavel: '', outras: false },
        ancora && ancora.regra ? regraParaCampos(ancora.regra) : { prazoDias: '', prazoRef: f === 'DEPOIS' ? 'dt' : 'ai' }) };
      S.fase = f;
      return abrirTurma(t.id);
    }
    if (nome === 'salvar-nova-etapa') return salvarNovaEtapa(t);
    if (nome === 'excluir-etapa') { S.edit.excluir = true; return abrirTurma(t.id); }
    if (nome === 'voltar-etapa') { S.edit.excluir = false; return abrirTurma(t.id); }
    if (nome === 'confirmar-exclusao-etapa') return excluirEtapa(t);
    if (nome === 'descartar') { S.edit = null; return abrirTurma(t.id); }
    if (nome === 'salvar-etapa') return salvarEtapa();
    if (nome === 'salvar-turma') return salvarTurma(t);
    if (nome === 'confirmar-cancelamento') return cancelarTurma(t);
    if (nome === 'reativar') return reativarTurma(t);
  }

  function salvarEtapa() {
    const e = S.idx[S.edit.id], c = Object.assign({}, S.edit.campos), t = S.turmaIdx[e.turmaId];
    if (!String(c.nome || '').trim()) return toast('O nome da etapa não pode ficar vazio.', 'err');
    const regra = c.fase === 'ANTES' ? camposParaRegra(c) : null;
    const mudouPrazo = c.fase === 'ANTES' ? regra && (!e.regra || regra.ref !== e.regra.ref || regra.dias !== e.regra.dias) : !!e.prazo;
    const campos = { nome: c.nome.trim(), fase: c.fase, responsavel: c.responsavel, documento: c.documento, observacoes: c.observacoes, conclusao: c.conclusao };
    if (mudouPrazo) campos.prazo = regra; // null = sem prazo (durante/depois)
    gravarNoServidor('atualizarEtapa', { aba: e.aba, linha: e.linha, etapa: e.etapa, turma: e.turma, linhaResumo: t && t.linhaResumo, campos: campos }, () => {
      Object.assign(e, { etapa: campos.nome, fase: c.fase, responsavel: String(c.responsavel || '').trim(), documento: String(c.documento || '').trim(),
        observacoes: String(c.observacoes || '').trim(), conclusao: c.conclusao || null });
      e.respN = respPadrao(e.responsavel);
      S.edit = null;
      recalcular();
      toast('✓ Etapa atualizada: ' + e.etapa + (mudouPrazo && RUN ? '. Recalculando o prazo…' : ''));
      montarFiltros(); refrescar();
      if (RUN && mudouPrazo) carregar(true); // o prazo vem da fórmula da planilha
    });
  }

  function salvarNovaEtapa(t) {
    const c = S.edit.campos;
    const nome = String(c.nome || '').trim();
    if (!nome) return toast('Informe o nome da etapa.', 'err');
    const regra = c.fase === 'ANTES' ? camposParaRegra(c) : null;
    if (c.fase === 'ANTES' && !regra) return toast('Informe o prazo em dias (pode ser 0).', 'err');
    const alvos = [t].concat(c.outras ? turmasSemEtapa(nome, t.id) : []).map(x => ({ aba: x.aba, linhaResumo: x.linhaResumo, turma: x.turma }));
    gravarNoServidor('incluirEtapa', { nome: nome, fase: c.fase, depoisDe: c.depoisDe, prazo: regra, responsavel: c.responsavel, alvos: alvos }, () => {
      S.edit = null; S.fase = c.fase;
      toast('✓ Etapa incluída' + (alvos.length > 1 ? ' em ' + alvos.length + ' turmas' : '') + (RUN ? '. Atualizando…' : ' (demonstração)'));
      refrescar();
      if (RUN) carregar(true);
    });
  }

  function excluirEtapa(t) {
    const e = S.idx[S.edit.id];
    gravarNoServidor('excluirEtapa', { aba: e.aba, linha: e.linha, etapa: e.etapa, turma: e.turma, linhaResumo: t.linhaResumo }, () => {
      S.edit = null;
      toast('Etapa excluída: ' + e.etapa + (RUN ? '. Atualizando…' : ' (demonstração)'));
      if (!RUN) { S.dados.etapas = S.dados.etapas.filter(x => x !== e); delete S.idx[e.id]; recalcular(); }
      refrescar();
      if (RUN) carregar(true);
    });
  }

  function salvarTurma(t) {
    const c = Object.assign({}, S.edit.campos);
    if (!c.inicio || !c.fim) return toast('Preencha início e término.', 'err');
    if (c.fim < c.inicio) return toast('O término não pode ser antes do início.', 'err');
    const mudouDatas = c.inicio !== t.inicio || c.fim !== t.fim;
    gravarNoServidor('atualizarTurma', {
      aba: t.aba, linhaResumo: t.linhaResumo, tituloLinha: t.tituloLinha, linhaCadastro: t.linhaCadastro,
      turma: t.turma, inicio: c.inicio, fim: c.fim, local: c.local, unidade: c.unidade, observacoes: c.observacoes, cursoOficial: c.cursoOficial, cidade: c.cidade
    }, () => {
      Object.assign(t, { inicio: c.inicio, fim: c.fim, local: c.local.trim(), unidade: c.unidade || t.unidade, observacoes: c.observacoes.trim(), cursoOficial: c.cursoOficial || t.cursoOficial, cidade: c.cidade.trim() });
      prepararNomes(); montarFiltros();
      t.duracao = Math.round((dt(c.fim) - dt(c.inicio)) / DIA) + 1;
      if (t.sit !== 'canc') t.sit = sitPorDatas(t);
      S.edit = null;
      toast('✓ Turma atualizada' + (mudouDatas && RUN ? '. Recalculando os prazos das etapas…' : ''));
      refrescar();
      if (RUN && mudouDatas) carregar(true); // os prazos das etapas vêm das fórmulas da planilha
    });
  }

  function cancelarTurma(t) {
    const motivo = (S.edit.campos.motivo || '').trim();
    gravarNoServidor('cancelarTurma', { linhaCadastro: t.linhaCadastro, turma: t.turma, motivo: motivo }, () => {
      t.situacao = 'Cancelado'; t.sit = 'canc';
      t.observacoes = (t.observacoes ? t.observacoes + '\n' : '') + 'Cancelado em ' + fmtAno(S.dados.hoje) + (motivo ? ': ' + motivo : '') + '.';
      S.edit = null;
      recalcular();
      toast('Turma cancelada. Para vê-la nas listas, ligue "Incluir canceladas".');
      refrescar();
    });
  }

  function reativarTurma(t) {
    gravarNoServidor('reativarTurma', { linhaCadastro: t.linhaCadastro, turma: t.turma }, () => {
      t.situacao = ''; t.sit = sitPorDatas(t);
      S.edit = null;
      recalcular();
      toast('✓ Turma reativada');
      refrescar();
      if (RUN) carregar(true);
    });
  }

  function salvarFormados(el) {
    const x = S.dados.formandos[Number(el.dataset.formando)];
    const campo = el.dataset.campoF === 'matriculados' ? 'matriculados' : 'formados';
    const n = Number(el.value);
    if (el.value === '' || !(n >= 0) || Math.floor(n) !== n) { toast('Informe um número inteiro (0 ou mais).', 'err'); el.value = x[campo] == null ? '' : x[campo]; return; }
    if (n === x[campo]) return;
    const antes = x[campo];
    x[campo] = n;
    const req = { linha: x.linha, curso: x.curso, turma: x.turma, campo: campo };
    req[campo] = n;
    gravarNoServidor('atualizarFormados', req,
      () => { toast('✓ ' + (campo === 'matriculados' ? 'Matriculados' : 'Formados') + ' de ' + x.curso + ' / ' + x.turma + ': ' + n); refrescar(); },
      () => { x[campo] = antes; });
  }

  function sitPorDatas(t) {
    if (dt(t.fim) && dt(t.fim) < HOJE) return 'enc';
    if (dt(t.inicio) && dt(t.inicio) <= HOJE) return 'exec';
    return 'plan';
  }

  /** Re-renderiza mantendo as páginas atuais. */
  function refrescar() {
    render();
    if (S.form) abrirForm(S.form);
    else if (S.drawer) abrirTurma(S.drawer);
  }

  function exportarCsv() {
    let cab, linhas, nome;
    if (S.view === 'etapas') {
      cab = ['Prazo', 'Etapa', 'Fase', 'Status', 'Responsável', 'Turma', 'Curso', 'Documento', 'Observações', 'Aba', 'Linha'];
      linhas = etapasF().map(e => [fmtAno(e.prazo), e.etapa, e.fase, e.status, e.responsavel, nomeLongo(S.turmaIdx[e.turmaId]) || e.turma, nomeCurso(S.turmaIdx[e.turmaId]) || e.curso, e.documento, e.observacoes, e.aba, e.linha]);
      nome = 'etapas';
    } else {
      cab = ['Turma', 'Curso', 'Unidade executora', 'Local', 'Início', 'Término', 'Situação', 'Etapas', 'Concluídas', 'Em execução', 'Pendentes', 'Vencidas', '% Conclusão', 'Formados'];
      linhas = turmasF().map(t => [nomeLongo(t), nomeCurso(t), t.unidade, t.local, fmtAno(t.inicio), fmtAno(t.fim), SIT[t.sit].label, t.st.total, t.st.feito, t.st.exec, t.st.pend, t.st.venc, Math.round(t.st.pct), t.formados == null ? '' : t.formados]);
      nome = 'turmas';
    }
    const csv = '\ufeff' + [cab].concat(linhas).map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = nome + '_' + S.dados.hoje + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function toast(msg, tipo) {
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), tipo === 'err' ? 6000 : 3000);
  }

  /** Estilo visual do painel: 'classico' (atual) | 'comando' | 'clean'. */
  function aplicarEstilo() {
    const h = (location.hash.match(/estilo=(\w+)/) || [])[1];
    let e = h;
    if (!e) { try { e = localStorage.getItem('painel-estilo'); } catch (x) { /* sem storage */ } }
    document.documentElement.setAttribute('data-estilo', e || 'aet');
  }
  aplicarEstilo();

  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('painel-tema', t); } catch (e) { /* sem storage */ }
  }

  function filtrosMudaram() { S.pg = {}; marcarFiltros(); render(); }

  /* ================================================================ */
  /* Eventos                                                           */
  /* ================================================================ */

  document.addEventListener('click', ev => {
    const el = ev.target;
    if (el.closest('select, input, textarea, label.switch, label.fld')) return;
    if (el.closest('[data-fechar]')) return fecharDrawer();

    const pg = el.closest('[data-pg]');
    if (pg) return virar(pg.dataset.key, Number(pg.dataset.pg));

    const ac = el.closest('[data-acao]');
    if (ac) { ev.preventDefault(); if (!ac.disabled) acao(ac.dataset.acao, ac); return; }

    const nav = el.closest('#nav button'); if (nav) return irPara(nav.dataset.view);
    if (el.closest('[data-fechar]') || el.id === 'drawerBg') return fecharDrawer();

    const seg = el.closest('[data-seg] button');
    if (seg) { S[seg.parentNode.dataset.seg] = seg.dataset.val; return render(); }

    const fc = el.closest('[data-fasechip]');
    if (fc) {
      const k = fc.dataset.fasechip, F = S.fasesEtapas;
      F[k] = !F[k];
      if (!F.ANTES && !F.DURANTE && !F.DEPOIS) F.ANTES = true;
      S.pg = {}; return render();
    }

    const ft = el.closest('[data-fasetab]');
    if (ft) { S.fase = ft.dataset.fasetab; S.pg['d-steps'] = 0; return abrirTurma(S.drawer); }

    const th = el.closest('[data-sort]');
    if (th) { const k = th.dataset.sort; S.tbl = { chave: k, asc: S.tbl.chave === k ? !S.tbl.asc : true }; S.pg['etapas-tabela'] = 0; return render(); }

    const cal = el.closest('[data-cal]');
    if (cal) { const v = Number(cal.dataset.cal); S.calMes = v === 0 ? 0 : S.calMes + v; return render(); }

    if (el.closest('[data-toggle-todas]')) { S.critTodas = !S.critTodas; S.pg['g-prazos'] = 0; return render(); }

    const resp = el.closest('[data-resp]:not(select)');
    if (resp) { S.f.resp = resp.dataset.resp === '(sem responsável)' ? '' : resp.dataset.resp; montarFiltros(); S.pg = {}; return irPara('etapas'); }

    const turma = el.closest('[data-turma]');
    if (turma) { ev.preventDefault(); return abrirTurma(turma.dataset.turma); }

    const go = el.closest('[data-goto]');
    if (go) return irPara(go.dataset.goto);
  });

  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.matches('select[data-etapa]')) return mudarStatus(el.dataset.etapa, el.value, el);
    if (el.matches('select[data-resp-etapa]')) return mudarResponsavel(el.dataset.respEtapa, el.value, el);
    if (el.matches('input[data-formando]')) return salvarFormados(el);
    if (el.id === 'selAno') {
      if (el.value === 'novo') {
        S.edit = { tipo: 'ano', campos: { modoDatas: 'semana', canceladas: 'manter' } };
        el.value = String(anoRef());
        return abrirForm('ano');
      }
      S.ano = Number(el.value); S.pg = {}; S.calMes = 0; fecharDrawer();
      $('#view').innerHTML = '<div class="loading"><div class="spinner"></div>Abrindo ' + S.ano + '…</div>';
      return carregar(false);
    }
    if (el.dataset && el.dataset.campo === 'aba' && S.form === 'nova') {
      S.edit.campos.aba = el.value; S.edit.campos.modelo = modeloPadrao(el.value);
      S.edit.campos.unidade = unidadeDoModelo(el.value, S.edit.campos.modelo);
      S.edit.campos.cursoOficial = cursoDoModelo(el.value, S.edit.campos.modelo);
      return abrirForm('nova');
    }
    if (el.dataset && el.dataset.campo === 'cursoOficial' && S.form === 'nova') { S.edit.campos.cursoOficial = el.value; return abrirForm('nova'); }
    if (el.matches('input[data-manter]')) {
      const m = S.edit.campos.manter, id = el.dataset.manter;
      if (el.checked) { if (m.indexOf(id) < 0) m.push(id); } else m.splice(m.indexOf(id), 1);
      return abrirForm('ano');
    }
    if (el.id === 'ordTurmas') { S.turmasOrdem = el.value; S.pg = {}; return render(); }
    if (el.id === 'chkConcl') { S.etapasConcluidas = el.checked; S.pg = {}; return render(); }
    if (el.id === 'chkPend') { S.soPendentes = el.checked; S.pg['d-steps'] = 0; return abrirTurma(S.drawer); }
    if (el.id === 'chkOutras' && S.edit) { S.edit.campos.outras = el.checked; return abrirTurma(S.drawer); }
    if (S.edit && S.edit.tipo === 'nova-etapa' && el.dataset && el.dataset.campo === 'depoisDe') {
      S.edit.campos.depoisDe = el.value;
      const anc = S.dados.etapas.find(e => e.turmaId === S.drawer && e.etapa === el.value);
      S.edit.campos.fase = anc ? anc.fase : 'ANTES';
      S.fase = S.edit.campos.fase;
      return abrirTurma(S.drawer);
    }
    if (S.edit && S.edit.tipo === 'nova-etapa' && el.dataset && (el.dataset.campo === 'nome' || el.dataset.campo === 'fase')) {
      S.edit.campos[el.dataset.campo] = el.value;
      if (el.dataset.campo === 'fase') S.edit.campos.prazoRef = 'ai';
      return abrirTurma(S.drawer);
    }
    if (S.edit && S.edit.tipo === 'etapa' && el.dataset && el.dataset.campo === 'fase') { S.edit.campos.fase = el.value; return abrirTurma(S.drawer); }
    const mapa = { fUnidade: 'unidade', fCurso: 'curso', fSituacao: 'situacao', fResp: 'resp' };
    if (mapa[el.id]) { S.f[mapa[el.id]] = el.value; return filtrosMudaram(); }
    if (el.id === 'fCanceladas') { S.f.canceladas = el.checked; return filtrosMudaram(); }
  });

  // Guarda o que é digitado nos formulários (sobrevive às re-renderizações).
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.campo && S.edit) S.edit.campos[el.dataset.campo] = el.value;
    if (el.dataset && el.dataset.equipe != null && S.edit && S.edit.tipo === 'equipe') S.edit.campos.lista[Number(el.dataset.equipe)] = el.value;
  });

  let tBusca;
  $('#search').addEventListener('input', ev => {
    clearTimeout(tBusca);
    tBusca = setTimeout(() => { S.f.busca = ev.target.value; filtrosMudaram(); }, 180);
  });
  $('#btnLimpar').addEventListener('click', () => {
    S.f = { unidade: '', curso: '', situacao: '', resp: '', busca: '', canceladas: false };
    $('#search').value = '';
    montarFiltros(); filtrosMudaram();
  });
  $('#btnRefresh').addEventListener('click', () => carregar(true));
  $('#btnCsv').addEventListener('click', exportarCsv);
  $('#btnTheme').addEventListener('click', () => aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  $('#selEstilo').value = document.documentElement.getAttribute('data-estilo') || 'aet';
  $('#selEstilo').addEventListener('change', ev => {
    const e = ev.target.value;
    document.documentElement.setAttribute('data-estilo', e);
    try { localStorage.setItem('painel-estilo', e); } catch (x) { /* sem storage */ }
    if (e === 'clean') aplicarTema('light'); // o Clean é claro; o Comando já é escuro
    $('#btnTheme').style.display = e === 'classico' || e === 'aet' ? '' : 'none';
    paginarTudo($('#view'));
  });
  $('#btnTheme').style.display = /^(classico|aet)$/.test($('#selEstilo').value) ? '' : 'none';
  $('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $$('#nav button').forEach(b => { b.title = b.textContent.trim(); });

  // Roda do mouse sobre uma caixa paginada = virar página.
  let ultimaRoda = 0;
  document.addEventListener('wheel', ev => {
    const box = ev.target.closest('.fit');
    if (!box || !box._paginas || box._paginas.length < 2) return;
    ev.preventDefault();
    const agora = Date.now();
    if (agora - ultimaRoda < 350 || Math.abs(ev.deltaY) < 4) return;
    ultimaRoda = agora;
    virar(box.dataset.key, ev.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  document.addEventListener('keydown', ev => {
    const digitando = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (ev.key === 'Escape') {
      if (S.form && !S.salvando) fecharDrawer();
      else if (S.edit && S.drawer && !S.salvando) { S.edit = null; abrirTurma(S.drawer); }
      else if (S.drawer) fecharDrawer();
      else if (digitando) document.activeElement.blur();
      return;
    }
    if (ev.key === 'Enter' && S.edit && !S.salvando && document.activeElement.tagName === 'INPUT' && document.activeElement.dataset.campo) {
      ev.preventDefault();
      acao({ etapa: 'salvar-etapa', turma: 'salvar-turma', cancelar: 'confirmar-cancelamento', nova: 'salvar-nova', 'nova-etapa': 'salvar-nova-etapa' }[S.edit.tipo] || '');
      return;
    }
    if (digitando) return;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
      const raiz = S.drawer ? $('#drawer') : $('#view');
      $$('.fit', raiz).forEach(b => virar(b.dataset.key, ev.key === 'ArrowRight' ? 1 : -1));
      return;
    }
    if (ev.key === '/') { ev.preventDefault(); $('#search').focus(); }
    if (ev.key === 'r' || ev.key === 'R') carregar(true);
    const atalhos = { 1: 'geral', 2: 'cronograma', 3: 'turmas', 4: 'etapas', 5: 'formandos' };
    if (atalhos[ev.key]) irPara(atalhos[ev.key]);
  });

  // Recalcula as páginas quando a janela muda de tamanho.
  let tResize;
  window.addEventListener('resize', () => {
    clearTimeout(tResize);
    tResize = setTimeout(() => { paginarTudo($('#view')); if (S.drawer) paginarTudo($('#drawer')); }, 150);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paginarTudo($('#view')); });

  // Tooltip
  const tip = $('#tooltip');
  document.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-tip]');
    if (!el) { tip.classList.remove('show'); return; }
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('show');
  });
  document.addEventListener('mousemove', ev => {
    if (!tip.classList.contains('show')) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - w - 10) + 'px';
    tip.style.top = (ev.clientY + 16 + h > window.innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + 'px';
  });

  /* ================================================================ */
  /* Início                                                            */
  /* ================================================================ */

  let temaSalvo = null;
  try { temaSalvo = localStorage.getItem('painel-tema'); } catch (e) { /* sem storage */ }
  aplicarTema(temaSalvo || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  carregar(false);
  setInterval(atualizarSync, 30000);
  setInterval(() => { $$('[data-regressiva]').forEach(el => { el.innerHTML = regressiva(el.dataset.regressiva); }); }, 60000);

  // Modo painel de TV: cartões da visão geral avançam sozinhos (pausa com o mouse em cima).
  if (ROTACAO_MS) setInterval(() => {
    if (document.hidden || S.drawer || S.view !== 'geral') return;
    $$('.fit[data-auto]').forEach(b => { if (!b.matches(':hover')) virar(b.dataset.key, 1); });
  }, ROTACAO_MS);

  // Recarrega a cada 5 min (usa o cache do servidor), sem atrapalhar quem está editando.
  setInterval(() => {
    if (!document.hidden && !semAnimacao() && !S.edit && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) carregar(false);
  }, 300000);
})();
</script>
</body>
</html>
