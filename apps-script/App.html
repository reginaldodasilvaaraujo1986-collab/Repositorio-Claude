<script>
(function () {
  'use strict';

  /* ================================================================ */
  /* Estado e utilitários                                              */
  /* ================================================================ */

  const RUN = typeof google !== 'undefined' && google.script && google.script.run;
  const DIA = 86400000;
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SIT = {
    plan: { label: 'Planejamento', cor: 'var(--s-plan)' },
    exec: { label: 'Em execução',  cor: 'var(--s-exec)' },
    enc:  { label: 'Encerrado',    cor: 'var(--s-enc)' },
    canc: { label: 'Cancelado',    cor: 'var(--s-canc)' }
  };
  const VIEWS = {
    geral:      ['Visão geral', 'Panorama das turmas e pendências'],
    cronograma: ['Cronograma', 'Linha do tempo das turmas, com janelas de planejamento e finalização'],
    turmas:     ['Turmas', 'Situação, progresso e matriz de decisão de cada turma'],
    etapas:     ['Etapas', 'Pendências por prazo — altere o status direto aqui'],
    formandos:  ['Formandos', 'Militares formados em 2026'],
    regras:     ['Regras e prazos', 'Parâmetros normativos e internos da AET/CPE']
  };
  const ROTACAO_MS = 12000; // troca automática de página nos cartões da visão geral

  const S = {
    dados: null, idx: {}, turmaIdx: {},
    view: 'geral',
    f: { area: '', curso: '', situacao: '', resp: '', busca: '', canceladas: false },
    turmasModo: 'cards', turmasOrdem: 'inicio',
    etapasModo: 'quadro', etapasConcluidas: false,
    tbl: { chave: 'prazo', asc: true },
    drawer: null, soPendentes: false, fase: 'TODAS',
    pg: {} // página atual de cada caixa paginada
  };
  let HOJE = hojeLocal();

  const $ = s => document.querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const pad = n => String(n).padStart(2, '0');
  const soma = (arr, fn) => arr.reduce((a, x) => a + (fn ? fn(x) : x), 0);
  const modoFit = () => window.matchMedia('(min-width: 861px)').matches;

  function hojeLocal() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function dt(s) { if (!s) return null; const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmt(s) { const d = dt(s); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) : '—'; }
  function fmtAno(s) { const d = dt(s); return d ? fmt(s) + '/' + d.getFullYear() : '—'; }
  function dias(s) { const d = dt(s); return d ? Math.round((d - HOJE) / DIA) : null; }
  function sitKey(s) {
    const n = norm(s);
    if (/cancel/.test(n)) return 'canc';
    if (/execu|andamento/.test(n)) return 'exec';
    if (/encerr|conclu/.test(n)) return 'enc';
    return 'plan';
  }
  const concluida = e => e.status === 'Feito' || e.status === 'Não se aplica';
  const stClass = s => 'st-' + norm(s).replace(/\s+/g, '-').replace(/^./, c => c.toUpperCase());
  const titulo = s => String(s).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()).replace(/\bDe\b/g, 'de');
  const curto = s => String(s).replace(/^Credenciamento para Uso Operacional de /, 'Cred. ').replace(/^Curso de Credenciamento para o /, 'Cred. ').replace(/Estágio Tático Rodoviário/, 'ETR');

  function relativo(n) {
    if (n === null) return 'sem prazo';
    if (n === 0) return 'hoje';
    if (n === 1) return 'amanhã';
    if (n === -1) return 'ontem';
    return n > 0 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
  }
  function badgeDias(e) {
    if (concluida(e)) return '<span class="days">' + (e.conclusao ? '✓ ' + fmt(e.conclusao) : '✓') + '</span>';
    const n = dias(e.prazo);
    if (n === null) return '<span class="days">—</span>';
    const cls = n < 0 ? 'late' : n <= 7 ? 'soon' : '';
    const txt = n < 0 ? (-n) + 'd atraso' : n === 0 ? 'hoje' : n + 'd';
    return '<span class="days ' + cls + '" data-tip="<b>Prazo ' + fmtAno(e.prazo) + '</b>' + relativo(n) + '">' + txt + '</span>';
  }

  /* ================================================================ */
  /* Paginação: nada rola — o que não cabe vira página                 */
  /* ================================================================ */

  /** Caixa paginada; o controle ‹ 1/3 › é desenhado em .pager[data-for=key]. */
  const caixa = (key, html, cls, auto) =>
    '<div class="fit ' + (cls || '') + '" data-key="' + key + '"' + (auto ? ' data-auto' : '') + '>' + html + '</div>';
  const pager = key => '<div class="pager" data-for="' + key + '"></div>';

  function paginarTudo(raiz) {
    $$('.fit', raiz).forEach(paginar);
  }

  function paginar(box) {
    const key = box.dataset.key;
    const itens = Array.from(box.children);
    itens.forEach(el => { el.style.display = ''; });
    box._paginas = null;
    if (!modoFit() || !itens.length) { desenharPager(box); return; }

    const H = box.clientHeight;
    const paginas = [[]];
    let base = itens[0].offsetTop;
    itens.forEach(el => {
      const topo = el.offsetTop, fundo = topo + el.offsetHeight;
      if (fundo - base > H + 1 && paginas[paginas.length - 1].length) { paginas.push([]); base = topo; }
      paginas[paginas.length - 1].push(el);
    });
    // Um título de grupo (.grp) nunca fica sozinho no fim da página.
    for (let i = 0; i < paginas.length - 1; i++) {
      const pg = paginas[i];
      while (pg.length > 1 && pg[pg.length - 1].classList.contains('grp')) paginas[i + 1].unshift(pg.pop());
    }
    box._paginas = paginas;
    S.pg[key] = Math.min(S.pg[key] || 0, paginas.length - 1);
    mostrarPagina(box);
  }

  function mostrarPagina(box) {
    const p = S.pg[box.dataset.key] || 0;
    box._paginas.forEach((pg, i) => pg.forEach(el => { el.style.display = i === p ? '' : 'none'; }));
    box.classList.remove('page-in'); void box.offsetWidth; box.classList.add('page-in');
    desenharPager(box);
  }

  function desenharPager(box) {
    const key = box.dataset.key;
    const alvo = document.querySelector('.pager[data-for="' + key + '"]');
    if (!alvo) return;
    const n = box._paginas ? box._paginas.length : 1;
    if (n < 2) { alvo.innerHTML = ''; return; }
    const p = S.pg[key] || 0;
    alvo.innerHTML = '<button data-pg="-1" data-key="' + key + '" title="Página anterior">‹</button>' +
      (n <= 5 ? '<span class="dots">' + Array.from({ length: n }, (_, i) => '<i class="' + (i === p ? 'on' : '') + '"></i>').join('') + '</span>' : '') +
      '<span>' + (p + 1) + '/' + n + '</span>' +
      '<button data-pg="1" data-key="' + key + '" title="Próxima página">›</button>';
  }

  function virar(key, delta) {
    const box = document.querySelector('.fit[data-key="' + key + '"]');
    if (!box || !box._paginas || box._paginas.length < 2) return;
    const n = box._paginas.length;
    S.pg[key] = ((S.pg[key] || 0) + delta + n) % n;
    mostrarPagina(box);
  }

  /* ================================================================ */
  /* Carga de dados                                                    */
  /* ================================================================ */

  function carregar(forcar) {
    $('#syncInfo').textContent = 'Sincronizando…';
    if (RUN) {
      google.script.run
        .withSuccessHandler(j => iniciar(JSON.parse(j)))
        .withFailureHandler(falhaCarga)
        .getDadosPainel(!!forcar);
    } else if (window.__DADOS_DEMO__) {
      setTimeout(() => iniciar(JSON.parse(JSON.stringify(window.__DADOS_DEMO__))), 150);
    } else {
      falhaCarga({ message: 'Abra este painel pelo Apps Script (implantação como app da Web).' });
    }
  }

  function falhaCarga(err) {
    $('#syncInfo').textContent = 'Falha ao sincronizar';
    if (!S.dados) $('#view').innerHTML = '<div class="card empty">Não foi possível ler a planilha.<br><small>' + esc(err && err.message) + '</small></div>';
    toast(err && err.message || 'Erro ao carregar', 'err');
  }

  function iniciar(d) {
    S.dados = d;
    if (d.hoje) HOJE = dt(d.hoje);
    S.idx = {}; S.turmaIdx = {};
    d.turmas.forEach(t => { t.sit = sitKey(t.situacao); S.turmaIdx[t.id] = t; });
    d.etapas.forEach(e => { S.idx[e.id] = e; });
    recalcular();
    montarFiltros();
    $('#brandSub').textContent = 'AET/CPE · ' + HOJE.getFullYear();
    $('#sheetLink').href = d.url || '#';
    const av = d.avisos || [];
    const chip = $('#avisos');
    chip.classList.toggle('on', av.length > 0);
    chip.textContent = '⚠ ' + av.length + (av.length > 1 ? ' avisos' : ' aviso');
    chip.setAttribute('data-tip', '<b>Avisos da leitura</b>' + av.map(esc).join('<br><br>'));
    atualizarSync();
    render();
    if (S.drawer) abrirTurma(S.drawer);
  }

  /** Estatísticas por turma, recalculadas sempre que um status muda. */
  function recalcular() {
    const d = S.dados;
    d.turmas.forEach(t => { t.st = { total: 0, feito: 0, exec: 0, pend: 0, venc: 0, semana: 0 }; });
    d.etapas.forEach(e => {
      const t = S.turmaIdx[e.turmaId]; if (!t) return;
      const st = t.st; st.total++;
      if (concluida(e)) { st.feito++; return; }
      if (e.status === 'Em execução') st.exec++; else st.pend++;
      const n = dias(e.prazo);
      if (n !== null && n < 0) st.venc++;
      else if (n !== null && n <= 7) st.semana++;
    });
    d.turmas.forEach(t => { t.st.pct = t.st.total ? t.st.feito / t.st.total * 100 : 0; });
    const venc = d.etapas.filter(e => S.turmaIdx[e.turmaId] && S.turmaIdx[e.turmaId].sit !== 'canc' && !concluida(e) && dias(e.prazo) < 0).length;
    $('#navBadge').textContent = venc || '';
  }

  function atualizarSync() {
    if (!S.dados) return;
    const min = Math.max(0, Math.round((Date.now() - new Date(S.dados.geradoEm)) / 60000));
    $('#syncInfo').textContent = 'Atualizado ' + (min < 1 ? 'agora' : 'há ' + min + ' min') + (RUN ? '' : ' · demonstração');
  }

  /* ================================================================ */
  /* Filtros                                                           */
  /* ================================================================ */

  function montarFiltros() {
    const d = S.dados;
    const uniq = arr => Array.from(new Set(arr.filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    preencher('#fArea', uniq(d.turmas.map(t => t.area)).map(v => [v, titulo(v)]), 'Todas as áreas', S.f.area);
    preencher('#fCurso', uniq(d.turmas.map(t => t.curso)).map(v => [v, v]), 'Todos os cursos', S.f.curso);
    preencher('#fSituacao', Object.keys(SIT).filter(k => d.turmas.some(t => t.sit === k)).map(k => [k, SIT[k].label]), 'Todas as situações', S.f.situacao);
    preencher('#fResp', uniq(d.etapas.map(e => e.responsavel)).map(v => [v, v]), 'Todos os responsáveis', S.f.resp);
    $('#fCanceladas').checked = S.f.canceladas;
    marcarFiltros();
  }
  function preencher(sel, ops, rotulo, atual) {
    $(sel).innerHTML = '<option value="">' + rotulo + '</option>' +
      ops.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === atual ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
  }
  function marcarFiltros() {
    [['#fArea', 'area'], ['#fCurso', 'curso'], ['#fSituacao', 'situacao'], ['#fResp', 'resp']]
      .forEach(([s, k]) => $(s).classList.toggle('on', !!S.f[k]));
  }

  function turmaPassa(t, comBusca) {
    const f = S.f;
    if (!f.canceladas && t.sit === 'canc' && f.situacao !== 'canc') return false;
    if (f.area && t.area !== f.area) return false;
    if (f.curso && t.curso !== f.curso) return false;
    if (f.situacao && t.sit !== f.situacao) return false;
    if (comBusca && f.busca && norm([t.turma, t.curso, t.local, t.area].join(' ')).indexOf(norm(f.busca)) < 0) return false;
    return true;
  }
  const turmasF = (comBusca = true) => S.dados.turmas.filter(t => turmaPassa(t, comBusca));
  function etapasF(comBusca = true) {
    const ok = {};
    turmasF(false).forEach(t => { ok[t.id] = true; });
    const b = norm(S.f.busca);
    return S.dados.etapas.filter(e => ok[e.turmaId] &&
      (!S.f.resp || e.responsavel === S.f.resp) &&
      (!comBusca || !b || norm([e.etapa, e.turma, e.responsavel, e.documento, e.fase].join(' ')).indexOf(b) >= 0));
  }
  function formandosF() {
    const f = S.dados.formandos || [];
    return S.f.curso ? f.filter(x => norm(x.curso) === norm(S.f.curso)) : f;
  }

  /* ================================================================ */
  /* Renderização                                                      */
  /* ================================================================ */

  function render() {
    if (!S.dados) return;
    const v = VIEWS[S.view];
    $('#pageTitle').textContent = v[0];
    $('#pageSub').textContent = v[1];
    $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === S.view));
    const fn = { geral: vGeral, cronograma: vCronograma, turmas: vTurmas, etapas: vEtapas, formandos: vFormandos, regras: vRegras }[S.view];
    $('#view').innerHTML = '<div class="vroot fade-in">' + fn() + '</div>';
    paginarTudo($('#view'));
  }

  function irPara(view) {
    S.view = view;
    $('#sidebar').classList.remove('open');
    render();
  }

  /** Cartão com cabeçalho fixo e corpo paginado. */
  function painel(o) {
    return '<div class="card panel ' + (o.cls || '') + '" style="' + (o.style || '') + '">' +
      '<div class="card-head"><h2>' + o.titulo + '</h2><span class="meta">' + (o.meta || '') + '</span>' + pager(o.key) + '</div>' +
      (o.antes || '') + caixa(o.key, o.html, o.fitCls, o.auto) + (o.depois || '') + '</div>';
  }

  /* ---------- Visão geral ---------- */

  function vGeral() {
    const ts = turmasF();
    const ids = {}; ts.forEach(t => { ids[t.id] = 1; });
    const es = etapasF(false).filter(e => ids[e.turmaId]);
    const abertas = es.filter(e => !concluida(e));
    const venc = abertas.filter(e => dias(e.prazo) < 0);
    const semana = abertas.filter(e => { const n = dias(e.prazo); return n !== null && n >= 0 && n <= 7; });
    const pct = es.length ? (es.length - abertas.length) / es.length * 100 : 0;
    const cont = k => ts.filter(t => t.sit === k).length;
    const proxima = ts.filter(t => dias(t.inicio) > 0).sort((a, b) => a.inicio.localeCompare(b.inicio))[0];

    const kpis = [
      kpi('Turmas', ts.length, '', [cont('plan') + ' planej.', cont('exec') + ' em exec.', cont('enc') + ' encerr.'].join(' · '), 'turmas'),
      kpi('Etapas concluídas', Math.round(pct), '%', (es.length - abertas.length) + ' de ' + es.length, 'etapas', '', anel(pct, 42)),
      kpi('Etapas vencidas', venc.length, '', 'em ' + new Set(venc.map(e => e.turmaId)).size + ' turma(s)', 'etapas', venc.length ? 'danger' : ''),
      kpi('Vencem em 7 dias', semana.length, '', semana.length ? 'próxima: ' + fmt(semana.map(e => e.prazo).sort()[0]) : 'nada na semana', 'etapas', semana.length ? 'warn' : ''),
      kpi('Formados', soma(formandosF(), x => x.formados), '', 'militares em ' + HOJE.getFullYear(), 'formandos'),
      proxima ? kpi('Próxima turma', dias(proxima.inicio), 'dias', esc(proxima.turma), null, '', '', proxima.id)
              : kpi('Próxima turma', '—', '', 'nenhuma prevista')
    ].join('');

    return '<div class="grid g-kpi">' + kpis + '</div>' +
      '<div class="geral-main">' + cardAgora(ts) + cardCriticas(venc.concat(semana)) +
      cardProgresso(ts) + cardStatus(es) + cardResponsaveis(abertas) + '</div>';
  }

  function kpi(label, valor, unid, foot, ir, cls, extra, turmaId) {
    const attr = ir ? ' data-goto="' + ir + '"' : turmaId ? ' data-turma="' + turmaId + '"' : '';
    return '<div class="card kpi ' + (cls || '') + (attr ? ' click' : '') + '"' + attr + '>' + (extra || '') +
      '<div class="label">' + label + '</div>' +
      '<div class="value">' + valor + (unid ? '<small>' + unid + '</small>' : '') + '</div>' +
      '<div class="foot">' + foot + '</div></div>';
  }

  function cardAgora(ts) {
    const exec = ts.filter(t => t.sit === 'exec');
    const prox = ts.filter(t => t.sit === 'plan' && dias(t.inicio) >= 0).sort((a, b) => a.inicio.localeCompare(b.inicio));
    const item = (t, next) => {
      const n = next ? dias(t.inicio) : dias(t.fim);
      const prep = t.prazoPlanejamento ? dias(t.prazoPlanejamento) : null;
      return '<div class="now-item ' + (next ? 'next' : '') + '" data-turma="' + t.id + '">' +
        '<div style="display:flex;justify-content:space-between;gap:8px">' + pillSit(t.sit) + '<span class="tag">' + esc(t.curso) + '</span></div>' +
        '<div class="t">' + esc(t.turma) + '</div>' +
        '<div class="s">' + esc(t.local) + ' · ' + fmt(t.inicio) + ' a ' + fmt(t.fim) + ' · ' +
        (next ? 'começa ' + relativo(n) : 'termina ' + relativo(n)) +
        (next && prep !== null && prep < 0 ? ' · <b style="color:var(--danger)">planejamento vencido</b>' : '') + '</div>' +
        barra(t.st) +
        '<div class="now-meta"><span>' + t.st.feito + '/' + t.st.total + ' etapas</span><span>' +
        (t.st.venc ? '<b style="color:var(--danger)">' + t.st.venc + ' vencida(s)</b> · ' : '') +
        '<b class="pct">' + Math.round(t.st.pct) + '%</b></span></div></div>';
    };
    const html = exec.map(t => item(t, false)).concat(prox.map(t => item(t, true))).join('');
    return painel({
      titulo: 'Em andamento e próximas', meta: exec.length + ' em exec. · ' + prox.length + ' a iniciar',
      key: 'g-agora', fitCls: 'lista', auto: true, style: 'grid-area:agora',
      html: html || '<div class="empty">Nenhuma turma em execução ou prevista.</div>'
    });
  }

  function cardCriticas(lista) {
    lista = lista.slice().sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)));
    return painel({
      titulo: 'Etapas que pedem atenção', meta: lista.length + ' · vencidas e 7 dias',
      key: 'g-crit', cls: 'flush', auto: true, style: 'grid-area:crit',
      html: lista.map(linhaEtapa).join('') || '<div class="empty">Tudo em dia. 🎉</div>',
      depois: lista.length ? '<button class="more" data-goto="etapas">abrir quadro de etapas →</button>' : ''
    });
  }

  function linhaEtapa(e) {
    return '<div class="row" data-turma="' + e.turmaId + '">' + badgeDias(e) +
      '<div style="min-width:0"><div class="t" title="' + esc(e.etapa) + '">' + esc(e.etapa) + '</div>' +
      '<div class="s">' + esc(curto(e.turma)) + ' · ' + esc(e.responsavel || 's/ resp.') + ' · ' + fmtAno(e.prazo) + '</div></div>' +
      seletor(e) + '</div>';
  }

  function cardProgresso(ts) {
    const linhas = ts.filter(t => t.st.total).map(t =>
      '<div class="hbar click" data-turma="' + t.id + '" data-tip="<b>' + esc(t.turma) + '</b>' + SIT[t.sit].label + '<br>' + t.st.feito + ' feitas · ' + t.st.exec + ' em execução · ' + t.st.pend + ' pendentes' + (t.st.venc ? '<br>' + t.st.venc + ' vencida(s)' : '') + '">' +
      '<span class="n">' + esc(curto(t.turma)) + '</span>' +
      '<span class="track"><i style="width:' + t.st.pct + '%;background:' + SIT[t.sit].cor + '"></i>' +
      '<i style="width:' + (t.st.exec / t.st.total * 100) + '%;background:var(--s-exec);opacity:.45"></i></span>' +
      '<span class="v">' + Math.round(t.st.pct) + '%</span></div>').join('');
    return painel({
      titulo: 'Progresso por turma', key: 'g-prog', fitCls: 'hbars', auto: true, style: 'grid-area:prog',
      antes: '<div class="legend" style="margin-bottom:10px">' + Object.keys(SIT).map(k => '<span><i style="background:' + SIT[k].cor + '"></i>' + SIT[k].label + '</span>').join('') + '</div>',
      html: linhas || '<div class="empty">Sem turmas no filtro.</div>'
    });
  }

  function cardStatus(es) {
    const c = { feito: 0, na: 0, exec: 0, pend: 0, venc: 0 };
    es.forEach(e => {
      if (e.status === 'Feito') c.feito++;
      else if (e.status === 'Não se aplica') c.na++;
      else if (dias(e.prazo) < 0) c.venc++;
      else if (e.status === 'Em execução') c.exec++;
      else c.pend++;
    });
    const seg = [
      { v: c.feito, cor: 'var(--s-enc)', l: 'Feito' },
      { v: c.exec, cor: 'var(--s-exec)', l: 'Em execução' },
      { v: c.pend, cor: 'var(--s-plan)', l: 'Pendente no prazo' },
      { v: c.venc, cor: 'var(--danger)', l: 'Vencida' },
      { v: c.na, cor: 'var(--s-canc)', l: 'Não se aplica' }
    ];
    const fases = ['ANTES', 'DURANTE', 'DEPOIS'].map(f => {
      const x = es.filter(e => e.fase === f), ok = x.filter(concluida).length;
      const p = x.length ? ok / x.length * 100 : 0;
      return '<div class="hbar" style="grid-template-columns:62px 1fr 40px"><span class="n">' + titulo(f) + '</span>' +
        '<span class="track"><i style="width:' + p + '%;background:var(--s-enc)"></i></span><span class="v">' + Math.round(p) + '%</span></div>';
    }).join('');
    return painel({
      titulo: 'Status das etapas', meta: es.length + ' etapas', key: 'g-status', fitCls: 'lista', auto: true, style: 'grid-area:status',
      html: '<div class="donut-wrap">' + rosca(seg, 112) + '<div class="legend">' +
        seg.map(s => '<span><i style="background:' + s.cor + '"></i>' + s.l + '<b>' + s.v + '</b></span>').join('') + '</div></div>' +
        '<div class="hbars" style="gap:6px;flex:none"><div class="sublabel">Conclusão por fase</div>' + fases + '</div>'
    });
  }

  function cardResponsaveis(abertas) {
    const m = {};
    abertas.forEach(e => {
      const k = e.responsavel || '(sem responsável)';
      m[k] = m[k] || { t: 0, v: 0 }; m[k].t++;
      if (dias(e.prazo) < 0) m[k].v++;
    });
    const arr = Object.keys(m).map(k => [k, m[k]]).sort((a, b) => b[1].t - a[1].t);
    const max = arr.length ? arr[0][1].t : 1;
    const linhas = arr.map(([k, x]) =>
      '<div class="hbar click" data-resp="' + esc(k) + '" data-tip="<b>' + esc(k) + '</b>' + x.t + ' em aberto · ' + x.v + ' vencida(s)">' +
      '<span class="n">' + esc(k) + '</span><span class="track">' +
      '<i style="width:' + (x.v / max * 100) + '%;background:var(--danger)"></i>' +
      '<i style="width:' + ((x.t - x.v) / max * 100) + '%;background:var(--s-plan)"></i></span>' +
      '<span class="v">' + x.t + '</span></div>').join('');
    return painel({
      titulo: 'Pendências por responsável', meta: 'clique para filtrar', key: 'g-resp', fitCls: 'hbars', auto: true, style: 'grid-area:resp',
      antes: '<div class="legend" style="margin-bottom:10px"><span><i style="background:var(--danger)"></i>Vencidas</span><span><i style="background:var(--s-plan)"></i>No prazo</span></div>',
      html: linhas || '<div class="empty">Nenhuma pendência.</div>'
    });
  }

  /* ---------- Cronograma ---------- */

  function vCronograma() {
    const ts = turmasF();
    if (!ts.length) return '<div class="card empty">Nenhuma turma no filtro.</div>';
    const datas = [];
    ts.forEach(t => [t.inicio, t.fim, t.prazoPlanejamento, t.prazoFinalizacao].forEach(x => { if (x) datas.push(x); }));
    datas.sort();
    const ini = dt(datas[0]); ini.setDate(1);
    const fimD = dt(datas[datas.length - 1]);
    const fim = new Date(fimD.getFullYear(), fimD.getMonth() + 1, 1);
    const span = fim - ini;
    const pos = s => Math.max(0, Math.min(100, (dt(s) - ini) / span * 100));
    const meses = [];
    for (let d = new Date(ini); d < fim; d.setMonth(d.getMonth() + 1)) meses.push(new Date(d));
    const cols = meses.map(m => ((new Date(m.getFullYear(), m.getMonth() + 1, 1) - m) / span * 100) + '%').join(' ');
    const hojePos = HOJE >= ini && HOJE < fim ? (HOJE - ini) / span * 100 : null;
    const linhaHoje = hojePos !== null ? '<div class="g-today" style="left:' + hojePos + '%"></div>' : '';
    const grade = '<div class="g-grid" style="grid-template-columns:' + cols + '">' + meses.map(() => '<div></div>').join('') + '</div>';

    const grupos = {};
    ts.forEach(t => { (grupos[t.curso] = grupos[t.curso] || []).push(t); });

    let linhas = '';
    Object.keys(grupos).sort((a, b) => String(grupos[a][0].inicio).localeCompare(String(grupos[b][0].inicio))).forEach(g => {
      linhas += '<div class="g-row grp"><div class="g-group">' + esc(g) + '</div><div class="g-track">' + grade + linhaHoje + '</div></div>';
      grupos[g].forEach(t => {
        const l = pos(t.inicio), w = Math.max(.6, pos(t.fim) + (100 / (span / DIA)) - l);
        const prepI = t.prazoPlanejamento ? pos(t.prazoPlanejamento) : l;
        const posF = t.prazoFinalizacao ? pos(t.prazoFinalizacao) : l + w;
        const tip = '<b>' + esc(t.turma) + '</b>' + esc(t.local) + '<br>' + fmtAno(t.inicio) + ' a ' + fmtAno(t.fim) +
          (t.duracao ? ' (' + t.duracao + ' dias)' : '') + '<br>' + SIT[t.sit].label + ' · ' + Math.round(t.st.pct) + '% das etapas' +
          (t.st.venc ? '<br>⚠ ' + t.st.venc + ' etapa(s) vencida(s)' : '') +
          (t.prazoPlanejamento ? '<br>Planejamento até ' + fmt(t.prazoPlanejamento) : '') +
          (t.prazoFinalizacao ? ' · Finalização até ' + fmt(t.prazoFinalizacao) : '');
        linhas += '<div class="g-row"><div class="g-label" data-turma="' + t.id + '" title="' + esc(t.turma) + '">' + esc(curto(t.turma)) + '<small>' + esc(t.local) + '</small></div>' +
          '<div class="g-track">' + grade +
          '<div class="g-prep" style="left:' + prepI + '%;width:' + Math.max(0, posF - prepI) + '%"></div>' +
          '<div class="g-bar ' + t.sit + '" data-turma="' + t.id + '" data-tip="' + esc(tip) + '" style="left:' + l + '%;width:' + w + '%">' +
          (t.sit !== 'canc' ? '<div class="fill" style="width:' + t.st.pct + '%"></div>' : '') + '</div>' +
          (t.st.venc && t.sit !== 'canc' ? '<div class="g-late" style="left:calc(' + (l + w) + '% - 4px)"></div>' : '') +
          linhaHoje +
          '</div></div>';
      });
    });

    return '<div class="card panel grow"><div class="card-head"><h2>Linha do tempo</h2>' +
      '<div class="legend" style="margin-left:auto">' + Object.keys(SIT).map(k => '<span><i style="background:' + SIT[k].cor + '"></i>' + SIT[k].label + '</span>').join('') +
      '<span><i style="background:var(--surface-3);height:4px"></i>Planejamento → finalização</span>' +
      '<span><i style="background:var(--danger);border-radius:50%"></i>Etapas vencidas</span>' +
      '<span><i style="background:var(--accent);width:2px"></i>Hoje</span></div>' + pager('crono') + '</div>' +
      '<div class="g-head"><div class="sublabel" style="align-self:center" data-tip="A parte clara de cada barra é o % de etapas concluídas">' + ts.length + ' turma(s)</div>' +
      '<div class="g-months" style="grid-template-columns:' + cols + '">' +
      meses.map((m, i) => '<div>' + MESES[m.getMonth()] + (m.getMonth() === 0 || i === 0 ? ' ' + String(m.getFullYear()).slice(2) : '') + '</div>').join('') +
      (hojePos !== null ? '<span class="g-today-label" style="left:' + hojePos + '%">hoje ' + fmt(S.dados.hoje) + '</span>' : '') + '</div></div>' +
      '<div class="g-body">' + caixa('crono', linhas, 'g-rows') + '</div></div>';
  }

  /* ---------- Turmas ---------- */

  function vTurmas() {
    const ord = {
      inicio: (a, b) => String(a.inicio).localeCompare(String(b.inicio)),
      progresso: (a, b) => a.st.pct - b.st.pct,
      vencidas: (a, b) => b.st.venc - a.st.venc,
      nome: (a, b) => a.turma.localeCompare(b.turma, 'pt-BR')
    }[S.turmasOrdem];
    const ts = turmasF().slice().sort(ord);

    const barraFerr = '<div class="toolbar">' + segmento('turmasModo', [['cards', 'Cartões'], ['tabela', 'Tabela']]) +
      '<select id="ordTurmas" class="ghost">' +
      [['inicio', 'Ordenar por início'], ['progresso', 'Menor progresso'], ['vencidas', 'Mais vencidas'], ['nome', 'Nome']]
        .map(o => '<option value="' + o[0] + '"' + (S.turmasOrdem === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '</select><span style="color:var(--ink-3);font-size:12.5px">' + ts.length + ' turma(s)</span>' + pager('turmas-' + S.turmasModo) + '</div>';

    if (!ts.length) return barraFerr + '<div class="card empty">Nenhuma turma no filtro.</div>';

    if (S.turmasModo === 'tabela') {
      const cols = 'grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) 84px 84px 112px 64px minmax(110px,1fr) 64px 70px';
      return barraFerr + '<div class="card flush panel grow">' +
        '<div class="gt-head" style="' + cols + '"><span>Turma</span><span>Curso</span><span>Local</span><span>Início</span><span>Término</span><span>Situação</span><span>Etapas</span><span>Conclusão</span><span>Vencidas</span><span>Formados</span></div>' +
        caixa('turmas-tabela', ts.map(t =>
          '<div class="gt-row click" style="' + cols + '" data-turma="' + t.id + '"><b title="' + esc(t.turma) + '">' + esc(t.turma) + '</b><span>' + esc(t.curso) + '</span><span>' + esc(t.local) + '</span>' +
          '<span class="mono">' + fmtAno(t.inicio) + '</span><span class="mono">' + fmtAno(t.fim) + '</span><span>' + pillSit(t.sit) + '</span>' +
          '<span class="mono">' + t.st.feito + '/' + t.st.total + '</span><span style="display:flex;gap:8px;align-items:center">' + barra(t.st) + '<span class="pct">' + Math.round(t.st.pct) + '%</span></span>' +
          '<span class="mono" style="color:' + (t.st.venc ? 'var(--danger)' : 'inherit') + '">' + (t.st.venc || '—') + '</span><span class="mono">' + (t.formados != null ? t.formados : '—') + '</span></div>').join('')) +
        '</div>';
    }

    return barraFerr + '<div class="grow" style="display:flex;flex-direction:column">' + caixa('turmas-cards', ts.map(t => {
      const n = t.sit === 'plan' ? dias(t.inicio) : null;
      return '<div class="card tcard" data-turma="' + t.id + '">' +
        '<div class="top"><span class="tag">' + esc(t.curso) + '</span>' + pillSit(t.sit) + '</div>' +
        '<div><h3 title="' + esc(t.turma) + '">' + esc(t.turma) + '</h3><div class="s">' + esc(t.local) + ' · ' + fmt(t.inicio) + ' a ' + fmtAno(t.fim) +
        (t.duracao ? ' · ' + t.duracao + 'd' : '') + (n !== null && n >= 0 ? ' · começa ' + relativo(n) : '') + '</div></div>' +
        '<div>' + barra(t.st) + '<div class="nums" style="margin-top:6px"><span><b>' + t.st.feito + '</b> feitas · <b>' + t.st.exec + '</b> exec. · <b>' + t.st.pend + '</b> pend.</span><span class="pct">' + Math.round(t.st.pct) + '%</span></div></div>' +
        '<div class="foot-line"><div class="flags">' + bandeiras(t) + '</div>' +
        (t.st.venc && t.sit !== 'canc' ? '<span class="alert-line">⚠ ' + t.st.venc + '</span>' : '') + '</div></div>';
    }).join(''), 'g-cards') + '</div>';
  }

  function bandeiras(t) {
    return [['licitacao', 'Licitação'], ['docenteExterno', 'Docente ext.'], ['avaliacao', 'Avaliação'], ['diaria', 'Diária'], ['mais8dias', '> 8 dias'], ['autorizacaoDiaria', 'Autoriz. diária']]
      .filter(([k]) => t[k] !== undefined && t[k] !== '')
      .map(([k, l]) => { const v = norm(t[k]); return '<span class="flag ' + (v === 'sim' ? 'sim' : /definir/.test(v) ? 'def' : '') + '" data-tip="<b>' + l + '</b>' + esc(t[k]) + '">' + l + '</span>'; }).join('');
  }

  const segmento = (chave, ops) => '<div class="seg" data-seg="' + chave + '">' +
    ops.map(([k, l]) => '<button data-val="' + k + '" class="' + (S[chave] === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';

  /* ---------- Etapas ---------- */

  function vEtapas() {
    const todas = etapasF();
    const abertas = todas.filter(e => !concluida(e));

    const barraFerr = '<div class="toolbar">' + segmento('etapasModo', [['quadro', 'Quadro'], ['tabela', 'Tabela']]) +
      (S.etapasModo === 'tabela' ? '<label class="switch"><input type="checkbox" id="chkConcl"' + (S.etapasConcluidas ? ' checked' : '') + '><span></span>Mostrar concluídas</label>' : '') +
      '<span style="color:var(--ink-3);font-size:12.5px">' + abertas.length + ' em aberto · ' + (todas.length - abertas.length) + ' concluídas</span>' +
      (S.etapasModo === 'tabela' ? pager('etapas-tabela') : '') + '</div>';

    if (S.etapasModo === 'tabela') {
      const lista = (S.etapasConcluidas ? todas : abertas).slice();
      const k = S.tbl.chave, dir = S.tbl.asc ? 1 : -1;
      lista.sort((a, b) => String(a[k] || '\uffff').localeCompare(String(b[k] || '\uffff'), 'pt-BR') * dir);
      const cols = 'grid-template-columns:150px minmax(0,2.4fr) minmax(0,1.4fr) 74px minmax(0,1fr) minmax(0,1.3fr) 124px';
      const cab = [['prazo', 'Prazo'], ['etapa', 'Etapa'], ['turma', 'Turma'], ['fase', 'Fase'], ['responsavel', 'Responsável'], ['documento', 'Documento'], ['status', 'Status']];
      return barraFerr + '<div class="card flush panel grow">' +
        '<div class="gt-head" style="' + cols + '">' + cab.map(([c, l]) => '<span data-sort="' + c + '" class="' + (k === c ? 'sorted' + (S.tbl.asc ? ' asc' : '') : '') + '">' + l + '</span>').join('') + '</div>' +
        caixa('etapas-tabela', lista.map(e =>
          '<div class="gt-row" style="' + cols + '"><span><span class="mono">' + fmt(e.prazo) + '</span> ' + badgeDias(e) + '</span>' +
          '<span title="' + esc(e.etapa) + '">' + esc(e.etapa) + '</span><a href="#" data-turma="' + e.turmaId + '">' + esc(curto(e.turma)) + '</a>' +
          '<span><span class="tag">' + esc(e.fase) + '</span></span><span>' + esc(e.responsavel) + '</span>' +
          '<span class="dim">' + esc(e.documento) + '</span><span>' + seletor(e) + '</span></div>').join('') || '<div class="empty">Nenhuma etapa.</div>') +
        '</div>';
    }

    const colunas = [
      { k: 'late', l: 'Vencidas', f: n => n !== null && n < 0 },
      { k: 'soon', l: 'Próximos 7 dias', f: n => n !== null && n >= 0 && n <= 7 },
      { k: 'mes', l: '8 a 30 dias', f: n => n !== null && n > 7 && n <= 30 },
      { k: 'depois', l: 'Mais de 30 dias', f: n => n === null || n > 30 }
    ];
    return barraFerr + '<div class="board grow">' + colunas.map(c => {
      const itens = abertas.filter(e => c.f(dias(e.prazo))).sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)));
      return '<div class="col ' + c.k + '"><div class="col-head"><span>' + c.l + '</span><span class="count">' + itens.length + '</span>' + pager('col-' + c.k) + '</div>' +
        caixa('col-' + c.k, itens.map(e =>
          '<div class="ecard"><div class="t">' + esc(e.etapa) + '</div>' +
          '<div class="s" data-turma="' + e.turmaId + '">' + esc(curto(e.turma)) + ' · ' + esc(e.responsavel || 's/ resp.') + '</div>' +
          '<div class="b">' + badgeDias(e) + seletor(e) + '</div></div>').join('') || '<div class="empty">Nada aqui.</div>') + '</div>';
    }).join('') + '</div>';
  }

  /* ---------- Formandos ---------- */

  function vFormandos() {
    const f = formandosF();
    const b = norm(S.f.busca);
    const lista = b ? f.filter(x => norm([x.curso, x.turma, x.local].join(' ')).indexOf(b) >= 0) : f;
    const total = soma(f, x => x.formados);
    const comFormados = f.filter(x => x.formados > 0).length;

    const m = {};
    f.forEach(x => { m[x.curso] = (m[x.curso] || 0) + x.formados; });
    const arr = Object.keys(m).map(k => [k, m[k]]).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...arr.map(a => a[1]));
    const cols = 'grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1.2fr) 80px';

    return '<div class="grid g-kpi k3">' +
      kpi('Total de formados', total, '', 'militares em ' + HOJE.getFullYear()) +
      kpi('Turmas com formatura', comFormados, '', 'de ' + f.length + ' turmas listadas') +
      kpi('Média por turma', comFormados ? Math.round(total / comFormados) : 0, '', 'considerando turmas com formados') +
      '</div><div class="grid grow" style="grid-template-columns:1fr 1.3fr">' +
      painel({
        titulo: 'Formados por curso', meta: 'total ' + total, key: 'f-curso', fitCls: 'hbars',
        html: arr.map(([k, v]) => '<div class="hbar"><span class="n">' + esc(k) + '</span><span class="track"><i style="width:' + (v / max * 100) + '%;background:var(--accent)"></i></span><span class="v">' + v + '</span></div>').join('') || '<div class="empty">Sem registros.</div>'
      }) +
      '<div class="card flush panel"><div class="card-head"><h2>Por turma</h2><span class="meta">aba "Formandos 2026"</span>' + pager('f-turma') + '</div>' +
      '<div class="gt-head" style="' + cols + ';margin-top:8px"><span>Curso</span><span>Turma</span><span>Local</span><span style="text-align:right">Formados</span></div>' +
      caixa('f-turma', lista.map(x => '<div class="gt-row" style="' + cols + (x.formados ? '' : ';color:var(--ink-3)') + '"><span>' + esc(x.curso) + '</span><span>' + esc(x.turma) + '</span><span>' + esc(x.local) + '</span><span class="mono" style="text-align:right;font-weight:600">' + x.formados + '</span></div>').join('')) +
      '</div></div>';
  }

  /* ---------- Regras ---------- */

  function vRegras() {
    const b = norm(S.f.busca);
    const rs = (S.dados.regras || []).filter(r => !b || norm(Object.values(r).join(' ')).indexOf(b) >= 0);
    if (!rs.length) return '<div class="card empty">Nenhuma regra encontrada.</div>';
    return '<div class="toolbar"><span style="color:var(--ink-3);font-size:12.5px">' + rs.length + ' regra(s)</span>' + pager('regras') + '</div>' +
      '<div class="grow" style="display:flex;flex-direction:column">' + caixa('regras', rs.map(r =>
        '<div class="card rule"><div style="display:flex;justify-content:space-between"><span class="code">' + esc(r.codigo) + '</span><span class="tag">' + esc(r.natureza) + '</span></div>' +
        '<h3>' + esc(r.etapa) + '</h3><div class="prazo">' + esc(r.prazo) + '</div>' +
        '<dl><dt>Contagem</dt><dd>' + esc(r.contagem) + '</dd><dt>Referência</dt><dd>' + esc(r.marco) + '</dd><dt>Aplica-se</dt><dd>' + esc(r.aplicabilidade) + '</dd></dl>' +
        (r.observacoes ? '<div class="obs">' + esc(r.observacoes) + '</div>' : '') + '</div>').join(''), 'g-rules') + '</div>';
  }

  /* ================================================================ */
  /* Drawer da turma: dados à esquerda, checklist paginado à direita   */
  /* ================================================================ */

  function abrirTurma(id) {
    const t = S.turmaIdx[id]; if (!t) return;
    if (S.drawer !== id) { S.fase = 'TODAS'; delete S.pg['d-steps']; }
    S.drawer = id;
    const es = S.dados.etapas.filter(e => e.turmaId === id);
    const nIni = dias(t.inicio);
    const fases = ['ANTES', 'DURANTE', 'DEPOIS'].filter(f => es.some(e => e.fase === f));
    es.forEach(e => { if (fases.indexOf(e.fase) < 0) fases.push(e.fase); });
    if (S.fase !== 'TODAS' && fases.indexOf(S.fase) < 0) S.fase = 'TODAS';

    let lista = S.fase === 'TODAS' ? es : es.filter(e => e.fase === S.fase);
    if (S.soPendentes) lista = lista.filter(e => !concluida(e));
    const steps = lista.map(e => {
      const n = dias(e.prazo), late = !concluida(e) && n !== null && n < 0;
      const cls = e.status === 'Feito' ? 'done' : e.status === 'Não se aplica' ? 'na' : late ? 'late' : '';
      return '<div class="step ' + cls + '"><div class="chk">' + (cls === 'done' ? '✓' : cls === 'na' ? '–' : '') + '</div>' +
        '<div style="min-width:0"><div class="t" title="' + esc(e.etapa) + '">' + (S.fase === 'TODAS' ? '<span class="fase">' + esc(e.fase) + '</span>' : '') + esc(e.etapa) + '</div>' +
        '<div class="m">Prazo ' + fmtAno(e.prazo) + ' · ' + esc(e.responsavel || 's/ resp.') + (e.documento ? ' · ' + esc(e.documento) : '') +
        (e.conclusao ? ' · concluída ' + fmt(e.conclusao) : '') + (e.observacoes ? ' · 💬 ' + esc(e.observacoes) : '') + '</div></div>' +
        '<div class="r">' + badgeDias(e) + seletor(e) + '</div></div>';
    }).join('');

    const abas = [['TODAS', 'Todas', es]].concat(fases.map(f => [f, titulo(f), es.filter(e => e.fase === f)]));
    const link = S.dados.url && t.gid != null ? S.dados.url.split('#')[0] + '#gid=' + t.gid + (t.linhaResumo ? '&range=A' + t.linhaResumo : '') : '';
    const kvSim = v => '<dd class="' + (norm(v) === 'sim' ? 'sim' : '') + '">' + esc(v || '—') + '</dd>';

    $('#drawer').innerHTML = '<button class="close" data-fechar title="Fechar (Esc)">✕</button><div class="d-grid">' +
      '<div class="d-left">' +
        '<div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="tag">' + esc(t.curso) + '</span>' +
        (t.area && norm(t.area) !== norm(t.curso) ? '<span class="tag">' + esc(titulo(t.area)) + '</span>' : '') + pillSit(t.sit) + '</div>' +
        '<h2>' + esc(t.turma) + '</h2><div class="sub">' + esc(t.local) + ' · ' + fmtAno(t.inicio) + ' a ' + fmtAno(t.fim) +
        (t.duracao ? ' · ' + t.duracao + ' dia(s)' : '') + (link ? '<br><a href="' + esc(link) + '" target="_blank" rel="noopener">abrir na planilha ↗</a>' : '') + '</div></div>' +
        '<div class="d-kpis">' + dk('Conclusão', Math.round(t.st.pct) + '%') + dk('Etapas', t.st.feito + '/' + t.st.total) +
        dk('Vencidas', '<span style="color:' + (t.st.venc ? 'var(--danger)' : 'inherit') + '">' + t.st.venc + '</span>') +
        (t.sit === 'plan' && nIni !== null ? dk('Início', nIni + ' dias') : dk('Formados', t.formados != null ? t.formados : '—')) + '</div>' +
        '<div style="flex:none;display:flex">' + barra(t.st) + '</div>' +
        (t.prazoPlanejamento || t.prazoFinalizacao ? '<div class="d-section"><h3>Janela de trabalho</h3><dl class="kv">' +
          '<dt>Prazo de planejamento</dt><dd>' + fmtAno(t.prazoPlanejamento) + ' <small>' + relativo(dias(t.prazoPlanejamento)) + '</small></dd>' +
          '<dt>Execução</dt><dd>' + fmt(t.inicio) + ' a ' + fmt(t.fim) + '</dd>' +
          '<dt>Prazo de finalização</dt><dd>' + fmtAno(t.prazoFinalizacao) + ' <small>' + relativo(dias(t.prazoFinalizacao)) + '</small></dd></dl></div>' : '') +
        (bandeiras(t) ? '<div class="d-section"><h3>Matriz de decisão</h3><dl class="kv">' +
          [['licitacao', 'Licitação'], ['docenteExterno', 'Docente externo'], ['avaliacao', 'Avaliação'], ['diaria', 'Diária'], ['mais8dias', 'Curso > 8 dias'], ['autorizacaoDiaria', 'Autorização prévia de diária']]
            .map(([k, l]) => '<dt>' + l + '</dt>' + kvSim(t[k])).join('') + '</dl></div>' : '') +
        (t.observacoes ? '<div class="d-section"><h3>Observações</h3><div class="obs-box" title="' + esc(t.observacoes) + '">' + esc(t.observacoes) + '</div></div>' : '') +
      '</div>' +
      '<div class="d-right"><div class="d-right-head"><h3>Checklist</h3>' +
        '<div class="seg">' + abas.map(([k, l, x]) => '<button data-fasetab="' + k + '" class="' + (S.fase === k ? 'on' : '') + '">' + l + ' <small style="color:var(--ink-3)">' + x.filter(concluida).length + '/' + x.length + '</small></button>').join('') + '</div>' +
        '<label class="switch"><input type="checkbox" id="chkPend"' + (S.soPendentes ? ' checked' : '') + '><span></span>Só em aberto</label>' +
        pager('d-steps') + '</div>' +
        caixa('d-steps', steps || '<div class="empty">' + (es.length ? 'Nada em aberto aqui. ✓' : 'Esta turma não tem aba operacional vinculada.') + '</div>') +
      '</div></div>';

    $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false');
    $('#drawerBg').classList.add('open');
    paginarTudo($('#drawer'));
  }

  function fecharDrawer() {
    S.drawer = null;
    $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true');
    $('#drawerBg').classList.remove('open');
  }

  const dk = (l, v) => '<div class="d-kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';

  /* ================================================================ */
  /* Componentes                                                       */
  /* ================================================================ */

  const pillSit = k => '<span class="pill ' + k + '">' + SIT[k].label + '</span>';
  function barra(st) {
    const t = st.total || 1;
    return '<div class="bar" style="flex:1"><i class="f" style="width:' + (st.feito / t * 100) + '%"></i><i class="e" style="width:' + ((st.exec || 0) / t * 100) + '%"></i></div>';
  }

  function seletor(e) {
    const ops = S.dados.statusEtapa || ['Pendente', 'Em execução', 'Feito', 'Não se aplica'];
    return '<select class="st-select ' + stClass(e.status) + '" data-etapa="' + e.id + '"' + (S.dados.podeEditar ? '' : ' disabled') + '>' +
      ops.concat(ops.indexOf(e.status) < 0 ? [e.status] : []).map(o => '<option' + (o === e.status ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  }

  function anel(pct, tam) {
    const r = tam / 2 - 5, c = 2 * Math.PI * r, m = tam / 2;
    return '<svg class="ring" width="' + tam + '" height="' + tam + '" viewBox="0 0 ' + tam + ' ' + tam + '">' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--surface-3)" stroke-width="6"/>' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--s-enc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100) + ' ' + c + '" transform="rotate(-90 ' + m + ' ' + m + ')"/></svg>';
  }

  function rosca(seg, tam) {
    const total = soma(seg, s => s.v) || 1, r = tam / 2 - 11, c = 2 * Math.PI * r, m = tam / 2;
    let acc = 0;
    const arcos = seg.filter(s => s.v).map(s => {
      const len = s.v / total * c;
      const el = '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:' + s.cor + '" stroke-width="16" stroke-dasharray="' + Math.max(0, len - 1.5) + ' ' + c + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 ' + m + ' ' + m + ')" data-tip="<b>' + s.l + '</b>' + s.v + ' (' + Math.round(s.v / total * 100) + '%)"/>';
      acc += len; return el;
    }).join('');
    const ok = seg[0].v + seg[4].v;
    return '<svg width="' + tam + '" height="' + tam + '" style="flex:none">' + arcos +
      '<text x="50%" y="49%" text-anchor="middle" style="font:600 21px Fraunces,serif;fill:var(--ink)">' + Math.round(ok / total * 100) + '%</text>' +
      '<text x="50%" y="63%" text-anchor="middle" style="font:500 10.5px Inter,sans-serif;fill:var(--ink-3)">concluído</text></svg>';
  }

  /* ================================================================ */
  /* Ações                                                             */
  /* ================================================================ */

  function mudarStatus(id, novo, el) {
    const e = S.idx[id];
    if (!e || e.status === novo) return;
    const anterior = e.status, conclAnterior = e.conclusao;
    e.status = novo;
    if (novo === 'Feito' && !e.conclusao) e.conclusao = S.dados.hoje;
    recalcular();
    if (!RUN) {
      toast('Demonstração: “' + e.etapa + '” → ' + novo + ' (não gravado)');
      refrescar();
      return;
    }
    el.classList.add('saving');
    google.script.run
      .withSuccessHandler(r => {
        const o = JSON.parse(r);
        e.conclusao = o.conclusao || e.conclusao;
        toast('✓ ' + e.etapa + ' → ' + novo);
        refrescar();
      })
      .withFailureHandler(err => {
        e.status = anterior; e.conclusao = conclAnterior;
        recalcular();
        toast(err.message || 'Não foi possível gravar', 'err');
        refrescar();
      })
      .atualizarStatusEtapa({
        aba: e.aba, linha: e.linha, colEtapa: e.colEtapa, colStatus: e.colStatus,
        colConclusao: e.colConclusao, etapa: e.etapa, status: novo, turma: e.turma
      });
    refrescar();
  }

  /** Re-renderiza mantendo as páginas atuais. */
  function refrescar() {
    render();
    if (S.drawer) abrirTurma(S.drawer);
  }

  function exportarCsv() {
    let cab, linhas, nome;
    if (S.view === 'etapas') {
      cab = ['Prazo', 'Etapa', 'Fase', 'Status', 'Responsável', 'Turma', 'Curso', 'Documento', 'Observações', 'Aba', 'Linha'];
      linhas = etapasF().map(e => [fmtAno(e.prazo), e.etapa, e.fase, e.status, e.responsavel, e.turma, e.curso, e.documento, e.observacoes, e.aba, e.linha]);
      nome = 'etapas';
    } else {
      cab = ['Turma', 'Curso', 'Área', 'Local', 'Início', 'Término', 'Situação', 'Etapas', 'Concluídas', 'Em execução', 'Pendentes', 'Vencidas', '% Conclusão', 'Formados'];
      linhas = turmasF().map(t => [t.turma, t.curso, t.area, t.local, fmtAno(t.inicio), fmtAno(t.fim), SIT[t.sit].label, t.st.total, t.st.feito, t.st.exec, t.st.pend, t.st.venc, Math.round(t.st.pct), t.formados == null ? '' : t.formados]);
      nome = 'turmas';
    }
    const csv = '\ufeff' + [cab].concat(linhas).map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = nome + '_' + S.dados.hoje + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function toast(msg, tipo) {
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), tipo === 'err' ? 6000 : 3000);
  }

  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('painel-tema', t); } catch (e) { /* sem storage */ }
  }

  function filtrosMudaram() { S.pg = {}; marcarFiltros(); render(); }

  /* ================================================================ */
  /* Eventos                                                           */
  /* ================================================================ */

  document.addEventListener('click', ev => {
    const el = ev.target;
    if (el.closest('select, input, label.switch')) return;

    const pg = el.closest('[data-pg]');
    if (pg) return virar(pg.dataset.key, Number(pg.dataset.pg));

    const nav = el.closest('#nav button'); if (nav) return irPara(nav.dataset.view);
    if (el.closest('[data-fechar]') || el.id === 'drawerBg') return fecharDrawer();

    const seg = el.closest('[data-seg] button');
    if (seg) { S[seg.parentNode.dataset.seg] = seg.dataset.val; return render(); }

    const ft = el.closest('[data-fasetab]');
    if (ft) { S.fase = ft.dataset.fasetab; S.pg['d-steps'] = 0; return abrirTurma(S.drawer); }

    const th = el.closest('[data-sort]');
    if (th) { const k = th.dataset.sort; S.tbl = { chave: k, asc: S.tbl.chave === k ? !S.tbl.asc : true }; S.pg['etapas-tabela'] = 0; return render(); }

    const resp = el.closest('[data-resp]');
    if (resp) { S.f.resp = resp.dataset.resp === '(sem responsável)' ? '' : resp.dataset.resp; montarFiltros(); S.pg = {}; return irPara('etapas'); }

    const turma = el.closest('[data-turma]');
    if (turma) { ev.preventDefault(); return abrirTurma(turma.dataset.turma); }

    const go = el.closest('[data-goto]');
    if (go) return irPara(go.dataset.goto);
  });

  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.matches('select[data-etapa]')) return mudarStatus(el.dataset.etapa, el.value, el);
    if (el.id === 'ordTurmas') { S.turmasOrdem = el.value; S.pg = {}; return render(); }
    if (el.id === 'chkConcl') { S.etapasConcluidas = el.checked; S.pg = {}; return render(); }
    if (el.id === 'chkPend') { S.soPendentes = el.checked; S.pg['d-steps'] = 0; return abrirTurma(S.drawer); }
    const mapa = { fArea: 'area', fCurso: 'curso', fSituacao: 'situacao', fResp: 'resp' };
    if (mapa[el.id]) { S.f[mapa[el.id]] = el.value; return filtrosMudaram(); }
    if (el.id === 'fCanceladas') { S.f.canceladas = el.checked; return filtrosMudaram(); }
  });

  let tBusca;
  $('#search').addEventListener('input', ev => {
    clearTimeout(tBusca);
    tBusca = setTimeout(() => { S.f.busca = ev.target.value; filtrosMudaram(); }, 180);
  });
  $('#btnLimpar').addEventListener('click', () => {
    S.f = { area: '', curso: '', situacao: '', resp: '', busca: '', canceladas: false };
    $('#search').value = '';
    montarFiltros(); filtrosMudaram();
  });
  $('#btnRefresh').addEventListener('click', () => carregar(true));
  $('#btnCsv').addEventListener('click', exportarCsv);
  $('#btnTheme').addEventListener('click', () => aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  $('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $$('#nav button').forEach(b => { b.title = b.textContent.trim(); });

  // Roda do mouse sobre uma caixa paginada = virar página.
  let ultimaRoda = 0;
  document.addEventListener('wheel', ev => {
    const box = ev.target.closest('.fit');
    if (!box || !box._paginas || box._paginas.length < 2) return;
    ev.preventDefault();
    const agora = Date.now();
    if (agora - ultimaRoda < 350 || Math.abs(ev.deltaY) < 4) return;
    ultimaRoda = agora;
    virar(box.dataset.key, ev.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  document.addEventListener('keydown', ev => {
    const digitando = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (ev.key === 'Escape') { if (S.drawer) fecharDrawer(); else if (digitando) document.activeElement.blur(); }
    if (digitando) return;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
      const raiz = S.drawer ? $('#drawer') : $('#view');
      $$('.fit', raiz).forEach(b => virar(b.dataset.key, ev.key === 'ArrowRight' ? 1 : -1));
      return;
    }
    if (ev.key === '/') { ev.preventDefault(); $('#search').focus(); }
    if (ev.key === 'r' || ev.key === 'R') carregar(true);
    const atalhos = { 1: 'geral', 2: 'cronograma', 3: 'turmas', 4: 'etapas', 5: 'formandos', 6: 'regras' };
    if (atalhos[ev.key]) irPara(atalhos[ev.key]);
  });

  // Recalcula as páginas quando a janela muda de tamanho.
  let tResize;
  window.addEventListener('resize', () => {
    clearTimeout(tResize);
    tResize = setTimeout(() => { paginarTudo($('#view')); if (S.drawer) paginarTudo($('#drawer')); }, 150);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paginarTudo($('#view')); });

  // Tooltip
  const tip = $('#tooltip');
  document.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-tip]');
    if (!el) { tip.classList.remove('show'); return; }
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('show');
  });
  document.addEventListener('mousemove', ev => {
    if (!tip.classList.contains('show')) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - w - 10) + 'px';
    tip.style.top = (ev.clientY + 16 + h > window.innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + 'px';
  });

  /* ================================================================ */
  /* Início                                                            */
  /* ================================================================ */

  let temaSalvo = null;
  try { temaSalvo = localStorage.getItem('painel-tema'); } catch (e) { /* sem storage */ }
  aplicarTema(temaSalvo || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  carregar(false);
  setInterval(atualizarSync, 30000);

  // Modo painel de TV: cartões da visão geral avançam sozinhos (pausa com o mouse em cima).
  setInterval(() => {
    if (document.hidden || S.drawer || S.view !== 'geral') return;
    $$('.fit[data-auto]').forEach(b => { if (!b.matches(':hover')) virar(b.dataset.key, 1); });
  }, ROTACAO_MS);

  // Recarrega a cada 5 min (usa o cache do servidor), sem atrapalhar quem está editando.
  setInterval(() => {
    if (!document.hidden && !S.drawer && !/INPUT|SELECT/.test(document.activeElement.tagName)) carregar(false);
  }, 300000);
})();
</script>
