<script>
(function () {
  'use strict';

  /* ================================================================ */
  /* Estado e utilitários                                              */
  /* ================================================================ */

  const RUN = typeof google !== 'undefined' && google.script && google.script.run;
  const DIA = 86400000;
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SIT = {
    plan: { label: 'Planejamento', cor: 'var(--s-plan)' },
    exec: { label: 'Em execução',  cor: 'var(--s-exec)' },
    enc:  { label: 'Encerrado',    cor: 'var(--s-enc)' },
    canc: { label: 'Cancelado',    cor: 'var(--s-canc)' }
  };
  const VIEWS = {
    geral:      ['Visão geral', 'Panorama das turmas e pendências'],
    cronograma: ['Cronograma', 'Calendário de treinamentos do ano, mês a mês'],
    turmas:     ['Turmas', 'Situação, progresso e matriz de decisão de cada turma'],
    etapas:     ['Etapas', 'Pendências por prazo — altere o status direto aqui'],
    formandos:  ['Formandos', 'Militares formados no ano'],
    regras:     ['Regras e prazos', 'Parâmetros normativos e internos da AET/CPE']
  };
  const ROTACAO_MS = 12000; // troca automática de página nos cartões da visão geral

  const S = {
    dados: null, idx: {}, turmaIdx: {},
    view: 'geral',
    f: { unidade: '', curso: '', situacao: '', resp: '', busca: '', canceladas: false },
    turmasModo: 'cards', turmasOrdem: 'inicio',
    etapasModo: 'quadro', etapasConcluidas: false,
    tbl: { chave: 'prazo', asc: true },
    drawer: null, soPendentes: false, fase: 'TODAS',
    calMes: 0,        // deslocamento do calendário da visão geral (0 = mês inicial)
    ano: null,        // ano exibido (null = planilha principal)
    form: null,       // formulário aberto no painel lateral: 'nova' | 'ano'
    critTodas: false, // mostrar etapas de durante/depois na lista de prazos
    fasesEtapas: { ANTES: true, DURANTE: false, DEPOIS: false }, // fases visíveis na tela Etapas
    edit: null,       // formulário aberto: { tipo: 'turma' | 'cancelar' | 'etapa', id, campos }
    salvando: false,
    pg: {} // página atual de cada caixa paginada
  };
  let HOJE = hojeLocal();

  const $ = s => document.querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const pad = n => String(n).padStart(2, '0');
  const soma = (arr, fn) => arr.reduce((a, x) => a + (fn ? fn(x) : x), 0);
  const modoFit = () => window.matchMedia('(min-width: 861px)').matches;

  /** Ano dos dados exibidos e mês inicial do calendário (o mês atual, ou o 1º mês com turmas). */
  function anoRef() { return (S.dados && S.dados.ano) || HOJE.getFullYear(); }
  function mesBase() {
    if (anoRef() === HOJE.getFullYear()) return HOJE.getMonth();
    const ini = (S.dados.turmas || []).map(t => t.inicio).filter(x => x && x.slice(0, 4) === String(anoRef())).sort()[0];
    return ini ? Number(ini.slice(5, 7)) - 1 : 0;
  }

  function hojeLocal() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function dt(s) { if (!s) return null; const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmt(s) { const d = dt(s); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) : '—'; }
  function fmtAno(s) { const d = dt(s); return d ? fmt(s) + '/' + d.getFullYear() : '—'; }
  function dias(s) { const d = dt(s); return d ? Math.round((d - HOJE) / DIA) : null; }
  function sitKey(s) {
    const n = norm(s);
    if (/cancel/.test(n)) return 'canc';
    if (/execu|andamento/.test(n)) return 'exec';
    if (/encerr|conclu/.test(n)) return 'enc';
    return 'plan';
  }
  const concluida = e => e.status === 'Feito' || e.status === 'Não se aplica';
  const stClass = s => 'st-' + norm(s).replace(/\s+/g, '-').replace(/^./, c => c.toUpperCase());
  const titulo = s => String(s).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()).replace(/\bDe\b/g, 'de');
  const curto = s => String(s).replace(/^Credenciamento para Uso Operacional de /, 'Cred. ').replace(/^Curso de Credenciamento para o /, 'Cred. ').replace(/Estágio Tático Rodoviário/, 'ETR');

  function relativo(n) {
    if (n === null) return 'sem prazo';
    if (n === 0) return 'hoje';
    if (n === 1) return 'amanhã';
    if (n === -1) return 'ontem';
    return n > 0 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
  }
  function badgeDias(e) {
    if (concluida(e)) return '<span class="days">' + (e.conclusao ? '✓ ' + fmt(e.conclusao) : '✓') + '</span>';
    const n = dias(e.prazo);
    if (n === null) return '<span class="days">—</span>';
    const cls = n < 0 ? 'late' : n <= 7 ? 'soon' : '';
    const txt = n < 0 ? (-n) + 'd atraso' : n === 0 ? 'hoje' : n + 'd';
    return '<span class="days ' + cls + '" data-tip="<b>Prazo ' + fmtAno(e.prazo) + '</b>' + relativo(n) + '">' + txt + '</span>';
  }

  /* ================================================================ */
  /* Paginação: nada rola — o que não cabe vira página                 */
  /* ================================================================ */

  /** Caixa paginada; o controle ‹ 1/3 › é desenhado em .pager[data-for=key]. */
  const caixa = (key, html, cls, auto) =>
    '<div class="fit ' + (cls || '') + '" data-key="' + key + '"' + (auto ? ' data-auto' : '') + '>' + html + '</div>';
  const pager = key => '<div class="pager" data-for="' + key + '"></div>';

  function paginarTudo(raiz) {
    $$('.fit', raiz).forEach(paginar);
  }

  function paginar(box) {
    const key = box.dataset.key;
    const itens = Array.from(box.children);
    itens.forEach(el => { el.style.display = ''; });
    box._paginas = null;
    if (!modoFit() || !itens.length) { desenharPager(box); return; }

    const H = box.clientHeight;
    const paginas = [[]];
    let base = itens[0].offsetTop;
    itens.forEach(el => {
      const topo = el.offsetTop, fundo = topo + el.offsetHeight;
      if (fundo - base > H + 1 && paginas[paginas.length - 1].length) { paginas.push([]); base = topo; }
      paginas[paginas.length - 1].push(el);
    });
    // Um título de grupo (.grp) nunca fica sozinho no fim da página.
    for (let i = 0; i < paginas.length - 1; i++) {
      const pg = paginas[i];
      while (pg.length > 1 && pg[pg.length - 1].classList.contains('grp')) paginas[i + 1].unshift(pg.pop());
    }
    box._paginas = paginas;
    S.pg[key] = Math.min(S.pg[key] || 0, paginas.length - 1);
    const editando = box.querySelector('.editing');
    if (editando) S.pg[key] = Math.max(0, paginas.findIndex(pg => pg.indexOf(editando) >= 0));
    mostrarPagina(box);
  }

  function mostrarPagina(box) {
    const p = S.pg[box.dataset.key] || 0;
    box._paginas.forEach((pg, i) => pg.forEach(el => { el.style.display = i === p ? '' : 'none'; }));
    box.classList.remove('page-in'); void box.offsetWidth; box.classList.add('page-in');
    desenharPager(box);
  }

  function desenharPager(box) {
    const key = box.dataset.key;
    const alvo = document.querySelector('.pager[data-for="' + key + '"]');
    if (!alvo) return;
    const n = box._paginas ? box._paginas.length : 1;
    if (n < 2) { alvo.innerHTML = ''; return; }
    const p = S.pg[key] || 0;
    alvo.innerHTML = '<button data-pg="-1" data-key="' + key + '" title="Página anterior">‹</button>' +
      (n <= 5 ? '<span class="dots">' + Array.from({ length: n }, (_, i) => '<i class="' + (i === p ? 'on' : '') + '"></i>').join('') + '</span>' : '') +
      '<span>' + (p + 1) + '/' + n + '</span>' +
      '<button data-pg="1" data-key="' + key + '" title="Próxima página">›</button>';
  }

  function virar(key, delta) {
    const box = document.querySelector('.fit[data-key="' + key + '"]');
    if (!box || !box._paginas || box._paginas.length < 2) return;
    const n = box._paginas.length;
    S.pg[key] = ((S.pg[key] || 0) + delta + n) % n;
    mostrarPagina(box);
  }

  /* ================================================================ */
  /* Carga de dados                                                    */
  /* ================================================================ */

  function carregar(forcar) {
    $('#syncInfo').textContent = 'Sincronizando…';
    if (RUN) {
      google.script.run
        .withSuccessHandler(j => iniciar(JSON.parse(j)))
        .withFailureHandler(falhaCarga)
        .getDadosPainel(!!forcar, S.ano);
    } else if (window.__DADOS_DEMO__) {
      setTimeout(() => iniciar(JSON.parse(JSON.stringify(window.__DADOS_DEMO__))), 150);
    } else {
      falhaCarga({ message: 'Abra este painel pelo Apps Script (implantação como app da Web).' });
    }
  }

  function falhaCarga(err) {
    $('#syncInfo').textContent = 'Falha ao sincronizar';
    if (!S.dados) $('#view').innerHTML = '<div class="card empty">Não foi possível ler a planilha.<br><small>' + esc(err && err.message) + '</small></div>';
    toast(err && err.message || 'Erro ao carregar', 'err');
  }

  function iniciar(d) {
    S.dados = d;
    if (d.hoje) HOJE = dt(d.hoje);
    S.idx = {}; S.turmaIdx = {};
    d.turmas.forEach(t => { t.sit = sitKey(t.situacao); S.turmaIdx[t.id] = t; });
    d.etapas.forEach(e => { S.idx[e.id] = e; });
    prepararNomes();
    recalcular();
    montarFiltros();
    $('#brandSub').textContent = 'AET/CPE · ' + anoRef();
    S.ano = anoRef();
    montarSeletorAno();
    $('#sheetLink').href = d.url || '#';
    const av = d.avisos || [];
    const chip = $('#avisos');
    chip.classList.toggle('on', av.length > 0);
    chip.textContent = '⚠ ' + av.length + (av.length > 1 ? ' avisos' : ' aviso');
    chip.setAttribute('data-tip', '<b>Avisos da leitura</b>' + av.map(esc).join('<br><br>'));
    atualizarSync();
    render();
    if (S.drawer) abrirTurma(S.drawer);
  }

  /**
   * Nomes de exibição: o painel ignora o nome da turma na planilha e mostra
   * o curso do SiGE + a cidade (ou "2ª turma" quando não há cidade).
   * O nome da planilha (t.turma) continua sendo usado só para gravar.
   */
  function prepararNomes() {
    const g = {};
    S.dados.turmas.forEach(t => { (g[nomeCurso(t)] = g[nomeCurso(t)] || []).push(t); });
    Object.keys(g).forEach(k => g[k].sort((a, b) => String(a.inicio).localeCompare(String(b.inicio)))
      .forEach((t, i, arr) => { t.onde = t.cidade || (arr.length > 1 ? (i + 1) + 'ª turma' : ''); }));
  }
  const nomeLongo = t => t ? nomeCurso(t) + (t.onde ? ' — ' + t.onde : '') : '';
  const nomeCurto = t => t ? cursoCurto(nomeCurso(t)) + (t.onde ? ' · ' + t.onde : '') : '';
  const nomeDaEtapa = e => nomeCurto(S.turmaIdx[e.turmaId]) || curto(e.turma);

  /** Estatísticas por turma, recalculadas sempre que um status muda. */
  function recalcular() {
    const d = S.dados;
    d.turmas.forEach(t => { t.st = { total: 0, feito: 0, exec: 0, pend: 0, venc: 0, semana: 0, antesTot: 0, antesFeito: 0, vencAntes: 0 }; });
    d.etapas.forEach(e => {
      const t = S.turmaIdx[e.turmaId]; if (!t) return;
      const st = t.st; st.total++;
      if (e.fase === 'ANTES') st.antesTot++;
      if (concluida(e)) { st.feito++; if (e.fase === 'ANTES') st.antesFeito++; return; }
      if (e.status === 'Em execução') st.exec++; else st.pend++;
      const n = dias(e.prazo);
      if (n !== null && n < 0) { st.venc++; if (e.fase === 'ANTES') st.vencAntes++; }
      else if (n !== null && n <= 7) st.semana++;
    });
    d.turmas.forEach(t => { t.st.pct = t.st.total ? t.st.feito / t.st.total * 100 : 0; });
    const venc = d.etapas.filter(e => S.turmaIdx[e.turmaId] && S.turmaIdx[e.turmaId].sit !== 'canc' && e.fase === 'ANTES' && !concluida(e) && dias(e.prazo) < 0).length;
    $('#navBadge').textContent = venc || '';
  }

  function atualizarSync() {
    if (!S.dados) return;
    const min = Math.max(0, Math.round((Date.now() - new Date(S.dados.geradoEm)) / 60000));
    $('#syncInfo').textContent = 'Atualizado ' + (min < 1 ? 'agora' : 'há ' + min + ' min') + (RUN ? '' : ' · demonstração');
  }

  /* ================================================================ */
  /* Filtros                                                           */
  /* ================================================================ */

  function montarFiltros() {
    const d = S.dados;
    const uniq = arr => Array.from(new Set(arr.filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    preencher('#fUnidade', unidadesLista().map(v => [v, v]), 'Todas as unidades', S.f.unidade);
    preencher('#fCurso', uniq(d.turmas.map(nomeCurso)).map(v => [v, cursoCurto(v)]), 'Todos os cursos', S.f.curso);
    preencher('#fSituacao', Object.keys(SIT).filter(k => d.turmas.some(t => t.sit === k)).map(k => [k, SIT[k].label]), 'Todas as situações', S.f.situacao);
    preencher('#fResp', uniq(d.etapas.map(e => e.responsavel)).map(v => [v, v]), 'Todos os responsáveis', S.f.resp);
    $('#fCanceladas').checked = S.f.canceladas;
    marcarFiltros();
  }
  function preencher(sel, ops, rotulo, atual) {
    $(sel).innerHTML = '<option value="">' + rotulo + '</option>' +
      ops.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === atual ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
  }
  function marcarFiltros() {
    [['#fUnidade', 'unidade'], ['#fCurso', 'curso'], ['#fSituacao', 'situacao'], ['#fResp', 'resp']]
      .forEach(([s, k]) => $(s).classList.toggle('on', !!S.f[k]));
  }

  /** Unidades executoras (ordem fixa da configuração + alguma outra digitada na planilha). */
  function unidadesLista() {
    const base = (S.dados.unidades || ['BPMRv', 'BPM MAmb', 'BPGd']).slice();
    S.dados.turmas.forEach(t => { if (t.unidade && base.indexOf(t.unidade) < 0) base.push(t.unidade); });
    return base;
  }
  /** Nome do curso como está no SiGE (sem o ano da matriz), ou o curso da planilha. */
  function nomeCurso(t) { return (t && (t.cursoOficial || t.curso)) || ''; }
  /** Rótulo curto: a sigla ("… - GEPAM", "… (PP)") ou o nome sem "Curso de". */
  const SIGLAS = [[/identifica[cç][aã]o veicular/i, 'IVD'], [/radiopatrulhamento/i, 'CRTR'], [/^curso de policiamento rodovi/i, 'CEPTR'],
    [/est[aá]gio t[aá]tico/i, 'ETR'], [/^curso de pilotagem/i, 'CPP'], [/velado/i, 'Velado'], [/alta energia/i, 'Armas AE'],
    [/policiamento de meio ambiente/i, 'Meio Ambiente'], [/guardas/i, 'Guardas']];
  function cursoCurto(nome) {
    const sg = SIGLAS.find(x => x[0].test(nome));
    if (sg) return sg[1];
    const m = String(nome).match(/\(([A-Z0-9]{2,})\)\s*$/) || String(nome).match(/\s-\s([A-Z0-9]{2,})\s*$/);
    if (m) return m[1];
    return String(nome).replace(/^(Curso de |Curso )/i, '');
  }
  /** Cursos da Resolução de um ano, agrupados como no painel (EPP junta 3 cursos do SiGE). */
  function resolucaoDoAno(ano) {
    const g = {};
    (S.dados.resolucao || []).filter(r => r.ano === ano).forEach(r => {
      const x = g[r.grupo] = g[r.grupo] || { grupo: r.grupo, unidade: r.unidade, turmas: 0, alunos: 0, cursos: [], ids: [], status: r.status };
      x.turmas = Math.max(x.turmas, r.turmas); x.alunos = Math.max(x.alunos, r.alunos);
      x.cursos.push(r.curso); x.ids.push(r.id);
    });
    return Object.keys(g).map(k => g[k]).sort((a, b) => a.grupo.localeCompare(b.grupo, 'pt-BR'));
  }
  function estimativaPorTurma(r) { return r && r.turmas ? Math.round(r.alunos / r.turmas) : null; }
  function cursosOficiais() {
    const set = new Set((S.dados.resolucao || []).map(r => r.grupo));
    S.dados.turmas.forEach(t => { if (t.cursoOficial) set.add(t.cursoOficial); });
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  }
  /** Turma ligada a uma linha da aba Formandos (por curso + nome/cidade da turma). */
  function turmaDoFormando(x) {
    if (x._t !== undefined) return x._t;
    const nt = norm(x.turma), nl = norm(x.local);
    const unidadeLike = /^(bpm|cpe|bpgd|meio ambiente|interior)/;
    let melhor = null, pts = 0;
    S.dados.turmas.forEach(t => {
      const nome = norm(t.turma);
      let p = norm(t.curso) === norm(x.curso) ? 2 : 0;
      if (nt && (nome === nt || nome.indexOf(nt) >= 0)) p += 3;
      if (nl && !unidadeLike.test(nl) && (nome.indexOf(nl) >= 0 || norm(t.cidade) === nl)) p += 2;
      if (p > pts) { pts = p; melhor = t; }
    });
    x._t = pts >= 3 ? melhor : null;
    return x._t;
  }
  function cursoDoFormando(x) {
    const t = turmaDoFormando(x);
    if (t) return nomeCurso(t);
    const t2 = S.dados.turmas.find(y => norm(y.curso) === norm(x.curso));
    return t2 ? nomeCurso(t2) : x.curso;
  }

  /** Unidade de um curso da aba Formandos: a da turma desse curso ou, sem turma, pela regra padrão. */
  function unidadeDoCurso(curso) {
    const t = S.dados.turmas.find(x => norm(x.curso) === norm(curso) || norm(nomeCurso(x)) === norm(curso));
    if (t && t.unidade) return t.unidade;
    const n = norm(curso);
    return /meio ambiente|ambiental|gepam|progea/.test(n) ? 'BPM MAmb' : /guarda/.test(n) ? 'BPGd' : 'BPMRv';
  }

  function turmaPassa(t, comBusca) {
    const f = S.f;
    if (!f.canceladas && t.sit === 'canc' && f.situacao !== 'canc') return false;
    if (f.unidade && t.unidade !== f.unidade) return false;
    if (f.curso && nomeCurso(t) !== f.curso) return false;
    if (f.situacao && t.sit !== f.situacao) return false;
    if (comBusca && f.busca && norm([t.turma, t.curso, nomeCurso(t), t.cidade, t.local, t.area].join(' ')).indexOf(norm(f.busca)) < 0) return false;
    return true;
  }
  const turmasF = (comBusca = true) => S.dados.turmas.filter(t => turmaPassa(t, comBusca));
  function etapasF(comBusca = true) {
    const ok = {};
    turmasF(false).forEach(t => { ok[t.id] = true; });
    const b = norm(S.f.busca);
    return S.dados.etapas.filter(e => ok[e.turmaId] &&
      (!S.f.resp || e.responsavel === S.f.resp) &&
      (!comBusca || !b || norm([e.etapa, e.turma, nomeLongo(S.turmaIdx[e.turmaId]), e.responsavel, e.documento, e.fase].join(' ')).indexOf(b) >= 0));
  }
  function formandosF() {
    let f = S.dados.formandos || [];
    if (S.f.unidade) f = f.filter(x => { const t = turmaDoFormando(x); return (t ? t.unidade : unidadeDoCurso(x.curso)) === S.f.unidade; });
    return S.f.curso ? f.filter(x => cursoDoFormando(x) === S.f.curso) : f;
  }

  /* ================================================================ */
  /* Renderização                                                      */
  /* ================================================================ */

  function render() {
    if (!S.dados) return;
    const v = VIEWS[S.view];
    $('#pageTitle').textContent = v[0];
    $('#pageSub').textContent = v[1];
    $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === S.view));
    const fn = { geral: vGeral, cronograma: vCronograma, turmas: vTurmas, etapas: vEtapas, formandos: vFormandos, regras: vRegras }[S.view];
    $('#view').innerHTML = '<div class="vroot fade-in">' + fn() + '</div>';
    paginarTudo($('#view'));
  }

  function irPara(view) {
    S.view = view;
    $('#sidebar').classList.remove('open');
    render();
  }

  /** Cartão com cabeçalho fixo e corpo paginado. */
  function painel(o) {
    return '<div class="card panel ' + (o.cls || '') + '" style="' + (o.style || '') + '">' +
      '<div class="card-head"><h2>' + o.titulo + '</h2><span class="meta">' + (o.meta || '') + '</span>' + pager(o.key) + '</div>' +
      (o.antes || '') + caixa(o.key, o.html, o.fitCls, o.auto) + (o.depois || '') + '</div>';
  }

  /* ---------- Visão geral ---------- */

  const ehAntes = e => e.fase === 'ANTES';
  const MES_LONGO = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const CORES = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];

  function vGeral() {
    const ts = turmasF();
    const ids = {}; ts.forEach(t => { ids[t.id] = 1; });
    const es = etapasF(false).filter(e => ids[e.turmaId]);
    const abertas = es.filter(e => !concluida(e));
    const antesAbertas = abertas.filter(ehAntes);
    const venc = antesAbertas.filter(e => dias(e.prazo) < 0);
    const semana = antesAbertas.filter(e => { const n = dias(e.prazo); return n !== null && n >= 0 && n <= 7; });
    const pct = es.length ? (es.length - abertas.length) / es.length * 100 : 0;
    const cont = k => ts.filter(t => t.sit === k).length;
    const proxima = ts.filter(t => dias(t.inicio) > 0).sort((a, b) => a.inicio.localeCompare(b.inicio))[0];

    const kpis = [
      kpi('Turmas', ts.length, '', [cont('plan') + ' planej.', cont('exec') + ' em exec.', cont('enc') + ' encerr.'].join(' · '), 'turmas'),
      kpi('Etapas concluídas', Math.round(pct), '%', (es.length - abertas.length) + ' de ' + es.length, 'etapas', '', anel(pct, 42)),
      kpi('Etapas vencidas', venc.length, '', 'em ' + new Set(venc.map(e => e.turmaId)).size + ' turma(s)', 'etapas', venc.length ? 'danger' : ''),
      kpi('Vencem em 7 dias', semana.length, '', semana.length ? 'próximo prazo: ' + fmt(semana.map(e => e.prazo).sort()[0]) : 'nada na semana', 'etapas', semana.length ? 'warn' : ''),
      kpi('Formados', soma(formandosF(), x => x.formados), '', 'militares em ' + anoRef(), 'formandos'),
      proxima ? kpi('Próxima turma', dias(proxima.inicio), 'dias', esc(nomeCurto(proxima)), null, '', '', proxima.id)
              : kpi('Próxima turma', '—', '', 'nenhuma prevista')
    ].join('');

    return '<div class="grid g-kpi">' + kpis + '</div>' +
      '<div class="geral-main">' + cardProximas(ts) + cardCalendario(ts, es) + cardPrazos(ts, abertas) +
      cardTreinamentosMes() + cardFormadosUnidade() + '</div>';
  }

  function kpi(label, valor, unid, foot, ir, cls, extra, turmaId) {
    const attr = ir ? ' data-goto="' + ir + '"' : turmaId ? ' data-turma="' + turmaId + '"' : '';
    return '<div class="card kpi ' + (cls || '') + (attr ? ' click' : '') + '"' + attr + '>' + (extra || '') +
      '<div class="label">' + label + '</div>' +
      '<div class="value">' + valor + (unid ? '<small>' + unid + '</small>' : '') + '</div>' +
      '<div class="foot">' + foot + '</div></div>';
  }

  /** Bloco de data grande (dia + mês), usado nas listas da visão geral. */
  function blocoData(iso, cls, rodape) {
    const d = dt(iso);
    return '<div class="dbloco ' + (cls || '') + '">' + (d
      ? '<b>' + pad(d.getDate()) + '</b><span>' + MESES[d.getMonth()] + '</span>'
      : '<b>—</b><span>s/ data</span>') + (rodape ? '<i>' + rodape + '</i>' : '') + '</div>';
  }

  function cardProximas(ts) {
    const exec = ts.filter(t => t.sit === 'exec').sort((a, b) => String(a.fim).localeCompare(String(b.fim)));
    const prox = ts.filter(t => t.sit === 'plan' && dias(t.inicio) >= 0).sort((a, b) => a.inicio.localeCompare(b.inicio));
    const item = t => {
      const emExec = t.sit === 'exec';
      const n = emExec ? dias(t.fim) : dias(t.inicio);
      const quando = emExec ? (n === 0 ? 'termina hoje' : 'termina ' + relativo(n)) : (n === 0 ? 'começa hoje' : 'começa ' + relativo(n));
      const a = t.st;
      const pctA = a.antesTot ? a.antesFeito / a.antesTot * 100 : 0;
      return '<div class="prox ' + (emExec ? 'exec' : '') + '" data-turma="' + t.id + '">' +
        blocoData(t.inicio, emExec ? 'exec' : n <= 15 ? 'soon' : '', emExec ? 'agora' : n + 'd') +
        '<div class="prox-c"><div class="prox-t" title="' + esc(nomeLongo(t)) + '">' + esc(nomeCurso(t)) + '</div>' +
        '<div class="prox-s">' + (t.onde ? '<b>' + esc(t.onde) + '</b> · ' : '') + fmt(t.inicio) + ' a ' + fmt(t.fim) + ' · <b>' + quando + '</b></div>' +
        '<div class="prox-a"><span class="sublabel">Etapas</span>' +
        '<div class="bar" style="flex:1"><i class="f" style="width:' + pctA + '%"></i></div>' +
        '<span class="pct">' + a.antesFeito + '/' + a.antesTot + '</span>' +
        (a.vencAntes ? '<span class="alerta">⚠ ' + a.vencAntes + ' vencida' + (a.vencAntes > 1 ? 's' : '') + '</span>' : '<span class="ok">em dia</span>') +
        '</div></div></div>';
    };
    const html = exec.concat(prox).map(item).join('');
    return painel({
      titulo: 'Próximas turmas', meta: (exec.length ? exec.length + ' em execução · ' : '') + prox.length + ' a iniciar',
      key: 'g-prox', fitCls: 'lista', auto: true, style: 'grid-area:prox',
      html: html || '<div class="empty">Nenhuma turma em execução ou prevista.</div>'
    });
  }

  function cardCalendario(ts, es) {
    const base = new Date(anoRef(), mesBase() + S.calMes, 1);
    const ano = base.getFullYear(), mes = base.getMonth();
    const diasMes = new Date(ano, mes + 1, 0).getDate();
    const semanas = Math.ceil((base.getDay() + diasMes) / 7);
    const hojeIso = S.dados.hoje;
    const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

    // prazos ANTES em aberto, por dia
    const prazos = {};
    es.filter(e => ehAntes(e) && !concluida(e) && e.prazo).forEach(e => { (prazos[e.prazo] = prazos[e.prazo] || []).push(e); });
    const ordenadas = ts.slice().sort((a, b) => String(a.inicio).localeCompare(String(b.inicio)) || a.id.localeCompare(b.id));

    const marcaPrazo = (pz, iso) => pz.length
      ? '<span class="cal-pz ' + (iso < hojeIso ? 'late' : iso <= isoDe(new Date(HOJE.getTime() + 7 * DIA)) ? 'soon' : '') + '" data-tip="<b>' + pz.length + ' prazo(s) de etapa</b>' +
        pz.slice(0, 6).map(e => esc(e.etapa) + ' — ' + esc(nomeDaEtapa(e))).join('<br>') + (pz.length > 6 ? '<br>…' : '') + '">⚑ ' + pz.length + '</span>'
      : '';
    const MAX_FAIXAS = semanas > 5 ? 3 : 4;

    let linhas = '';
    let turmasNoMes = new Set(), prazosNoMes = 0;
    for (let w = 0; w < semanas; w++) {
      const dias7 = [];
      for (let k = 0; k < 7; k++) dias7.push(new Date(ano, mes, 1 - base.getDay() + w * 7 + k));
      const isos = dias7.map(isoDe), ini = isos[0], fim = isos[6];

      // barras da semana: cada turma vira um trecho contínuo, em faixas sem sobreposição
      const trechos = ordenadas.filter(t => t.inicio && t.fim && t.inicio <= fim && t.fim >= ini).map(t => ({
        t: t, a: t.inicio < ini ? 0 : isos.indexOf(t.inicio), b: t.fim > fim ? 6 : isos.indexOf(t.fim)
      })).sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a));
      const faixas = [];
      trechos.forEach(x => {
        let f = faixas.findIndex(fim => fim < x.a);
        if (f < 0) { f = faixas.length; faixas.push(-1); }
        faixas[f] = x.b; x.f = f;
      });
      const nF = Math.min(faixas.length, MAX_FAIXAS);
      const ocultas = [0, 0, 0, 0, 0, 0, 0];
      trechos.filter(x => x.f >= nF).forEach(x => { for (let k = x.a; k <= x.b; k++) ocultas[k]++; });

      let cel = '';
      dias7.forEach((d, k) => {
        const iso = isos[k], fora = d.getMonth() !== mes;
        const pz = prazos[iso] || [];
        if (!fora) {
          prazosNoMes += pz.length;
          trechos.forEach(x => { if (x.a <= k && k <= x.b) turmasNoMes.add(x.t.id); });
        }
        cel += '<div class="cal-d' + (fora ? ' fora' : '') + (iso === hojeIso ? ' hoje' : '') + (d.getDay() === 0 || d.getDay() === 6 ? ' fds' : '') +
          '" style="grid-column:' + (k + 1) + ';grid-row:1 / -1"><div class="cal-n"><span>' + d.getDate() + '</span>' +
          (ocultas[k] ? '<span class="cal-mais">+' + ocultas[k] + '</span>' : '') + marcaPrazo(pz, iso) + '</div></div>';
      });
      const barras = trechos.filter(x => x.f < nF).map(x => {
        const t = x.t, contE = t.inicio < ini, contD = t.fim > fim;
        return '<span class="cal-bar ' + t.sit + (contE ? ' cont-e' : '') + (contD ? ' cont-d' : '') + '" style="grid-column:' + (x.a + 1) + ' / ' + (x.b + 2) + ';grid-row:' + (x.f + 2) +
          '" data-turma="' + t.id + '" data-tip="<b>' + esc(nomeLongo(t)) + '</b>' + esc(t.local) + '<br>' + fmtAno(t.inicio) + ' a ' + fmtAno(t.fim) + '">' +
          '<span>' + (contE ? '‹ ' : '') + esc(x.b - x.a >= 3 ? nomeLongo(t) : nomeCurto(t)) + (contD ? ' ›' : '') + '</span></span>';
      }).join('');
      linhas += '<div class="cal-sem" style="grid-template-rows:var(--cal-n, 22px) repeat(' + nF + ', auto) 1fr">' + cel + barras + '</div>';
    }

    return '<div class="card panel cal-card" style="grid-area:cal">' +
      '<div class="card-head"><h2>' + MES_LONGO[mes] + ' <span class="cal-ano">' + ano + '</span></h2>' +
      '<span class="meta">' + turmasNoMes.size + ' turma(s) · ' + prazosNoMes + ' prazo(s) de etapa</span>' +
      '<div class="pager"><button data-cal="-1" title="Mês anterior">‹</button>' +
      (S.calMes ? '<button data-cal="0" class="cal-hoje" title="Voltar ao mês atual">hoje</button>' : '') +
      '<button data-cal="1" title="Próximo mês">›</button></div></div>' +
      '<div class="cal"><div class="cal-hs">' + ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => '<div class="cal-h">' + x + '</div>').join('') + '</div>' + linhas + '</div>' +
      '<div class="legend" style="margin-top:8px">' + ['plan', 'exec', 'enc'].map(k => '<span><i style="background:' + SIT[k].cor + '"></i>' + SIT[k].label + '</span>').join('') +
      '<span><b style="color:var(--danger)">⚑</b> prazo de etapa</span></div></div>';
  }

  function cardPrazos(ts, abertas) {
    const sit = {}; ts.forEach(t => { sit[t.id] = t.sit; });
    const ordem = (a, b) => String(a.prazo || '9999').localeCompare(String(b.prazo || '9999'));
    const antes = abertas.filter(ehAntes);
    const ativas = antes.filter(e => sit[e.turmaId] !== 'enc').sort(ordem);
    const antigas = antes.filter(e => sit[e.turmaId] === 'enc').sort(ordem);
    const outras = abertas.filter(e => !ehAntes(e)).sort(ordem);
    const vencN = antes.filter(e => dias(e.prazo) < 0).length;

    const linha = (e, apagada) => {
      const n = dias(e.prazo);
      const cls = n === null ? '' : n < 0 ? 'late' : n <= 7 ? 'soon' : '';
      const quando = n === null ? 'sem prazo' : n < 0 ? (-n) + ' dia' + (n < -1 ? 's' : '') + ' de atraso' : n === 0 ? 'vence hoje' : 'vence ' + relativo(n);
      return '<div class="pz' + (apagada ? ' apagada' : '') + '" data-turma="' + e.turmaId + '">' + blocoData(e.prazo, cls) +
        '<div style="min-width:0"><div class="pz-t" title="' + esc(e.etapa) + '">' + esc(e.etapa) + '</div>' +
        '<div class="pz-s">' + seletorResp(e) + '<span><b class="' + cls + '">' + quando + '</b> · ' + esc(nomeDaEtapa(e)) +
        (apagada ? ' · ' + titulo(e.fase) : '') + '</span></div></div>' + seletor(e) + '</div>';
    };
    const divisor = txt => '<div class="pz-div grp">' + txt + '</div>';

    let html = ativas.map(e => linha(e, false)).join('');
    if (antigas.length) html += divisor('Etapas pendentes de turmas já encerradas') + antigas.map(e => linha(e, true)).join('');
    if (S.critTodas && outras.length) html += divisor('Durante e depois do curso') + outras.map(e => linha(e, true)).join('');

    return painel({
      titulo: 'Prazos das etapas', meta: vencN + ' vencida' + (vencN === 1 ? '' : 's') + ' · ' + ativas.length + ' a cumprir',
      key: 'g-prazos', cls: 'flush', style: 'grid-area:prazos',
      html: html || '<div class="empty">Nenhuma etapa em aberto. 🎉</div>',
      depois: outras.length ? '<button class="more" data-toggle-todas>' + (S.critTodas ? 'Ocultar etapas de durante e depois do curso' : 'Mostrar etapas de durante e depois do curso (' + outras.length + ')') + '</button>' : ''
    });
  }

  /**
   * Treinamentos de um mês, no formato do calendário oficial.
   * Fonte: aba "Calendario" (com vagas); se ela não existir, as turmas cadastradas.
   */
  function treinamentosDoMes(ano, m) {
    const ini = ano + '-' + pad(m + 1) + '-01', fim = ano + '-' + pad(m + 1) + '-' + pad(new Date(ano, m + 1, 0).getDate());
    const cal = S.dados.calendario || [];
    const doisDig = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
    if (cal.length) {
      return cal.filter(c => c.ano === ano && c.mes === m).map(c => {
        const t = S.dados.turmas.find(x => x.inicio === c.inicio && x.fim === c.fim) || S.dados.turmas.find(x => x.inicio && x.inicio === c.inicio);
        return { periodo: c.periodo, treinamento: c.treinamento, vagas: c.vagas, local: c.local, turma: t || null, inicio: c.inicio };
      }).filter(x => !x.turma || turmaPassa(x.turma, true) || (!S.f.unidade && !S.f.curso && !S.f.situacao && !S.f.busca));
    }
    return turmasF().filter(t => t.inicio && t.fim && t.inicio <= fim && t.fim >= ini)
      .sort((a, b) => a.inicio.localeCompare(b.inicio))
      .map(t => ({
        periodo: t.inicio.slice(0, 7) === t.fim.slice(0, 7) ? t.inicio.slice(8, 10) + ' a ' + doisDig(t.fim) : doisDig(t.inicio) + ' a ' + doisDig(t.fim),
        treinamento: nomeLongo(t), vagas: '', local: t.local, turma: t, inicio: t.inicio
      }));
  }

  function linhaTreinamento(x, larga) {
    const t = x.turma;
    return '<div class="tr-row' + (larga ? ' larga' : '') + (t ? ' ' + t.sit : '') + '"' + (t ? ' data-turma="' + t.id + '"' : '') +
      ' data-tip="<b>' + esc(x.treinamento) + '</b>' + esc(x.periodo) + (x.vagas ? ' · ' + esc(x.vagas) : '') + (x.local ? '<br>' + esc(x.local) : '') +
      (t ? '<br>' + SIT[t.sit].label + ' · ' + Math.round(t.st.pct) + '% das etapas' : '') + '">' +
      '<span class="tr-p">' + esc(x.periodo) + '</span>' +
      '<span class="tr-t">' + esc(x.treinamento) + (larga ? '' : '<small>' + esc(x.local) + '</small>') + '</span>' +
      '<span class="tr-v">' + esc(x.vagas || '—') + '</span>' +
      (larga ? '<span class="tr-l">' + esc(x.local) + '</span>' : '') + '</div>';
  }

  function cardTreinamentosMes() {
    const base = new Date(anoRef(), mesBase() + S.calMes, 1);
    const lista = treinamentosDoMes(base.getFullYear(), base.getMonth());
    const fonte = (S.dados.calendario || []).length ? 'aba Calendario' : 'turmas cadastradas';
    return '<div class="card panel flush tr-card" style="grid-area:trein">' +
      '<div class="tr-mes">' + MES_LONGO[base.getMonth()].toUpperCase() + ' <span>· ' + lista.length + ' treinamento' + (lista.length === 1 ? '' : 's') + '</span>' + pager('g-trein') + '</div>' +
      '<div class="tr-head"><span>Período</span><span>Treinamento</span><span>Vagas</span></div>' +
      caixa('g-trein', lista.map(x => linhaTreinamento(x, false)).join('') || '<div class="empty">Nenhum treinamento previsto neste mês.</div>') +
      '<div class="tr-fonte">fonte: ' + fonte + '</div></div>';
  }

  function cardFormadosUnidade() {
    const m = {};
    unidadesLista().forEach(u => { m[u] = 0; });
    formandosF().forEach(x => { const k = unidadeDoCurso(x.curso); m[k] = (m[k] || 0) + (x.formados || 0); });
    if (S.f.unidade) Object.keys(m).forEach(k => { if (k !== S.f.unidade) delete m[k]; });
    const arr = Object.keys(m).map(k => [k, m[k]]);
    const total = soma(arr, a => a[1]);
    const seg = arr.map(([k, v], i) => ({ v: v, cor: CORES[i % CORES.length], l: k }));
    return painel({
      titulo: 'Formandos por unidade', meta: total + ' formados', key: 'g-form', fitCls: 'lista', style: 'grid-area:form',
      html: donut(seg, total, 'formados')
    });
  }

  /** Rosca + legenda com valores (usada em Status e Formandos). */
  function donut(seg, centro, sub) {
    const total = soma(seg, s => s.v) || 1;
    return '<div class="donut-wrap">' + rosca(seg, 118, centro, sub) + '<div class="legend">' +
      seg.map(s => '<span data-tip="<b>' + esc(s.l) + '</b>' + s.v + ' (' + Math.round(s.v / total * 100) + '%)"><i style="background:' + s.cor + '"></i>' + esc(s.l) + '<b>' + s.v + '</b></span>').join('') + '</div></div>';
  }

  /* ---------- Cronograma: calendário de treinamentos (modelo oficial) ---------- */

  function vCronograma() {
    const ano = anoRef();
    const porMes = MES_LONGO.map((_, m) => treinamentosDoMes(ano, m));
    const m0 = porMes.findIndex(l => l.length), m1 = 11 - porMes.slice().reverse().findIndex(l => l.length);
    const total = soma(porMes, l => l.length);
    const nav = '<div class="toolbar"><b class="ano-tit">Calendário de treinamentos – ' + ano + '</b>' +
      '<span style="color:var(--ink-3);font-size:12.5px">' + total + ' treinamento(s) · fonte: ' + ((S.dados.calendario || []).length ? 'aba Calendario' : 'turmas cadastradas') + '</span>' + botaoNovaTurma() + '</div>';
    if (m0 < 0) return nav + '<div class="card empty">Nenhum treinamento em ' + ano + '.</div>';

    const qtd = m1 - m0 + 1;
    const colunas = qtd <= 2 ? qtd : qtd <= 4 ? 2 : 3;
    const linhas = Math.ceil(qtd / colunas);
    const blocos = porMes.slice(m0, m1 + 1).map((lista, k) => {
      const m = m0 + k;
      const atual = ano === HOJE.getFullYear() && m === HOJE.getMonth();
      return '<div class="card panel flush tr-card' + (atual ? ' atual' : '') + '">' +
        '<div class="tr-mes">' + MES_LONGO[m].toUpperCase() + (atual ? ' <span>· mês atual</span>' : '') + pager('ano-' + m) + '</div>' +
        '<div class="tr-head larga"><span>Período</span><span>Treinamento</span><span>Vagas</span><span>Local/Obs</span></div>' +
        caixa('ano-' + m, lista.map(x => linhaTreinamento(x, true)).join('') || '<div class="empty">Sem treinamentos.</div>') + '</div>';
    }).join('');
    return nav + '<div class="ano-grid grow" style="grid-template-columns:repeat(' + colunas + ', minmax(0, 1fr));grid-template-rows:repeat(' + linhas + ', minmax(0, 1fr))">' + blocos + '</div>';
  }

  /* ---------- Turmas ---------- */

  function vTurmas() {
    const ord = {
      inicio: (a, b) => String(a.inicio).localeCompare(String(b.inicio)),
      progresso: (a, b) => a.st.pct - b.st.pct,
      vencidas: (a, b) => b.st.venc - a.st.venc,
      nome: (a, b) => nomeLongo(a).localeCompare(nomeLongo(b), 'pt-BR')
    }[S.turmasOrdem];
    const ts = turmasF().slice().sort(ord);

    const barraFerr = '<div class="toolbar">' + segmento('turmasModo', [['cards', 'Cartões'], ['tabela', 'Tabela']]) +
      '<select id="ordTurmas" class="ghost">' +
      [['inicio', 'Ordenar por início'], ['progresso', 'Menor progresso'], ['vencidas', 'Mais vencidas'], ['nome', 'Nome']]
        .map(o => '<option value="' + o[0] + '"' + (S.turmasOrdem === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '</select><span style="color:var(--ink-3);font-size:12.5px">' + ts.length + ' turma(s)</span>' + botaoNovaTurma() + pager('turmas-' + S.turmasModo) + '</div>';

    if (!ts.length) return barraFerr + '<div class="card empty">Nenhuma turma no filtro.</div>';

    if (S.turmasModo === 'tabela') {
      const cols = 'grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) 84px 84px 112px 64px minmax(110px,1fr) 64px 70px';
      return barraFerr + '<div class="card flush panel grow">' +
        '<div class="gt-head" style="' + cols + '"><span>Curso</span><span>Cidade / turma</span><span>Unidade</span><span>Início</span><span>Término</span><span>Situação</span><span>Etapas</span><span>Conclusão</span><span>Vencidas</span><span>Formados</span></div>' +
        caixa('turmas-tabela', ts.map(t =>
          '<div class="gt-row click" style="' + cols + '" data-turma="' + t.id + '"><b title="' + esc(nomeCurso(t)) + '">' + esc(nomeCurso(t)) + '</b><span>' + esc(t.onde || '—') + '</span><span>' + esc(t.unidade || '') + '</span>' +
          '<span class="mono">' + fmtAno(t.inicio) + '</span><span class="mono">' + fmtAno(t.fim) + '</span><span>' + pillSit(t.sit) + '</span>' +
          '<span class="mono">' + t.st.feito + '/' + t.st.total + '</span><span style="display:flex;gap:8px;align-items:center">' + barra(t.st) + '<span class="pct">' + Math.round(t.st.pct) + '%</span></span>' +
          '<span class="mono" style="color:' + (t.st.venc ? 'var(--danger)' : 'inherit') + '">' + (t.st.venc || '—') + '</span><span class="mono">' + (t.formados != null ? t.formados : '—') + '</span></div>').join('')) +
        '</div>';
    }

    return barraFerr + '<div class="grow" style="display:flex;flex-direction:column">' + caixa('turmas-cards', ts.map(t => {
      const n = t.sit === 'plan' ? dias(t.inicio) : null;
      return '<div class="card tcard" data-turma="' + t.id + '">' +
        '<div class="top"><span><span class="tag" title="' + esc(nomeCurso(t)) + '">' + esc(cursoCurto(nomeCurso(t))) + '</span> <span class="tag un">' + esc(t.unidade || '') + '</span></span>' + pillSit(t.sit) + '</div>' +
        '<div><h3 title="' + esc(nomeCurso(t)) + '">' + esc(nomeCurso(t)) + '</h3><div class="s">' + (t.onde ? '<b>' + esc(t.onde) + '</b> · ' : '') + fmt(t.inicio) + ' a ' + fmtAno(t.fim) +
        (t.duracao ? ' · ' + t.duracao + 'd' : '') + (n !== null && n >= 0 ? ' · começa ' + relativo(n) : '') + '</div></div>' +
        '<div>' + barra(t.st) + '<div class="nums" style="margin-top:6px"><span><b>' + t.st.feito + '</b> feitas · <b>' + t.st.exec + '</b> exec. · <b>' + t.st.pend + '</b> pend.</span><span class="pct">' + Math.round(t.st.pct) + '%</span></div></div>' +
        '<div class="foot-line"><div class="flags">' + bandeiras(t) + '</div>' +
        (t.st.venc && t.sit !== 'canc' ? '<span class="alert-line">⚠ ' + t.st.venc + '</span>' : '') + '</div></div>';
    }).join(''), 'g-cards') + '</div>';
  }

  function bandeiras(t) {
    return [['licitacao', 'Licitação'], ['docenteExterno', 'Docente ext.'], ['avaliacao', 'Avaliação'], ['diaria', 'Diária'], ['mais8dias', '> 8 dias'], ['autorizacaoDiaria', 'Autoriz. diária']]
      .filter(([k]) => t[k] !== undefined && t[k] !== '')
      .map(([k, l]) => { const v = norm(t[k]); return '<span class="flag ' + (v === 'sim' ? 'sim' : /definir/.test(v) ? 'def' : '') + '" data-tip="<b>' + l + '</b>' + esc(t[k]) + '">' + l + '</span>'; }).join('');
  }

  const segmento = (chave, ops) => '<div class="seg" data-seg="' + chave + '">' +
    ops.map(([k, l]) => '<button data-val="' + k + '" class="' + (S[chave] === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';

  /* ---------- Etapas ---------- */

  function vEtapas() {
    const todas = etapasF().filter(e => S.fasesEtapas[e.fase] || (['ANTES', 'DURANTE', 'DEPOIS'].indexOf(e.fase) < 0 && S.fasesEtapas.DEPOIS));
    const abertas = todas.filter(e => !concluida(e));

    const chips = '<div class="seg fases-sel">' + [['ANTES', 'Antes do início'], ['DURANTE', 'Durante'], ['DEPOIS', 'Depois']]
      .map(([k, l]) => '<button data-fasechip="' + k + '" class="' + (S.fasesEtapas[k] ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
    const barraFerr = '<div class="toolbar">' + chips + segmento('etapasModo', [['quadro', 'Quadro'], ['tabela', 'Tabela']]) +
      (S.etapasModo === 'tabela' ? '<label class="switch"><input type="checkbox" id="chkConcl"' + (S.etapasConcluidas ? ' checked' : '') + '><span></span>Mostrar concluídas</label>' : '') +
      '<span style="color:var(--ink-3);font-size:12.5px">' + abertas.length + ' em aberto · ' + (todas.length - abertas.length) + ' concluídas</span>' +
      (S.etapasModo === 'tabela' ? pager('etapas-tabela') : '') + '</div>';

    if (S.etapasModo === 'tabela') {
      const lista = (S.etapasConcluidas ? todas : abertas).slice();
      const k = S.tbl.chave, dir = S.tbl.asc ? 1 : -1;
      lista.sort((a, b) => String(a[k] || '\uffff').localeCompare(String(b[k] || '\uffff'), 'pt-BR') * dir);
      const cols = 'grid-template-columns:150px minmax(0,2.4fr) minmax(0,1.4fr) 74px minmax(0,1fr) minmax(0,1.3fr) 156px';
      const cab = [['prazo', 'Prazo'], ['etapa', 'Etapa'], ['turma', 'Turma'], ['fase', 'Fase'], ['responsavel', 'Responsável'], ['documento', 'Documento'], ['status', 'Status']];
      return barraFerr + '<div class="card flush panel grow">' +
        '<div class="gt-head" style="' + cols + '">' + cab.map(([c, l]) => '<span data-sort="' + c + '" class="' + (k === c ? 'sorted' + (S.tbl.asc ? ' asc' : '') : '') + '">' + l + '</span>').join('') + '</div>' +
        caixa('etapas-tabela', lista.map(e =>
          '<div class="gt-row" style="' + cols + '"><span><span class="mono">' + fmt(e.prazo) + '</span> ' + badgeDias(e) + '</span>' +
          '<span title="' + esc(e.etapa) + '">' + esc(e.etapa) + '</span><a href="#" data-turma="' + e.turmaId + '">' + esc(nomeDaEtapa(e)) + '</a>' +
          '<span><span class="tag">' + esc(e.fase) + '</span></span><span>' + seletorResp(e) + '</span>' +
          '<span class="dim">' + esc(e.documento) + '</span><span class="b-r">' + seletor(e) + (S.dados.podeEditar ? botaoEditar(e.id) : '') + '</span></div>').join('') || '<div class="empty">Nenhuma etapa.</div>') +
        '</div>';
    }

    const colunas = [
      { k: 'late', l: 'Vencidas', f: n => n !== null && n < 0 },
      { k: 'soon', l: 'Próximos 7 dias', f: n => n !== null && n >= 0 && n <= 7 },
      { k: 'mes', l: '8 a 30 dias', f: n => n !== null && n > 7 && n <= 30 },
      { k: 'depois', l: 'Mais de 30 dias', f: n => n === null || n > 30 }
    ];
    return barraFerr + '<div class="board grow">' + colunas.map(c => {
      const itens = abertas.filter(e => c.f(dias(e.prazo))).sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)));
      return '<div class="col ' + c.k + '"><div class="col-head"><span>' + c.l + '</span><span class="count">' + itens.length + '</span>' + pager('col-' + c.k) + '</div>' +
        caixa('col-' + c.k, itens.map(e =>
          '<div class="ecard"><div class="t">' + esc(e.etapa) + '</div>' +
          '<div class="s2"><span class="s" data-turma="' + e.turmaId + '">' + esc(nomeDaEtapa(e)) + '</span>' + seletorResp(e) + '</div>' +
          '<div class="b">' + badgeDias(e) + '<span class="b-r">' + seletor(e) + (S.dados.podeEditar ? botaoEditar(e.id) : '') + '</span></div></div>').join('') || '<div class="empty">Nada aqui.</div>') + '</div>';
    }).join('') + '</div>';
  }

  /* ---------- Formandos ---------- */

  function vFormandos() {
    const f = formandosF();
    const b = norm(S.f.busca);
    const lista = b ? f.filter(x => norm([x.curso, cursoDoFormando(x), x.turma, x.local].join(' ')).indexOf(b) >= 0) : f;
    const res = resolucaoDoAno(anoRef());
    const resIdx = {}; res.forEach(r => { resIdx[r.grupo] = r; });
    const estDe = x => estimativaPorTurma(resIdx[cursoDoFormando(x)]);
    const matr = x => x.matriculados != null ? x.matriculados : estDe(x);
    const total = soma(f, x => x.formados);
    const totMatr = soma(f, x => matr(x) || 0);
    const estimados = f.filter(x => x.matriculados == null && estDe(x)).length;
    const encerradas = f.filter(x => { const t = turmaDoFormando(x); return t && t.sit === 'enc' && matr(x); });
    const aprov = soma(encerradas, x => matr(x)) ? Math.round(soma(encerradas, x => x.formados) / soma(encerradas, x => matr(x)) * 100) : null;

    // Resolução × planilha, por curso
    const linhas = res.filter(r => !S.f.curso || r.grupo === S.f.curso).filter(r => !S.f.unidade || r.unidade === S.f.unidade).map(r => {
      const ts = S.dados.turmas.filter(t => nomeCurso(t) === r.grupo && t.sit !== 'canc');
      const fs = f.filter(x => cursoDoFormando(x) === r.grupo);
      return { r: r, cad: ts.length, matr: soma(fs, x => matr(x) || 0), form: soma(fs, x => x.formados) };
    });
    const colsR = 'grid-template-columns:minmax(0,1fr) 70px 64px 64px 64px';
    const corT = l => l.cad === l.r.turmas ? '' : l.cad > l.r.turmas ? 'color:var(--warn)' : 'color:var(--danger)';
    const resHtml = linhas.map(l => '<div class="gt-row" style="' + colsR + '"><span title="' + esc(l.r.cursos.join('\n')) + '">' + esc(l.r.grupo) +
      '<small class="dim" style="display:block">' + esc(cursoCurto(l.r.grupo)) + ' · ' + esc(l.r.unidade) + ' · ' + esc(l.r.status || '') + '</small></span>' +
      '<span class="mono" style="text-align:right;' + corT(l) + '" title="cadastradas na planilha / previstas na Resolução">' + l.cad + ' / ' + l.r.turmas + '</span>' +
      '<span class="mono" style="text-align:right">' + l.r.alunos + '</span><span class="mono" style="text-align:right">' + l.matr + '</span>' +
      '<span class="mono" style="text-align:right;font-weight:600">' + l.form + '</span></div>').join('');

    const colsT = 'grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 92px 86px 40px';
    const num = (x, campo, valor, ph) => S.dados.podeEditar && x.linha
      ? '<input class="num-in" type="number" min="0" step="1" data-formando="' + S.dados.formandos.indexOf(x) + '" data-campo-f="' + campo + '" value="' + (valor == null ? '' : valor) + '"' +
        (ph != null ? ' placeholder="' + ph + '"' : '') + ' title="Digite e aperte Enter para gravar"' + (S.salvando ? ' disabled' : '') + '>'
      : '<span class="mono">' + (valor == null ? '—' : valor) + '</span>';
    const pct = x => { const m = matr(x); return m && x.formados ? Math.round(x.formados / m * 100) + '%' : ''; };

    return '<div class="grid g-kpi k4">' +
      kpi('Previstos na Resolução', soma(res, r => r.alunos), '', 'alunos em ' + anoRef() + ' · ' + soma(res, r => r.turmas) + ' turmas') +
      kpi('Matriculados', totMatr, '', estimados ? estimados + ' turma(s) com estimativa da Resolução' : 'informados por turma') +
      kpi('Formados', total, '', 'militares em ' + anoRef()) +
      kpi('Aproveitamento', aprov == null ? '—' : aprov, aprov == null ? '' : '%', 'formados ÷ matriculados (turmas encerradas)') +
      '</div><div class="grid grow" style="grid-template-columns:1.05fr 1fr">' +
      '<div class="card flush panel"><div class="card-head"><h2>Resolução ' + anoRef() + '</h2><span class="meta">turmas: planilha / Resolução</span>' + pager('f-res') + '</div>' +
      '<div class="gt-head" style="' + colsR + ';margin-top:8px"><span>Curso no SiGE</span><span style="text-align:right">Turmas</span><span style="text-align:right">Alunos</span><span style="text-align:right">Matric.</span><span style="text-align:right">Form.</span></div>' +
      caixa('f-res', resHtml || '<div class="empty">Sem cursos na aba Resolução para ' + anoRef() + '.</div>') + '</div>' +
      '<div class="card flush panel"><div class="card-head"><h2>Por turma</h2><span class="meta">edite e aperte Enter · vazio = estimativa</span>' + pager('f-turma') + '</div>' +
      '<div class="gt-head" style="' + colsT + ';margin-top:8px"><span>Curso</span><span>Turma</span><span style="text-align:right">Matriculados</span><span style="text-align:right">Formados</span><span></span></div>' +
      caixa('f-turma', lista.map(x => '<div class="gt-row" style="' + colsT + (x.formados ? '' : ';color:var(--ink-3)') + '">' +
        '<span title="' + esc(cursoDoFormando(x)) + '">' + esc(cursoCurto(cursoDoFormando(x))) + '</span><span title="' + esc(x.turma + (x.local ? ' · ' + x.local : '')) + '">' + esc((turmaDoFormando(x) && turmaDoFormando(x).onde) || x.turma) + '</span>' +
        '<span style="text-align:right">' + num(x, 'matriculados', x.matriculados, estDe(x)) + '</span>' +
        '<span style="text-align:right">' + num(x, 'formados', x.formados) + '</span><span class="mono dim" style="text-align:right">' + pct(x) + '</span></div>').join('')) +
      '</div></div>';
  }

  /* ---------- Regras ---------- */

  function vRegras() {
    const b = norm(S.f.busca);
    const rs = (S.dados.regras || []).filter(r => !b || norm(Object.values(r).join(' ')).indexOf(b) >= 0);
    if (!rs.length) return '<div class="card empty">Nenhuma regra encontrada.</div>';
    return '<div class="toolbar"><span style="color:var(--ink-3);font-size:12.5px">' + rs.length + ' regra(s)</span>' + pager('regras') + '</div>' +
      '<div class="grow" style="display:flex;flex-direction:column">' + caixa('regras', rs.map(r =>
        '<div class="card rule"><div style="display:flex;justify-content:space-between"><span class="code">' + esc(r.codigo) + '</span><span class="tag">' + esc(r.natureza) + '</span></div>' +
        '<h3>' + esc(r.etapa) + '</h3><div class="prazo">' + esc(r.prazo) + '</div>' +
        '<dl><dt>Contagem</dt><dd>' + esc(r.contagem) + '</dd><dt>Referência</dt><dd>' + esc(r.marco) + '</dd><dt>Aplica-se</dt><dd>' + esc(r.aplicabilidade) + '</dd></dl>' +
        (r.observacoes ? '<div class="obs">' + esc(r.observacoes) + '</div>' : '') + '</div>').join(''), 'g-rules') + '</div>';
  }

  /* ================================================================ */
  /* Drawer da turma: dados à esquerda, checklist paginado à direita   */
  /* ================================================================ */

  function abrirTurma(id) {
    const t = S.turmaIdx[id]; if (!t) return;
    if (S.drawer !== id) { S.fase = 'ANTES'; delete S.pg['d-steps']; }
    if (S.edit && S.edit.id !== id && !(S.edit.tipo === 'etapa' && S.idx[S.edit.id] && S.idx[S.edit.id].turmaId === id)) S.edit = null;
    S.drawer = id;
    const es = S.dados.etapas.filter(e => e.turmaId === id);
    const nIni = dias(t.inicio);
    const fases = ['ANTES', 'DURANTE', 'DEPOIS'].filter(f => es.some(e => e.fase === f));
    es.forEach(e => { if (fases.indexOf(e.fase) < 0) fases.push(e.fase); });
    if (fases.indexOf(S.fase) < 0) S.fase = fases[0] || 'ANTES';
    const pode = S.dados.podeEditar;

    let lista = es.filter(e => e.fase === S.fase);
    if (S.soPendentes) lista = lista.filter(e => !concluida(e) || (S.edit && S.edit.id === e.id));
    const steps = lista.map(e => {
      if (S.edit && S.edit.tipo === 'etapa' && S.edit.id === e.id) return formEtapa(e);
      const n = dias(e.prazo), late = !concluida(e) && n !== null && n < 0;
      const cls = e.status === 'Feito' ? 'done' : e.status === 'Não se aplica' ? 'na' : late ? 'late' : '';
      return '<div class="step ' + cls + '"><div class="chk">' + (cls === 'done' ? '✓' : cls === 'na' ? '–' : '') + '</div>' +
        '<div style="min-width:0"><div class="t" title="' + esc(e.etapa) + '">' + esc(e.etapa) + '</div>' +
        '<div class="m">Prazo ' + fmtAno(e.prazo) + (e.documento ? ' · ' + esc(e.documento) : '') +
        (e.conclusao ? ' · concluída ' + fmt(e.conclusao) : '') + (e.observacoes ? ' · 💬 ' + esc(e.observacoes) : '') + '</div></div>' +
        '<div class="r">' + badgeDias(e) + seletorResp(e) + seletor(e) + (pode ? botaoEditar(e.id) : '') + '</div></div>';
    }).join('');

    const rotFase = f => f === 'ANTES' ? 'Antes do início' : titulo(f);
    const abas = fases.map(f => [f, rotFase(f), es.filter(e => e.fase === f)]);
    const link = S.dados.url && t.gid != null ? S.dados.url.split('#')[0] + '#gid=' + t.gid + (t.linhaResumo ? '&range=A' + t.linhaResumo : '') : '';
    const kvSim = v => '<dd class="' + (norm(v) === 'sim' ? 'sim' : '') + '">' + esc(v || '—') + '</dd>';
    const editandoTurma = S.edit && S.edit.id === id && (S.edit.tipo === 'turma' || S.edit.tipo === 'cancelar');

    const cabecalho =
      '<div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="tag" title="Curso no SiGE">' + esc(cursoCurto(nomeCurso(t))) + '</span>' +
      (t.unidade ? '<span class="tag un" title="Unidade executora">' + esc(t.unidade) + '</span>' : '') + pillSit(t.sit) + '</div>' +
      '<h2>' + esc(nomeCurso(t)) + '</h2><div class="sub">' + (t.onde ? '<b>' + esc(t.onde) + '</b> · ' : '') + (t.local && t.local !== t.cidade ? esc(t.local) + ' · ' : '') + fmtAno(t.inicio) + ' a ' + fmtAno(t.fim) +
      (t.duracao ? ' · ' + t.duracao + ' dia(s)' : '') + '<br><small class="dim">na planilha: ' + esc(t.turma) + '</small>' + (link ? ' · <a href="' + esc(link) + '" target="_blank" rel="noopener">abrir ↗</a>' : '') + '</div>' +
      (pode && !editandoTurma ? '<button class="btn small" data-acao="editar-turma" style="margin-top:8px">✎ Editar curso, cidade, datas ou cancelar</button>' : '') + '</div>';

    const resumo =
      '<div class="d-kpis">' + dk('Conclusão', Math.round(t.st.pct) + '%') + dk('Etapas', t.st.feito + '/' + t.st.total) +
      dk('Vencidas', '<span style="color:' + (t.st.venc ? 'var(--danger)' : 'inherit') + '">' + t.st.venc + '</span>') +
      (t.sit === 'plan' && nIni !== null ? dk('Início', nIni + ' dias') : dk('Formados', t.formados != null ? t.formados : '—')) + '</div>' +
      '<div style="flex:none;display:flex">' + barra(t.st) + '</div>' +
      (t.prazoPlanejamento || t.prazoFinalizacao ? '<div class="d-section"><h3>Janela de trabalho</h3><dl class="kv">' +
        '<dt>Prazo de planejamento</dt><dd>' + fmtAno(t.prazoPlanejamento) + ' <small>' + relativo(dias(t.prazoPlanejamento)) + '</small></dd>' +
        '<dt>Execução</dt><dd>' + fmt(t.inicio) + ' a ' + fmt(t.fim) + '</dd>' +
        '<dt>Prazo de finalização</dt><dd>' + fmtAno(t.prazoFinalizacao) + ' <small>' + relativo(dias(t.prazoFinalizacao)) + '</small></dd></dl></div>' : '') +
      (bandeiras(t) ? '<div class="d-section"><h3>Matriz de decisão</h3><dl class="kv">' +
        [['licitacao', 'Licitação'], ['docenteExterno', 'Docente externo'], ['avaliacao', 'Avaliação'], ['diaria', 'Diária'], ['mais8dias', 'Curso > 8 dias'], ['autorizacaoDiaria', 'Autorização prévia de diária']]
          .map(([k, l]) => '<dt>' + l + '</dt>' + kvSim(t[k])).join('') + '</dl></div>' : '') +
      (t.observacoes ? '<div class="d-section"><h3>Observações</h3><div class="obs-box" title="' + esc(t.observacoes) + '">' + esc(t.observacoes) + '</div></div>' : '');

    $('#drawer').innerHTML = '<button class="close" data-fechar title="Fechar (Esc)">✕</button><div class="d-grid">' +
      '<div class="d-left">' + cabecalho + (editandoTurma ? formTurma(t) : resumo) + '</div>' +
      '<div class="d-right"><div class="d-right-head"><h3>Checklist</h3>' +
        '<div class="seg">' + abas.map(([k, l, x]) => '<button data-fasetab="' + k + '" class="' + (S.fase === k ? 'on' : '') + '">' + l + ' <small style="color:var(--ink-3)">' + x.filter(concluida).length + '/' + x.length + '</small></button>').join('') + '</div>' +
        '<label class="switch"><input type="checkbox" id="chkPend"' + (S.soPendentes ? ' checked' : '') + '><span></span>Só em aberto</label>' +
        pager('d-steps') + '</div>' +
        caixa('d-steps', steps || '<div class="empty">' + (es.length ? 'Nada em aberto aqui. ✓' : 'Esta turma não tem aba operacional vinculada.') + '</div>') +
      '</div></div>' +
      '<datalist id="dl-resp">' + responsaveis().map(r => '<option value="' + esc(r) + '">').join('') + '</datalist>';

    $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false');
    $('#drawerBg').classList.add('open');
    paginarTudo($('#drawer'));
    const foco = $('#drawer [data-campo]');
    if (foco && S.edit && !S.salvando && !$('#drawer').contains(document.activeElement)) foco.focus();
  }

  /* ---------- formulários de edição ---------- */

  const campo = (rotulo, k, v, tipo, extra) => '<label class="fld"><span>' + rotulo + '</span>' +
    (tipo === 'textarea'
      ? '<textarea data-campo="' + k + '" rows="3"' + (S.salvando ? ' disabled' : '') + '>' + esc(v || '') + '</textarea>'
      : '<input type="' + tipo + '" data-campo="' + k + '" value="' + esc(v || '') + '"' + (extra || '') + (S.salvando ? ' disabled' : '') + '>') + '</label>';
  const botao = (acao, txt, cls) => '<button class="btn ' + (cls || '') + '" data-acao="' + acao + '"' + (S.salvando ? ' disabled' : '') + '>' +
    (S.salvando && /^(primary|danger)$/.test(cls || '') ? 'Salvando…' : txt) + '</button>';
  const botaoEditar = id => '<button class="icon-btn" data-acao="editar-etapa" data-id="' + id + '" title="Editar responsável, documento, observações e data de conclusão">✎</button>';

  function responsaveis() {
    return Array.from(new Set((S.dados.responsaveis || []).concat(S.dados.etapas.map(e => e.responsavel)).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  }

  function formEtapa(e) {
    const c = S.edit.campos;

  function montarSeletorAno() {
    const anos = (S.dados.anos && S.dados.anos.length ? S.dados.anos : [anoRef()]).slice();
    const proximo = Math.max.apply(null, anos) + 1;
    $('#selAno').innerHTML = anos.map(a => '<option value="' + a + '"' + (a === anoRef() ? ' selected' : '') + '>Ano ' + a + '</option>').join('') +
      (S.dados.podeEditar ? '<option value="novo">＋ Criar ' + proximo + '…</option>' : '');
  }

  const botaoNovaTurma = () => S.dados.podeEditar ? '<button class="btn small primary" data-acao="nova-turma" style="margin-left:auto">＋ Nova turma</button>' : '';

  /** Abas de curso (com resumo de turmas) e o curso de cada uma. */
  function cursosComAba() {
    const m = {};
    S.dados.turmas.filter(t => t.aba).forEach(t => { if (!m[t.aba]) m[t.aba] = { aba: t.aba, curso: t.curso, area: t.area, turmas: [] }; m[t.aba].turmas.push(t); });
    return Object.keys(m).map(k => m[k]).sort((a, b) => a.curso.localeCompare(b.curso, 'pt-BR'));
  }
  function unidadeDoModelo(aba, modelo) {
    const t = S.dados.turmas.find(x => x.aba === aba && x.turma === modelo);
    return (t && t.unidade) || 'BPMRv';
  }
  function cursoDoModelo(aba, modelo) {
    const t = S.dados.turmas.find(x => x.aba === aba && x.turma === modelo);
    return t ? nomeCurso(t) : '';
  }
  function modeloPadrao(aba) {
    const c = cursosComAba().find(x => x.aba === aba);
    if (!c) return '';
    const ok = c.turmas.filter(t => t.sit !== 'canc').sort((a, b) => String(b.inicio).localeCompare(String(a.inicio)));
    return (ok[0] || c.turmas[0]).turma;
  }

          '<div class="form g2" style="margin-top:0">' + campo('Nome na planilha (opcional)', 'nome', c.nome, 'text', ' placeholder="automático: sigla - cidade"') +
            campo('Cidade', 'cidade', c.cidade, 'text', ' placeholder="Ex.: Juiz de Fora"') + '</div>' +
          '<div class="form g2" style="margin-top:0">' + campo('Início', 'inicio', c.inicio, 'date') + campo('Término', 'fim', c.fim, 'date') + '</div>' +
          '<div class="form g2" style="margin-top:0">' + campo('Local / unidade', 'local', c.local, 'text', ' placeholder="' + esc(mod ? mod.local : '') + '"') +
            campo('Vagas (alunos previstos)', 'vagas', c.vagas, 'text', ' placeholder="' + (estNova ? 'Resolução: ' + estNova + ' por turma' : 'Ex.: 40 vagas') + '"') + '</div>' +
          campoSel('Unidade executora', 'unidade', c.unidade, unidadesLista().map(u => [u, u])) +

          '<div class="hint">Também são criadas as linhas no Cadastro de Turmas, no Painel Geral, em Formandos e no Calendario. ' +

    } else {
      const origem = anoRef(), novo = origem + 1;
      const ex = new Date(origem, 9, 5), exS = new Date(ex.getTime() + 364 * DIA), exD = new Date(novo, 9, 5);
      const dsem = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
      const fx = d => dsem[d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
      const plano = planoDoAno(novo);
      const nRes = resolucaoDoAno(novo).length;
      const linhaPlano = p => '<div class="ano-curso' + (p.r ? '' : ' fora') + '"><div class="ano-c-h"><b title="' + esc(p.grupo) + '">' + esc(p.grupo) + '</b>' +
        '<span class="mono ' + (p.ok ? 'ok' : 'warn') + '">' + (p.r ? p.marcadas + ' / ' + p.r.turmas + ' turma(s) · ' + p.r.alunos + ' alunos' + (p.est ? ' · ~' + p.est + '/turma' : '') : 'fora da Resolução ' + novo) + '</span></div>' +
        '<div class="ano-c-t">' + (p.turmas.length ? p.turmas.map(t => '<label class="chk-t"><input type="checkbox" data-manter="' + t.id + '"' + (c.manter.indexOf(t.id) >= 0 ? ' checked' : '') + (S.salvando ? ' disabled' : '') + '>' +
          '<span title="' + esc(t.turma) + '">' + esc(t.onde || cursoCurto(nomeCurso(t))) + ' <small>' + fmt(t.inicio) + '</small></span></label>').join('')
          : '<span class="dim">Sem turma no espelho — inclua depois com <b>＋ Nova turma</b> (ou crie a aba do curso).</span>') + '</div></div>';
      html = '<h2>Criar o ano de ' + novo + '</h2><div class="sub">Cópia completa da planilha de ' + origem + ' (que não é alterada), já ajustada à <b>Resolução ' + novo + '</b>' +

        '. Marque as turmas que continuam; as desmarcadas entram como canceladas. Status das etapas voltam a “Pendente”; formados zerados; matriculados = estimativa da Resolução (editável).</div>' +
        '<div class="form g2" style="margin-top:12px">' +
          campoSel('Datas', 'modoDatas', c.modoDatas, [['semana', 'Mesmo dia da semana (' + fx(ex) + ' → ' + fx(exS) + ')'], ['data', 'Mesma data (' + fx(ex) + ' → ' + fx(exD) + ')']]) +
          campoSel('Já canceladas em ' + origem, 'canceladas', c.canceladas, [['manter', 'Copiar como canceladas'], ['reativar', 'Reativar']]) +
        '</div>' +
        '<div class="ano-plano-h"><h3>Turmas × Resolução ' + novo + '</h3>' + pager('ano-plano') + '</div>' +
        caixa('ano-plano', plano.map(linhaPlano).join('') || '<div class="empty">Nenhuma turma.</div>', 'ano-lista') +
